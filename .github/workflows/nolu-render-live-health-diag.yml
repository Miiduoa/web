name: nolu provider live health diagnostic

on:
  push:
    branches:
      - diag/nolu-render-live-health-20260911
    paths:
      - '.github/workflows/nolu-render-live-health-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Probe Render mirror health without failing diagnostic
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 -sS -o /tmp/render.json -w '%{http_code}' 'https://nolu-render-mirror.onrender.com/health')
          echo "Render HTTP $code"
          cat /tmp/render.json
          echo

      - name: Verify Netlify mirror health and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          health='https://nolu-mirror.netlify.app/health'
          code=$(curl --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 30 -sS -o /tmp/netlify-health.json -w '%{http_code}' "$health")
          echo "Netlify health HTTP $code"
          cat /tmp/netlify-health.json
          echo
          test "$code" = '200'
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/netlify-health.json'))
          print('provider=',data.get('provider'))
          print('storage=',data.get('storage'))
          print('configured=',data.get('configured'))
          print('ok=',data.get('ok'))
          print('status=',data.get('status'))
          if data.get('ok') is not True:
              raise SystemExit('Netlify mirror health is not OK')
          PY

          auth_code=$(curl --connect-timeout 10 --max-time 30 -sS -o /tmp/netlify-auth.json -w '%{http_code}' \
            -X POST 'https://nolu-mirror.netlify.app/mirror' \
            -H 'Origin: https://miiduoa.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"action":"get_snapshot"}')
          echo "Netlify unauthenticated mirror HTTP $auth_code"
          cat /tmp/netlify-auth.json
          echo
          test "$auth_code" = '401'
