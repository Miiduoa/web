name: One-time Nolu structure cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refactor-nolu.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nolu-refactor
  cancel-in-progress: false

jobs:
  refactor:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Refactor source
        run: |
          set -euo pipefail
          python3 .github/scripts/refactor_nolu.py
          for f in app.js cloud.js import.js social-router.js security.js account.js community.js replies.js discovery.js pwa.js planner.js admin.js privacy.js auth.js app-guard.js sw.js; do node --check "pu-plan/$f"; done
          grep -q 'class="auth-page"' pu-plan/index.html
          ! grep -q 'class="shell"' pu-plan/index.html
          grep -q 'class="shell"' pu-plan/app.html
          ! grep -q 'auth-gate' pu-plan/app.html
          echo 'Clean source files:'
          find pu-plan -maxdepth 1 -type f -printf '%f\n' | sort
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload cleaned site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './pu-plan'
      - name: Deploy cleaned site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Commit cleanup
        run: |
          rm -f .github/workflows/refactor-nolu.yml .github/scripts/refactor_nolu.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor: separate auth from app and remove legacy layers'
          git push
