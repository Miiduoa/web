name: temporary chat picker avatar patch
on:
  push:
    branches: [security/nolu-avatar-rendering-20260910]
    paths: ['.github/workflows/tmp-community-picker-hardening.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/nolu-avatar-rendering-20260910
      - name: Patch raw social avatar in new chat picker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pu-plan/community.js')
          s=p.read_text()
          old="${friends.map(f=>`<label class=\"friend-pick\"><input type=\"checkbox\" value=\"${esc(f.id)}\">${f.avatar?`<div class=\"avatar\"><img src=\"${esc(f.avatar)}\" alt=\"\"></div>`:`<div class=\"avatar\">${esc((f.name||'?').slice(0,1))}</div>`}<span>${esc(f.name)}<small>@${esc(f.username||'')}</small></span></label>`).join('')}"
          new="${friends.map(f=>{const src=cleanAvatar(f.avatar||f.avatar_data||'');return `<label class=\"friend-pick\"><input type=\"checkbox\" value=\"${esc(f.id)}\">${src?`<div class=\"avatar\"><img src=\"${esc(src)}\" alt=\"\"></div>`:`<div class=\"avatar\">${esc((f.name||'?').slice(0,1))}</div>`}<span>${esc(f.name)}<small>@${esc(f.username||'')}</small></span></label>`}).join('')}"
          if old not in s and new not in s: raise SystemExit('chat picker avatar target not found')
          p.write_text(s.replace(old,new))
          PY
          node --check pu-plan/community.js
          git diff --check
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pu-plan/community.js
          git commit -m 'security(nolu): sanitize chat picker avatars'
          git push origin HEAD:security/nolu-avatar-rendering-20260910
