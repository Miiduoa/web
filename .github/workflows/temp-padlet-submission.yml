name: Temporary Padlet Submission Check
on:
  push:
    branches:
      - automation/padlet-week5-20261014
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check classroom upload interface
        shell: bash
        run: |
          python -m pip install -q playwright
          python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          url="https://padlet.com/ypchang7/week-5-improving-delivery-handling-q-a-s024hdczqmywo85a6upl"
          async def main():
              async with async_playwright() as p:
                  browser=await p.chromium.launch(headless=True, executable_path='/usr/bin/google-chrome', args=['--no-sandbox'])
                  page=await browser.new_page(viewport={'width':1360,'height':900})
                  try:
                      r=await page.goto(url,timeout=45000,wait_until='domcontentloaded')
                      print("HTTP:",r.status if r else "NA", "URL:",page.url)
                      await page.wait_for_timeout(6000)
                      print("TITLE:",await page.title())
                      print("BODY:",(await page.locator('body').inner_text(timeout=10000))[:25000])
                      print("BUTTONS:",await page.locator('button').all_text_contents())
                      print("IFRAMES:", await page.locator('iframe').count())
                  except Exception as e:
                      print("ERROR:",str(e))
                  finally: await browser.close()
          asyncio.run(main())
          PY
