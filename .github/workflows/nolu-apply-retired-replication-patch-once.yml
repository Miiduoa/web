name: nolu apply retired replication patch once

on:
  push:
    branches: [fix/nolu-replication-retired-sync-20260911]
    paths:
      - '.github/scripts/patch-retired-replication.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/nolu-replication-retired-sync-20260911
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch-retired-replication.py
      - name: Validate syntax
        run: |
          node --check pu-plan/cloud-replication.js
          node --check pu-plan/provider-status.js
          node --check pu-plan/provider-mesh.js
      - name: Commit product patch
        run: |
          set -euo pipefail
          git config user.name 'Miiduoa'
          git config user.email '107848266+Miiduoa@users.noreply.github.com'
          git add pu-plan/cloud-replication.js pu-plan/provider-status.js pu-plan/provider-mesh.js
          git commit -m 'fix(nolu): fail safe when cross-region sync is retired'
          git push origin HEAD:fix/nolu-replication-retired-sync-20260911
