name: nolu replica v3 live smoke

on:
  push:
    branches: [main, fix/nolu-replica-v3-main-smoke-20260911]
    paths:
      - '.github/workflows/nolu-replica-v3-live-smoke.yml'
      - 'supabase/functions/pu-plan-replica-v3/**'
      - 'supabase/migrations/20260911_nolu_replica_v3_nonces.sql'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nolu-replica-v3-live-smoke.yml'
      - 'supabase/functions/pu-plan-replica-v3/**'
      - 'supabase/migrations/20260911_nolu_replica_v3_nonces.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-trust-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - name: Verify migration is fail-closed for browser roles
        run: |
          set -euo pipefail
          grep -q 'puplan_replica_v3_nonces' supabase/migrations/20260911_nolu_replica_v3_nonces.sql
          grep -q 'enable row level security' supabase/migrations/20260911_nolu_replica_v3_nonces.sql
          grep -q 'revoke all.*anon, authenticated' supabase/migrations/20260911_nolu_replica_v3_nonces.sql

      - name: Verify both live replica-v3 endpoints and signed peer probes
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://miiduoa.github.io'
          A='hrrmkrayvrgnwcroyttp'
          B='ltfurqaspqsvswmebyzw'
          for REF in "$A" "$B"; do
            URL="https://${REF}.supabase.co/functions/v1/pu-plan-replica-v3"
            tmp=$(mktemp)

            code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' "$URL" -H "Origin: $ORIGIN")
            echo "[$REF health] HTTP $code :: $(cat "$tmp")"
            test "$code" = 200
            grep -q '"protocol":"replica-v3"' "$tmp"
            grep -q '"alg":"Ed25519"' "$tmp"
            grep -q '"seed_direction":"primary-to-standby"' "$tmp"

            code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "$URL" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{"action":"peer_probe"}')
            echo "[$REF peer_probe] HTTP $code :: $(cat "$tmp")"
            test "$code" = 200
            grep -q '"peer_verified":true' "$tmp"

            code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "$URL" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{"action":"verify_probe","envelope":"not.a.valid.envelope"}')
            echo "[$REF forged probe] HTTP $code :: $(cat "$tmp")"
            test "$code" = 401
            grep -q 'REPLICA_SIGNATURE_INVALID' "$tmp"

            code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X OPTIONS "$URL" -H 'Origin: https://evil.example' -H 'Access-Control-Request-Method: POST')
            echo "[$REF evil origin] HTTP $code"
            test "$code" = 403
          done

          tmp=$(mktemp)
          code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "https://${A}.supabase.co/functions/v1/pu-plan-replica-v3" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{"action":"sync_and_prewarm"}')
          echo "[Mumbai unauth sync] HTTP $code :: $(cat "$tmp")"
          test "$code" = 401
          grep -Eq 'UNAUTHORIZED|SESSION_' "$tmp"

          code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "https://${B}.supabase.co/functions/v1/pu-plan-replica-v3" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{"action":"sync_and_prewarm"}')
          echo "[Tokyo reverse sync] HTTP $code :: $(cat "$tmp")"
          test "$code" = 503
          grep -q 'PRIMARY_REQUIRED' "$tmp"
