name: Clean Nolu frontend

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nolu-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Replace versioned assets with semantic modules
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import shutil

          root=Path('pu-plan')
          moves={
            'auth-v13.js':'auth.js',
            'community-v12.js':'community.js',
            'discovery-v16.js':'discover.js',
            'planner-v14.js':'planner.js',
            'admin-v14.js':'admin.js',
            'privacy-v19.js':'privacy.js',
            'pwa-v9.js':'pwa.js',
            'security-v17.js':'security.js',
            'import-v10.js':'import.js',
            'next-round.js':'semesters.js',
            'manifest-v9.webmanifest':'manifest.webmanifest',
            'sw-v9.js':'sw.js',
            'social-v6.css':'friends.css',
            'community-v12.css':'community.css',
            'discovery-v16.css':'discover.css',
            'admin-v14.css':'admin.css',
            'pwa-v8.css':'pwa.css',
          }
          for old,new in moves.items():
            src,dst=root/old,root/new
            if src.exists():
              if dst.exists(): dst.unlink()
              shutil.move(src,dst)

          # One boot file. No CSS injection, no router shim, no chained legacy loader.
          (root/'boot.js').write_text("""const asset=name=>new URL(name,import.meta.url).href;
          for(const [name,content] of [['apple-mobile-web-app-capable','yes'],['apple-mobile-web-app-status-bar-style','default'],['apple-mobile-web-app-title','Nolu']]){let m=document.querySelector(`meta[name=\"${name}\"]`);if(!m){m=document.createElement('meta');m.name=name;document.head.appendChild(m)}m.content=content}
          await import(asset('./security.js'));
          await import(asset('./auth.js'));
          await import(asset('./semesters.js'));
          await import(asset('./community.js'));
          await import(asset('./discover.js'));
          await import(asset('./pwa.js'));
          await import(asset('./planner.js'));
          await import(asset('./admin.js'));
          await import(asset('./privacy.js'));
          """,encoding='utf-8')

          # PWA uses semantic worker name.
          pwa=root/'pwa.js'
          s=pwa.read_text(encoding='utf-8').replace("asset('./sw-v9.js')","asset('./sw.js')")
          pwa.write_text(s,encoding='utf-8')

          # Service worker caches only the current production graph.
          (root/'sw.js').write_text("""const CACHE='nolu-clean-1';
          const CORE=['./','./style.css','./friends.css','./community.css','./discover.css','./admin.css','./pwa.css','./app.js','./cloud.js','./social-ui.js','./import.js','./boot.js','./security.js','./auth.js','./semesters.js','./community.js','./discover.js','./planner.js','./admin.js','./privacy.js','./pwa.js','./nolu-icon.svg','./manifest.webmanifest'];
          self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(CORE)).catch(()=>{}));self.skipWaiting()});
          self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim()});
          self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;const u=new URL(e.request.url);if(u.origin!==location.origin)return;e.respondWith(fetch(e.request).then(r=>{if(r.ok)caches.open(CACHE).then(c=>c.put(e.request,r.clone())).catch(()=>{});return r}).catch(()=>caches.match(e.request).then(r=>r||caches.match('./'))))});
          self.addEventListener('notificationclick',e=>{e.notification.close();const target=e.notification?.data?.url||new URL('./',self.location.href).href;e.waitUntil(clients.matchAll({type:'window',includeUncontrolled:true}).then(async ws=>{for(const w of ws){try{await w.navigate(target);return w.focus()}catch{}}return clients.openWindow(target)}))});
          """,encoding='utf-8')

          # HTML references only semantic current assets. Base CSS is last so layout rules win once, predictably.
          idx=root/'index.html'; html=idx.read_text(encoding='utf-8')
          css='''<link rel="stylesheet" href="friends.css">\n<link rel="stylesheet" href="community.css">\n<link rel="stylesheet" href="discover.css">\n<link rel="stylesheet" href="admin.css">\n<link rel="stylesheet" href="pwa.css">\n<link rel="stylesheet" href="style.css">'''
          html=html.replace('<link rel="stylesheet" href="style.css">',css)
          if 'rel="manifest"' not in html:
            html=html.replace('</title>','</title>\n<link rel="manifest" href="manifest.webmanifest">\n<link rel="apple-touch-icon" href="nolu-icon.svg">') if '</title>' in html else html
          html=html.replace('src="import-v10.js"','src="import.js"').replace('src="ai.js"','src="boot.js"')
          idx.write_text(html,encoding='utf-8')

          # Make reply editing deterministic: buttons never submit anything and backend permission flag is respected.
          c=root/'community.js'; js=c.read_text(encoding='utf-8')
          js=js.replace('<button data-edit-reply="${r.id}">編輯</button><button data-delete-reply="${r.id}">刪除</button>', '<button type="button" data-edit-reply="${r.id}">編輯</button><button type="button" data-delete-reply="${r.id}">刪除</button>')
          js=js.replace("${r.author_id===me.id?`<div class=\"reply-owner-actions\">", "${(r.can_edit||r.author_id===me.id)?`<div class=\"reply-owner-actions\">")
          c.write_text(js,encoding='utf-8')

          # Delete superseded / bridge assets. They must not stay available for old caches to accidentally load.
          obsolete=[
            'ai.js','boot-v9.js','import-v9.js','planner-v13.js','icon.svg',
            'social-router-v12.js','social-experience-v18.js'
          ]
          for name in obsolete:
            p=root/name
            if p.exists(): p.unlink()

          # Remove one-off refactor machinery after it has done its job.
          for p in [Path('.github/scripts/refactor_nolu.py'),Path('.github/workflows/refactor-nolu.yml')]:
            if p.exists(): p.unlink()
          PY

          cat > pu-plan/style.css <<'CSS'
          :root{
            --ink:#161616;--paper:#f6f3ed;--surface:#fffdfa;--muted:#777169;--soft:#ece8e1;
            --line:rgba(22,22,22,.11);--line-strong:rgba(22,22,22,.22);--lime:#d9ff63;
            --pink:#f1dfe5;--blue:#dfeaf4;--orange:#f2e3d1;--mint:#dfeada;--lav:#e6e1f2;
          }
          *{box-sizing:border-box}html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden;background:var(--paper);color:var(--ink)}
          html{scroll-behavior:smooth}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;letter-spacing:-.012em}
          button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}img,video,canvas,svg{max-width:100%}.hidden,[hidden]{display:none!important}.view{display:none}.view.on{display:block}

          /* 登入與品牌：沒有 absolute 疊字，手機與桌面各自有完整流式版面 */
          .auth-gate{position:fixed;inset:0;z-index:2000;display:grid;grid-template-columns:minmax(0,1.06fr) minmax(390px,.72fr);overflow:auto;background:var(--paper)}
          .auth-gate.off{display:none}.auth-poster{min-height:100dvh;padding:clamp(38px,6vw,78px);display:grid;grid-template-rows:auto 1fr auto auto;gap:18px;background:#ece7de}
          .auth-art{position:static!important;display:flex!important;align-items:center!important;align-self:start;gap:11px;margin:0!important;padding:0!important;transform:none!important;inset:auto!important;width:auto!important;height:auto!important;z-index:auto!important}
          .auth-art img{display:block;width:48px!important;height:48px!important;flex:0 0 48px;object-fit:contain}.hang-wordmark{display:block;font-size:39px!important;line-height:1!important;font-weight:850;letter-spacing:-.065em;white-space:nowrap}
          .auth-poster h2{position:static!important;align-self:end;margin:0!important;max-width:650px;font-size:clamp(48px,6vw,76px)!important;line-height:.98!important;letter-spacing:-.07em;font-weight:850;transform:none!important}
          .auth-poster p{position:static!important;margin:0!important;max-width:520px;color:var(--muted);font-size:15px;line-height:1.6;font-weight:620;transform:none!important}
          .auth-card{min-height:100dvh;padding:clamp(32px,5vw,58px);display:flex;flex-direction:column;justify-content:center;background:var(--surface)}
          .auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:#ece8e1}.auth-tabs button{min-height:46px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:760}.auth-tabs button.on{background:var(--ink);color:#fff}
          .auth-form{display:grid;gap:13px}.auth-form h3{margin:28px 0 9px;font-size:30px;line-height:1.08;letter-spacing:-.045em}.auth-form label,.label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:720}.auth-form small{font-size:10px;line-height:1.45;font-weight:520}.auth-submit{width:100%;min-height:51px;margin-top:8px}.guest{align-self:center;margin-top:18px;border:0;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:4px;font-weight:650}.auth-status{min-height:22px;margin-top:8px;font-size:12px}

          /* 共用元件 */
          .btn,.account-chip{min-height:39px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:none;padding:0 14px;font-weight:700}.btn:hover,.account-chip:hover{background:#f1ede6}.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.lime{background:var(--lime);border-color:transparent}.btn.danger{background:#fff1f1;color:#983c3c;border-color:#e7caca}
          .field,.search{width:100%;min-width:0;border:1px solid transparent;border-radius:14px;background:#efebe4;padding:11px 13px;outline:none}.field:focus,.search:focus{background:#fff;border-color:var(--line-strong)}
          .panel,.setting-card,.ai-card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:none}.panel{padding:14px}.avatar,.mini-avatar{overflow:hidden;border-radius:50%;background:#e7e3db;display:grid;place-items:center;font-weight:800}.avatar img,.mini-avatar img{width:100%;height:100%;object-fit:cover}.mini-avatar{width:30px;height:30px}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{color:var(--muted);line-height:1.6}.kicker{display:none}

          /* App frame */
          .shell{max-width:1480px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:20px 14px;background:#faf8f3;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30}.brand{display:flex;align-items:center;gap:10px;padding:5px 7px 22px}.mark{width:36px;height:36px;flex:0 0 36px;border-radius:11px;overflow:hidden}.mark img{display:block;width:100%;height:100%}.brand strong{display:block;font-size:18px;line-height:1;font-weight:850;letter-spacing:-.05em}.brand span{display:block;margin-top:3px;color:var(--muted);font-size:10px}.nav{display:grid;gap:4px}.nav button{min-height:44px;border:0;border-radius:13px;background:transparent;text-align:left;padding:0 13px;color:#514c45;font-size:14px;font-weight:690}.nav button:hover{background:rgba(0,0,0,.045)}.nav button.on,.nav button[data-community-open].on{background:var(--ink);color:#fff}.semester{margin-top:auto;padding:14px 9px;color:var(--muted)}.semester b{display:block;color:var(--ink);font-size:12px}.semester span{font-size:10px;line-height:1.55}
          .main{min-width:0;padding:0 34px 110px}.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 -34px 22px;padding:17px 34px 12px;background:rgba(246,243,237,.93);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.topbar h1{margin:0;font-size:28px;line-height:1.1;letter-spacing:-.045em}.actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.account-chip{display:flex;align-items:center;gap:7px;padding:4px 10px 4px 5px}

          /* 課表 */
          .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;margin-bottom:12px}.hero-main,.hero-side{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:none}.hero-main{padding:24px;overflow:hidden}.hero-main:after{display:none!important}.hero-main h2{margin:0 0 9px;font-size:clamp(30px,4vw,48px);line-height:1.02;letter-spacing:-.055em}.hero-main p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.quote{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:600}.hero-side{display:flex;padding:8px}.stat{min-width:92px;padding:13px 14px;border-left:1px solid var(--line);text-align:left}.stat:first-child{border-left:0}.stat b{display:block;font-size:28px;line-height:1}.stat span{font-size:10px;color:var(--muted)}
          .schedule-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 9px}.view-switch,.presentation-switch,.friend-tools{display:flex;width:max-content;gap:3px;padding:3px;border:0;border-radius:999px;background:#e9e5de;box-shadow:none}.view-switch button,.presentation-switch button,.friend-tools button{min-height:34px;border:0;border-radius:999px;background:transparent;padding:0 13px;color:var(--muted);font-size:12px;font-weight:720}.view-switch button.on,.presentation-switch button.on,.friend-tools button.on{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(0,0,0,.07)}
          .now-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:10px 0 14px}.now-card,.human-day,.human-course,.human-onboarding,.mobile-course{border:1px solid var(--line)!important;border-radius:18px!important;background:var(--surface)!important;box-shadow:none!important}.now-card{padding:14px;min-height:118px}.human-week{gap:9px}.human-day{overflow:hidden}.human-day>header,.human-day.today>header{background:#f1ede6!important;color:var(--ink)!important;border-bottom:1px solid var(--line)!important}.human-course:hover{transform:none!important;box-shadow:none!important}.human-course-time{border-right:1px solid var(--line)!important;background:#f5f1ea}.human-gap{border-left:1px dashed #bbb4aa!important}.human-free{border:1px dashed #ccc5ba!important;border-radius:16px!important;background:#faf8f4!important}.class-pulse{border:1px solid var(--line)!important;border-radius:20px!important;background:var(--ink)!important;color:#fff!important;box-shadow:none!important}.class-pulse strong{color:var(--lime)!important}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:none}.grid{min-width:900px;background:#fff}.cell{border-color:#e7e2d9}.head{background:#f0ece4!important;color:var(--ink)!important}.time{background:#f8f5ef!important}.course{border:1px solid rgba(0,0,0,.09)!important;border-radius:10px!important;box-shadow:none!important}.course:hover{transform:none!important;box-shadow:none!important}.mobile-list{display:none;gap:8px}

          /* 找人、安排、我的 */
          .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}.section-head h2{margin:0 0 5px;font-size:30px;line-height:1.08;letter-spacing:-.045em}.section-head p{max-width:640px;margin:0;color:var(--muted);font-size:13px;line-height:1.5}.friend-layout{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:12px}.friend-side,.friend-main>.panel,#friendView{border:1px solid var(--line)!important;border-radius:22px!important;background:var(--surface)!important;box-shadow:none!important}.friend-card{border:0!important;border-radius:15px!important;box-shadow:none!important}.friend-card:hover,.friend-card.on{background:#efebe4!important}.social-stat,.social-stat.blue,.social-stat.pink,.social-highlight{border:1px solid var(--line)!important;border-radius:17px!important;background:var(--surface)!important;box-shadow:none!important}
          .settings{display:grid;grid-template-columns:1fr;gap:10px;max-width:760px;margin:0 auto}.setting-card{padding:17px}.setting-card h2,.setting-card h3{margin:0 0 7px}.setting-card p{margin:0 0 10px;color:var(--muted);font-size:12px;line-height:1.55}.code{padding:11px;border:0;border-radius:12px;background:#242321;color:#fff;font:10px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;max-height:120px;overflow:auto}.profile-editor-head{display:flex;align-items:center;gap:12px}.discover-toggle,.reminder-toggle{border:0!important;border-radius:16px!important;background:#efebe4!important;padding:11px!important}.cloud-state{color:var(--muted);font-size:11px;line-height:1.5}
          .ai-layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}.ai-chat{min-height:580px;display:flex;flex-direction:column}.ai-head{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line)}.ai-dot{width:10px;height:10px;border-radius:50%;background:var(--ink)!important;box-shadow:none!important}.ai-head small{margin-left:auto;color:var(--muted);font-size:10px}.ai-messages{flex:1;min-height:390px;max-height:520px;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:min(82%,560px);padding:10px 13px;border:0!important;border-radius:18px!important;box-shadow:none!important;font-size:14px;line-height:1.55;white-space:pre-wrap}.bubble.ai{align-self:flex-start;background:#eeebe5!important}.bubble.me{align-self:flex-end;background:var(--ink)!important;color:#fff}.ai-compose{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;padding:10px;border-top:1px solid var(--line)}.ai-compose textarea{min-height:48px;max-height:120px;resize:none}.ai-side{display:grid;align-content:start;gap:10px}.ai-side .panel{padding:16px}.quick-grid{display:grid;gap:5px}.quick{border:0!important;border-radius:13px!important;background:#efebe4!important;padding:10px;text-align:left;font-weight:680}.smart-result,.ai-note{color:var(--muted);font-size:11px;line-height:1.55}.model-pill{display:none}

          /* 視窗 */
          dialog{padding:0;border:1px solid var(--line);border-radius:24px;background:var(--surface);box-shadow:0 24px 70px rgba(0,0,0,.16)}dialog::backdrop{background:rgba(17,17,17,.42);backdrop-filter:blur(3px)}dialog form,.import-shell{padding:18px}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.modal-head h2{margin:0}.x{width:36px;height:36px;border:0;border-radius:50%;background:#ece8e1;font-size:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.import-dialog{width:min(1080px,calc(100vw - 22px));max-width:none}.import-drop,.import-preview-wrap,.ocr-progress,.import-empty,.import-summary,.import-warning,.import-week-card,.recognized-card,.import-options{border:1px solid var(--line)!important;border-radius:16px!important;box-shadow:none!important}.import-drop{background:#faf7f0!important}.ocr-bar{height:8px!important;border:0!important;border-radius:999px!important;background:#e7e2d9!important;overflow:hidden}.ocr-bar i{background:#6d675e!important}.toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));z-index:2500;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;transition:.18s}.toast.on{opacity:1;transform:translate(-50%,0)}.bottom{display:none}

          @media(max-width:940px){
            .shell{display:block}.sidebar{display:none}.main{padding:0 18px 100px}.topbar{margin:0 -18px 14px;padding:13px 18px 10px}.hero{grid-template-columns:1fr}.friend-layout,.ai-layout{grid-template-columns:1fr}.ai-side{grid-template-columns:1fr 1fr}
            .bottom{position:fixed;left:10px;right:10px;bottom:max(8px,env(safe-area-inset-bottom));z-index:100;display:flex;align-items:center;justify-content:space-around;min-height:58px;padding:4px 5px;border:1px solid var(--line);border-radius:22px;background:rgba(255,253,250,.96);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 10px 28px rgba(0,0,0,.1)}.bottom button{min-width:0;flex:1;border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:720;padding:8px 3px;border-radius:15px}.bottom button.on,.bottom button[data-community-open].on{background:var(--ink);color:#fff}.bottom .plus{max-width:44px;height:42px;flex:0 0 42px;background:var(--lime);color:var(--ink);font-size:23px}
          }
          @media(max-width:680px){
            body{overflow-x:hidden}.main{padding:0 14px 96px}.topbar{margin:0 -14px 8px;padding:11px 14px 9px}.topbar h1{font-size:23px}.actions{max-width:64vw;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.actions::-webkit-scrollbar{display:none}.actions>*{flex:0 0 auto}.actions .btn{min-height:34px;padding:0 10px;font-size:11px}.hero-main{padding:19px}.hero-main h2{font-size:34px}.hero-side{display:grid;grid-template-columns:repeat(3,1fr);padding:5px}.stat{min-width:0;padding:11px;border-left:0;border-right:1px solid var(--line)}.stat:last-child{border-right:0}.schedule-toolbar{overflow-x:auto}.human-week{display:block!important}.table-wrap{display:none}.mobile-list{display:grid}.section-head{display:block}.section-head h2{font-size:27px}.section-head>.btn{width:100%;margin-top:10px}.friend-tools{max-width:100%;overflow-x:auto;white-space:nowrap}.ai-layout{display:block}.ai-chat{min-height:calc(100dvh - 188px)}.ai-side{display:grid;grid-template-columns:1fr;margin-top:10px}.ai-compose{position:sticky;bottom:70px;z-index:5}.settings{width:100%}.profile-editor-head{display:grid;grid-template-columns:64px minmax(0,1fr)}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.import-dialog{width:100vw;height:100dvh;max-height:none;margin:0;border:0;border-radius:0}.import-shell{height:100dvh;overflow:auto;padding:14px}.import-grid{display:block!important}.import-left,.import-right{width:100%!important}.import-right{margin-top:12px}.import-drop{min-height:280px!important}.import-week-preview{min-width:620px}.import-week-card{overflow:auto}
