name: nolu Git history secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  history-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full reachable history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan reachable Git blobs for high-confidence secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          import sys

          MAX_TEXT_BLOB = 2 * 1024 * 1024
          MAX_REPORTED = 50

          # Keep signatures deliberately high-confidence. Public/publishable keys
          # are intentionally excluded (for example sb_publishable_*).
          patterns = {
              'private key': re.compile(rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'GitHub classic token': re.compile(rb'gh' + rb'[pousr]_[A-Za-z0-9]{36,}'),
              'GitHub fine-grained token': re.compile(rb'github_' + rb'pat_[A-Za-z0-9_]{30,}'),
              'OpenAI secret key': re.compile(rb'sk-' + rb'(?:proj-)?[A-Za-z0-9_-]{32,}'),
              'Supabase personal access token': re.compile(rb'\bsbp_[A-Za-z0-9]{30,}\b'),
              'Supabase secret API key': re.compile(rb'\bsb_secret_[A-Za-z0-9._-]{20,}\b'),
              'literal Supabase service-role secret': re.compile(
                  rb'SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*["\']eyJ[A-Za-z0-9._-]{40,}["\']'
              ),
          }

          raw_objects = subprocess.check_output(
              ['git', 'rev-list', '--objects', '--all'],
              text=True,
              errors='replace',
          ).splitlines()

          path_by_oid = {}
          ordered_oids = []
          for line in raw_objects:
              if not line:
                  continue
              parts = line.split(' ', 1)
              oid = parts[0]
              if oid not in path_by_oid:
                  path_by_oid[oid] = parts[1] if len(parts) == 2 else '(no path)'
                  ordered_oids.append(oid)

          if not ordered_oids:
              raise SystemExit('No reachable Git objects found')

          meta_proc = subprocess.run(
              ['git', 'cat-file', '--batch-check=%(objectname) %(objecttype) %(objectsize)'],
              input='\n'.join(ordered_oids) + '\n',
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=True,
          )
          metadata = {}
          for line in meta_proc.stdout.splitlines():
              parts = line.split()
              if len(parts) == 3:
                  oid, obj_type, size = parts
                  try:
                      metadata[oid] = (obj_type, int(size))
                  except ValueError:
                      continue

          findings = []
          scanned = 0
          skipped_large = 0
          skipped_binary = 0

          for oid in ordered_oids:
              obj_type, size = metadata.get(oid, ('', 0))
              if obj_type != 'blob':
                  continue
              if size > MAX_TEXT_BLOB:
                  skipped_large += 1
                  continue

              blob = subprocess.check_output(['git', 'cat-file', 'blob', oid])
              if b'\x00' in blob:
                  skipped_binary += 1
                  continue
              scanned += 1

              for label, rx in patterns.items():
                  if rx.search(blob):
                      findings.append((label, oid, path_by_oid.get(oid, '(unknown path)')))

          # Never print matched secret bytes or matching lines. Only immutable
          # object identity + path + class are emitted so remediation is possible
          # without leaking the credential into Actions logs.
          if findings:
              print(
                  f'::error::Found {len(findings)} high-confidence secret signature(s) '
                  'in reachable Git history. Secret values are intentionally redacted.',
                  file=sys.stderr,
              )
              for label, oid, path in findings[:MAX_REPORTED]:
                  safe_path = path.replace('\n', '?').replace('\r', '?')
                  print(f'  {label}: blob={oid[:12]} path={safe_path}', file=sys.stderr)
              if len(findings) > MAX_REPORTED:
                  print(
                      f'  ... {len(findings) - MAX_REPORTED} additional finding(s) omitted',
                      file=sys.stderr,
                  )
              raise SystemExit(1)

          print(
              'Git history secret scan passed: '
              f'{scanned} text blobs scanned, '
              f'{skipped_large} oversized blobs skipped, '
              f'{skipped_binary} binary blobs skipped.'
          )
          PY
