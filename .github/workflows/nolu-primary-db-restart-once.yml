name: nolu primary DB restart once

on:
  push:
    branches: [security/nolu-data-api-exposure-20260911]
    paths:
      - '.github/workflows/nolu-primary-db-restart-once.yml'

permissions:
  contents: read

jobs:
  restart-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hrrmkrayvrgnwcroyttp
      PUBLISHABLE_KEY: sb_publishable_jXaj3aY5lPDvLEUBOzAuCQ_eKoAHTKN
    steps:
      - name: Restart unhealthy primary project
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN secret is not configured.'
            exit 2
          fi
          code=$(curl -sS --connect-timeout 5 --max-time 40 -o /tmp/restart.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json')
          echo "restart HTTP=$code"
          cat /tmp/restart.json || true
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ]

      - name: Wait for DB-backed login path
        shell: bash
        run: |
          set -euo pipefail
          url="https://${PROJECT_REF}.supabase.co/functions/v1/pu-plan-api-v6"
          for i in $(seq 1 30); do
            rc=0
            code=$(curl -sS --connect-timeout 3 --max-time 8 -o /tmp/login.json -w '%{http_code}' \
              -X POST "$url" \
              -H 'Origin: https://miiduoa.github.io' \
              -H 'Content-Type: application/json' \
              --data '{"action":"login","email":"nolu-health-probe-does-not-exist@example.invalid","password":"definitely-not-a-real-password"}') || rc=$?
            echo "login probe $i curl=$rc HTTP=${code:-000}"
            if [ "$rc" -eq 0 ] && [ "$code" = '401' ] && grep -q 'INVALID_LOGIN' /tmp/login.json; then
              echo 'DB-backed login path recovered.'
              exit 0
            fi
            sleep 6
          done
          echo 'DB-backed login path did not recover.'
          exit 1

      - name: Verify Data API boundary after recovery
        shell: bash
        run: |
          set -euo pipefail
          rest="https://${PROJECT_REF}.supabase.co/rest/v1/puplan_app_users?select=id&limit=1"
          rc=0
          code=$(curl -sS --connect-timeout 3 --max-time 10 -o /tmp/rest.json -w '%{http_code}' \
            "$rest" -H "apikey: ${PUBLISHABLE_KEY}") || rc=$?
          echo "Data API curl=$rc HTTP=${code:-000}"
          [ "$rc" -eq 0 ] || exit 1
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo '::error::Anonymous direct users access became readable after recovery.'
            cat /tmp/rest.json
            exit 1
          fi
          [ "$code" -ge 400 ] && [ "$code" -lt 500 ]
          echo 'Data API recovered and anonymous direct users access remains blocked.'
