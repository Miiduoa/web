name: One-time Nolu frontend cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nolu-cleanup-once.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Consolidate frontend and remove legacy assets
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('pu-plan')

          # One document shell only. UI markup now lives in views/*.
          index = '''<!doctype html>
          <html lang="zh-Hant">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
          <meta name="theme-color" content="#151515">
          <meta name="referrer" content="strict-origin-when-cross-origin">
          <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://hrrmkrayvrgnwcroyttp.supabase.co; media-src 'self' blob: https://hrrmkrayvrgnwcroyttp.supabase.co; connect-src 'self' https://hrrmkrayvrgnwcroyttp.supabase.co https://cdn.jsdelivr.net https://raw.githubusercontent.com https://tessdata.projectnaptha.com; worker-src 'self' blob: https://cdn.jsdelivr.net; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests">
          <title>nolu — 有空就碰面</title>
          <link rel="manifest" href="manifest.webmanifest">
          <link rel="apple-touch-icon" href="nolu-icon.svg">
          <link rel="stylesheet" href="styles/base.css">
          <link rel="stylesheet" href="styles/auth.css">
          <link rel="stylesheet" href="styles/layout.css">
          <link rel="stylesheet" href="styles/schedule.css">
          <link rel="stylesheet" href="styles/assistant.css">
          <link rel="stylesheet" href="styles/dialogs.css">
          <link rel="stylesheet" href="friends.css">
          <link rel="stylesheet" href="community.css">
          <link rel="stylesheet" href="discover.css">
          <link rel="stylesheet" href="admin.css">
          <link rel="stylesheet" href="pwa.css">
          <link rel="stylesheet" href="styles/mobile.css">
          </head>
          <body>
          <div id="app"></div>
          <script type="module" src="main.js"></script>
          </body>
          </html>
          '''
          root.joinpath('index.html').write_text(index.replace('          ', ''), encoding='utf-8')

          # Auth view: one brand block, one headline, no stacked/absolute decorations.
          auth_view = '''export function authView(){return `
          <div class="auth-gate" id="authGate">
            <section class="auth-poster" aria-label="nolu">
              <div class="auth-brand"><img src="nolu-icon.svg" alt=""><strong>nolu</strong></div>
              <div class="auth-copy"><h1>有空，就碰面。</h1><p>課表、朋友、動態和聊天，都放在同一個地方。</p></div>
            </section>
            <section class="auth-card">
              <div class="auth-tabs"><button class="on" data-auth-tab="register" type="button">註冊</button><button data-auth-tab="login" type="button">登入</button></div>
              <form id="registerForm" class="auth-form">
                <h2>建立帳號</h2>
                <label>顯示名稱<input class="field" id="regName" maxlength="24" placeholder="例如：小明" required></label>
                <label>@帳號<input class="field" id="regUsername" maxlength="24" pattern="[A-Za-z0-9_.]+" placeholder="例如：jinwei" required><small>英文、數字、底線、句點都可以，之後還能改。</small></label>
                <label>Email<input class="field" id="regEmail" type="email" autocomplete="email" required></label>
                <label>密碼<input class="field" id="regPassword" type="password" minlength="8" autocomplete="new-password" required></label>
                <button class="btn primary auth-submit">建立帳號</button>
              </form>
              <form id="loginForm" class="auth-form hidden">
                <h2>回來就繼續</h2>
                <label>Email<input class="field" id="loginEmail" type="email" autocomplete="email" required></label>
                <label>密碼<input class="field" id="loginPassword" type="password" autocomplete="current-password" required></label>
                <button class="btn primary auth-submit">登入</button>
              </form>
              <button class="guest" id="guestMode" type="button">先逛逛，不登入</button>
              <div class="auth-status" id="authStatus" aria-live="polite"></div>
            </section>
          </div>`}
          '''
          root.joinpath('views/auth.js').write_text(auth_view.replace('          ', ''), encoding='utf-8')

          shell = root.joinpath('views/shell.js').read_text(encoding='utf-8')
          shell = shell.replace('<strong>Nolu</strong>', '<strong>nolu</strong>')
          root.joinpath('views/shell.js').write_text(shell, encoding='utf-8')

          # Auth CSS is authoritative. No absolute-position brand/title tricks.
          auth_css = '''.auth-gate{position:fixed;inset:0;z-index:2000;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(380px,.72fr);background:var(--paper);overflow:auto}.auth-gate.off{display:none}.auth-poster{min-height:100dvh;padding:clamp(38px,6vw,78px);display:flex;flex-direction:column;justify-content:space-between;gap:40px;background:#ece7de}.auth-brand{position:relative;display:flex;align-items:center;gap:12px;min-width:0;flex:0 0 auto}.auth-brand img{display:block;width:52px;height:52px;flex:0 0 52px}.auth-brand strong{display:block;font-size:42px;line-height:1;font-weight:850;letter-spacing:-.065em;white-space:nowrap}.auth-copy{position:relative;max-width:680px;flex:0 0 auto}.auth-copy h1{position:static;margin:0;font-size:clamp(52px,7vw,86px);line-height:.98;letter-spacing:-.07em;font-weight:850}.auth-copy p{position:static;max-width:520px;margin:24px 0 0;color:var(--muted);font-size:15px;line-height:1.65;font-weight:620}.auth-card{min-height:100dvh;padding:clamp(32px,5vw,58px);display:flex;flex-direction:column;justify-content:center;background:var(--surface)}.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:#ece8e1}.auth-tabs button{min-height:46px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:760}.auth-tabs button.on{background:var(--ink);color:#fff}.auth-form{display:grid;gap:13px}.auth-form h2{margin:28px 0 9px;font-size:30px;line-height:1.08;letter-spacing:-.045em}.auth-form label{display:grid;gap:6px;color:var(--muted);font-size:12px;font-weight:720}.auth-form small{font-size:10px;line-height:1.45;font-weight:520}.auth-submit{width:100%;min-height:51px;margin-top:8px}.guest{align-self:center;margin-top:18px;border:0;background:transparent;color:var(--muted);text-decoration:underline;text-underline-offset:4px;font-weight:650}.auth-status{min-height:22px;margin-top:8px;font-size:12px}@media(max-width:680px){.auth-gate{display:block}.auth-poster{min-height:auto;padding:calc(24px + env(safe-area-inset-top)) 20px 26px;gap:28px}.auth-brand img{width:40px;height:40px;flex-basis:40px}.auth-brand strong{font-size:32px}.auth-copy h1{font-size:clamp(36px,10.8vw,43px);line-height:1.03;max-width:330px}.auth-copy p{margin-top:13px;font-size:13px;line-height:1.55}.auth-card{min-height:auto;padding:20px 20px calc(36px + env(safe-area-inset-bottom));border-radius:28px 28px 0 0}.auth-form h2{margin:20px 0 8px;font-size:25px}.auth-tabs button{min-height:44px}}@media(max-width:390px){.auth-poster{padding-left:18px;padding-right:18px}.auth-brand img{width:37px;height:37px;flex-basis:37px}.auth-brand strong{font-size:30px}.auth-copy h1{font-size:35px}.auth-card{padding-left:18px;padding-right:18px}}'''
          root.joinpath('styles/auth.css').write_text(auth_css, encoding='utf-8')

          # Fix comment editing at the source: update UI AND in-memory feed state.
          community_path = root / 'community.js'
          community = community_path.read_text(encoding='utf-8')
          pattern = re.compile(r"function startReplyEditor\(button\)\{.*?\n\}\nasync function deleteReply", re.S)
          replacement = '''function startReplyEditor(button){
            const id=String(button.dataset.editReply||'');
            const item=button.closest('.reply-item'),copy=item?.querySelector('.reply-copy'),text=copy?.querySelector('p');
            if(!id||!copy||!text||copy.querySelector('.reply-inline-editor'))return;
            const actions=copy.querySelector('.reply-owner-actions'),original=text.textContent||'';
            text.hidden=true;if(actions)actions.hidden=true;
            const editor=document.createElement('div');editor.className='reply-inline-editor';editor.innerHTML='<textarea maxlength="600" aria-label="編輯留言"></textarea><div class="reply-inline-actions"><button type="button" data-cancel>取消</button><button type="button" class="save" data-save>儲存</button></div>';copy.append(editor);
            const ta=editor.querySelector('textarea');ta.value=original;ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
            const close=()=>{editor.remove();text.hidden=false;if(actions)actions.hidden=false};
            editor.querySelector('[data-cancel]').onclick=close;
            editor.querySelector('[data-save]').onclick=async()=>{
              const body=ta.value.trim();if(!body)return app?.toast?.('留言不能空白');
              const save=editor.querySelector('[data-save]');save.disabled=true;save.textContent='儲存中…';
              try{
                const d=await request('edit_reply',{reply_id:id,body});
                const saved=d.reply?.body||body,updated=d.reply?.updated_at||new Date().toISOString();
                for(const post of feedData){const reply=(post.replies||[]).find(r=>String(r.id)===id);if(reply){reply.body=saved;reply.updated_at=updated}}
                text.textContent=saved;const meta=copy.querySelector('small');if(meta&&!meta.textContent.includes('已編輯'))meta.textContent+=' · 已編輯';
                close();app?.toast?.('留言已更新');
              }catch(e){save.disabled=false;save.textContent='儲存';app?.toast?.(e.message)}
            };
            ta.onkeydown=e=>{if(e.key==='Escape'){e.preventDefault();close()}if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();editor.querySelector('[data-save]').click()}};
          }
          async function deleteReply'''
          community, count = pattern.subn(replacement, community, count=1)
          if count != 1:
            raise SystemExit('Could not locate startReplyEditor for replacement')
          community = community.replace("document.title=n?`(${n}) Nolu`:'Nolu — 課表、朋友、現在';", "document.title=n?`(${n}) nolu`:'nolu — 有空就碰面';")
          community_path.write_text(community, encoding='utf-8')

          # PWA cache only contains production assets that are actually loaded.
          sw = '''const CACHE='nolu-shell-20260909-2300';
          const CORE=[
            './','./index.html','./main.js','./app.js','./nolu-icon.svg','./manifest.webmanifest',
            './styles/base.css','./styles/auth.css','./styles/layout.css','./styles/schedule.css','./styles/assistant.css','./styles/dialogs.css','./styles/mobile.css',
            './views/auth.js','./views/shell.js','./views/schedule.js','./views/friends.js','./views/assistant.js','./views/settings.js','./views/dialogs.js',
            './friends.css','./community.css','./discover.css','./admin.css','./pwa.css',
            './cloud.js','./social-ui.js','./import.js','./boot.js','./security.js','./auth.js','./semesters.js','./community.js','./discover.js','./planner.js','./admin.js','./privacy.js','./pwa.js'
          ];
          self.addEventListener('install',event=>{event.waitUntil((async()=>{const cache=await caches.open(CACHE);for(const item of CORE){try{await cache.add(item)}catch{}}})());self.skipWaiting()});
          self.addEventListener('activate',event=>{event.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(key=>key!==CACHE).map(key=>caches.delete(key)))));self.clients.claim()});
          self.addEventListener('fetch',event=>{if(event.request.method!=='GET')return;const url=new URL(event.request.url);if(url.origin!==location.origin)return;const fresh=/\\.(?:html?|css|js|webmanifest)$/i.test(url.pathname)||event.request.mode==='navigate';event.respondWith((async()=>{try{const response=await fetch(event.request,{cache:fresh?'reload':'default'});if(response.ok){const cache=await caches.open(CACHE);cache.put(event.request,response.clone()).catch(()=>{})}return response}catch{return(await caches.match(event.request))||(await caches.match('./'))||Response.error()}})())});
          self.addEventListener('notificationclick',event=>{event.notification.close();const target=event.notification?.data?.url||new URL('./',self.location.href).href;event.waitUntil(clients.matchAll({type:'window',includeUncontrolled:true}).then(async windows=>{for(const win of windows){try{await win.navigate(target);return win.focus()}catch{}}return clients.openWindow(target)}))});
          '''
          root.joinpath('sw.js').write_text(sw.replace('          ', ''), encoding='utf-8')

          manifest = root.joinpath('manifest.webmanifest')
          manifest.write_text('{"name":"nolu","short_name":"nolu","description":"課表、朋友、動態與聊天，都在這裡。","start_url":"./","scope":"./","display":"standalone","background_color":"#f6f3ed","theme_color":"#151515","lang":"zh-Hant","icons":[{"src":"nolu-icon.svg","sizes":"any","type":"image/svg+xml","purpose":"any maskable"}]}', encoding='utf-8')

          boot = root.joinpath('boot.js').read_text(encoding='utf-8').replace("['apple-mobile-web-app-title','Nolu']", "['apple-mobile-web-app-title','nolu']")
          root.joinpath('boot.js').write_text(boot, encoding='utf-8')

          # Remove the parallel/dead frontend implementation rather than override it.
          dead = [
            root/'style.css',
            root/'core/state.js',
            root/'features/analysis.js', root/'features/friends.js', root/'features/navigation.js',
            root/'features/schedule.js', root/'features/settings.js', root/'features/share.js',
            Path('.github/workflows/load-test.yml'),
            Path('.github/workflows/realistic-social-load.yml'),
            Path('.github/workflows/realistic-social-load-proxy.yml'),
            Path('.github/workflows/realistic-social-load-isolated.yml'),
          ]
          for path in dead:
            if path.exists(): path.unlink()

          # One-shot workflow removes itself after doing the refactor.
          self_path = Path('.github/workflows/nolu-cleanup-once.yml')
          if self_path.exists(): self_path.unlink()

          # Validate that every production entry referenced above exists.
          required = [
            'index.html','main.js','app.js','nolu-icon.svg','manifest.webmanifest','sw.js',
            'styles/base.css','styles/auth.css','styles/layout.css','styles/schedule.css','styles/assistant.css','styles/dialogs.css','styles/mobile.css',
            'views/auth.js','views/shell.js','views/schedule.js','views/friends.js','views/assistant.js','views/settings.js','views/dialogs.js',
            'friends.css','community.css','discover.css','admin.css','pwa.css','cloud.js','social-ui.js','import.js','boot.js','security.js','auth.js','semesters.js','community.js','discover.js','planner.js','admin.js','privacy.js','pwa.js'
          ]
          missing=[x for x in required if not root.joinpath(x).exists()]
          if missing: raise SystemExit('Missing production assets: '+', '.join(missing))
          PY

      - name: Syntax checks
        run: |
          node --experimental-default-type=module --check pu-plan/main.js
          node --experimental-default-type=module --check pu-plan/boot.js
          node --experimental-default-type=module --check pu-plan/community.js
          node --experimental-default-type=module --check pu-plan/discover.js

      - name: Commit cleanup
        run: |
          git config user.name "Miiduoa"
          git config user.email "107848266+Miiduoa@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Consolidate nolu frontend and remove legacy layers"
            git push
          fi
