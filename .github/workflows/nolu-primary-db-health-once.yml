name: nolu primary DB health once

on:
  push:
    branches: [security/nolu-data-api-exposure-20260911]
    paths:
      - '.github/workflows/nolu-primary-db-health-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invalid login must reach database and return INVALID_LOGIN
        shell: bash
        run: |
          set -euo pipefail
          url='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v6'
          rc=0
          code=$(curl -sS --connect-timeout 3 --max-time 12 -o /tmp/body -w '%{http_code}' \
            -X POST "$url" \
            -H 'Origin: https://miiduoa.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"action":"login","email":"nolu-health-probe-does-not-exist@example.invalid","password":"definitely-not-a-real-password"}') || rc=$?
          echo "curl=$rc HTTP=${code:-000}"
          cat /tmp/body 2>/dev/null || true
          [ "$rc" -eq 0 ] || exit 1
          [ "$code" = '401' ] || exit 1
          grep -q 'INVALID_LOGIN' /tmp/body
