name: Nolu Admin Standby Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/admin-failover.js'
      - 'pu-plan/main.js'
      - 'supabase/functions/pu-plan-admin-standby/**'
      - '.github/workflows/nolu-admin-standby-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'pu-plan/admin-failover.js'
      - 'pu-plan/main.js'
      - 'supabase/functions/pu-plan-admin-standby/**'
      - '.github/workflows/nolu-admin-standby-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STANDBY_ADMIN: https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/pu-plan-admin
      GOOD_ORIGIN: https://miiduoa.github.io
      EVIL_ORIGIN: https://evil.example
    steps:
      - uses: actions/checkout@v6
      - name: Syntax and source invariants
        run: |
          set -euo pipefail
          node --check pu-plan/admin-failover.js
          node --check pu-plan/main.js
          grep -q "puplan_session_primary_v1" pu-plan/admin-failover.js
          grep -q "puplan_session_standby_v1" pu-plan/admin-failover.js
          grep -q "failoverEligible" pu-plan/admin-failover.js
          grep -q "primary&&!failoverEligible(primary)" pu-plan/admin-failover.js
          grep -q "READ_ONLY" pu-plan/admin-failover.js
          grep -q "PRIMARY_REQUIRED" pu-plan/admin-failover.js
          grep -q "admin-failover.js" pu-plan/main.js

          standby=supabase/functions/pu-plan-admin-standby/index.ts
          test -f "$standby"
          cmp -s supabase/functions/_shared/session-v4.ts supabase/functions/pu-plan-admin-standby/session-v4.ts
          grep -q "verifySignedSessionV4" "$standby"
          grep -q "assertCredentialCurrent" "$standby"
          grep -q "DEFAULT_SESSION_SECONDS + 600" "$standby"
          grep -q "UUID_RE.test(session.uid)" "$standby"
          grep -q "const MAX_BODY_BYTES = 128_000" "$standby"
          grep -q "req.body.getReader()" "$standby"
          grep -q "const READ_ONLY" "$standby"
          grep -q "PRIMARY_REQUIRED" "$standby"
          ! grep -Eq "\.(insert|update|delete|upsert)\(" "$standby"

      - name: Simulate outage without authorization downgrade
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const code=fs.readFileSync('pu-plan/admin-failover.js','utf8');
          const calls=[];
          const store=new Map([
            ['puplan_session_primary_v1','PRIMARY_TOKEN'],
            ['puplan_session_standby_v1','STANDBY_TOKEN']
          ]);
          let primaryStatus=503;
          class HeadersX{
            constructor(src={}){this.m=new Map();if(src instanceof HeadersX){for(const [k,v] of src.m)this.m.set(k,v)}else{for(const [k,v] of Object.entries(src))this.m.set(k.toLowerCase(),String(v))}}
            set(k,v){this.m.set(k.toLowerCase(),String(v))}
            get(k){return this.m.get(k.toLowerCase())||null}
          }
          const context={
            URL,Headers:HeadersX,Response,
            location:{href:'https://miiduoa.github.io/web/pu-plan/'},
            localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,v)},
            window:{fetch:async(url,opt={})=>{
              calls.push({url:String(url),auth:opt.headers?.get?.('authorization')||opt.headers?.get?.('Authorization')||''});
              if(String(url).includes('hrrmkray'))return new Response(JSON.stringify({error:primaryStatus===403?'FORBIDDEN':'down'}),{status:primaryStatus,headers:{'Content-Type':'application/json'}});
              return new Response('{"is_admin":true,"cloud_tier":"standby"}',{status:200,headers:{'Content-Type':'application/json'}});
            }}
          };
          context.window.window=context.window;context.window.localStorage=context.localStorage;context.window.location=context.location;context.window.URL=URL;context.window.Headers=HeadersX;context.window.Response=Response;
          vm.createContext(context);vm.runInContext(code,context);
          const adminUrl='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-admin';
          const opts=action=>({method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});
          (async()=>{
            primaryStatus=503;
            let read=await context.window.fetch(adminUrl,opts('overview'));
            if(!read.ok||(await read.json()).cloud_tier!=='standby')throw new Error('503 read did not fail over');
            if(calls.length!==2||!calls[0].auth.includes('PRIMARY_TOKEN')||!calls[1].auth.includes('STANDBY_TOKEN'))throw new Error('regional tokens wrong');

            // Explicit authorization rejection is authoritative. A stale Tokyo
            // admin role/session must never turn a Mumbai 401/403 into access.
            calls.length=0;primaryStatus=403;
            read=await context.window.fetch(adminUrl,opts('overview'));
            if(read.status!==403)throw new Error('primary 403 was downgraded');
            if(calls.length!==1||!calls[0].url.includes('hrrmkray'))throw new Error('403 leaked to standby');

            calls.length=0;primaryStatus=401;
            read=await context.window.fetch(adminUrl,opts('overview'));
            if(read.status!==401)throw new Error('primary 401 was downgraded');
            if(calls.length!==1)throw new Error('401 leaked to standby');

            calls.length=0;primaryStatus=503;
            const write=await context.window.fetch(adminUrl,opts('moderate_post'));
            if(write.status!==503)throw new Error('write should remain primary-only');
            if(calls.length!==1||!calls[0].url.includes('hrrmkray'))throw new Error('write leaked to standby');
            console.log('ADMIN_STANDBY_FAILOVER_OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Live standby admin public boundaries
        run: |
          set -euo pipefail
          retry_code(){
            local method="$1" url="$2" outfile="$3"; shift 3
            local code='' rc=1
            for attempt in 1 2 3; do
              set +e
              code=$(curl -sS --connect-timeout 4 --max-time 10 -o "$outfile" -w '%{http_code}' -X "$method" "$url" "$@")
              rc=$?
              set -e
              [ "$rc" -eq 0 ] && break
              sleep "$attempt"
            done
            [ "$rc" -eq 0 ] || { echo "transport inconclusive for $url"; return 2; }
            printf '%s' "$code"
          }

          code=$(retry_code GET "$STANDBY_ADMIN" /tmp/health) || exit $?
          test "$code" = 200
          grep -q '"role":"standby"' /tmp/health
          grep -q '"read_only":true' /tmp/health

          code=$(retry_code OPTIONS "$STANDBY_ADMIN" /tmp/evil -H "Origin: $EVIL_ORIGIN" -H 'Access-Control-Request-Method: POST') || exit $?
          test "$code" = 403

          code=$(retry_code POST "$STANDBY_ADMIN" /tmp/anon -H "Origin: $GOOD_ORIGIN" -H 'Content-Type: application/json' --data '{"action":"overview"}') || exit $?
          test "$code" = 401

          code=$(retry_code POST "$STANDBY_ADMIN" /tmp/forged -H 'Content-Type: application/json' -H 'Authorization: Bearer forged.token' --data '{"action":"overview"}') || exit $?
          test "$code" = 401

      - name: Oversized standby admin body guard
        run: |
          set -euo pipefail
          python3 - <<'PY' >/tmp/oversized.json
          import json
          print(json.dumps({'action':'overview','padding':'x'*129000}))
          PY
          set +e
          code=$(curl -sS --connect-timeout 4 --max-time 15 -o /tmp/oversized-body -w '%{http_code}' \
            -X POST "$STANDBY_ADMIN" -H "Origin: $GOOD_ORIGIN" -H 'Content-Type: application/json' --data-binary @/tmp/oversized.json)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            test "$code" = 413
            grep -q 'PAYLOAD_TOO_LARGE' /tmp/oversized-body
          elif [ "$rc" -eq 28 ]; then
            echo "::warning::edge transport timed out before application response; source streamed-byte guard remains enforced"
          else
            exit "$rc"
          fi
