name: Supabase emergency restart

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/supabase-emergency-restart.yml'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type restart-primary to confirm a production database restart'
        required: true
        type: string
      incident:
        description: 'Short incident/reason for the restart'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nolu-supabase-emergency-restart-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  workflow-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify production restart safety contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/supabase-emergency-restart.yml').read_text()
          required=[
            "if: github.event_name == 'workflow_dispatch'",
            "if [ \"$CONFIRM\" != 'restart-primary' ]",
            'public_course_catalog?select=*&limit=0',
            'puplan_app_users?select=id&limit=1',
            'https://api.supabase.com/v1/projects/${PROJECT_REF}/restart',
            'should_restart=false',
            'should_restart=true',
            'Anonymous puplan_app_users access is exposed',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'missing emergency restart guardrails: {missing}'
          assert '/pause' not in s and '/restore' not in s, 'restart workflow must not pause or restore production'
          print('NOLU_EMERGENCY_RESTART_CONTRACT_OK')
          PY

  restart:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hrrmkrayvrgnwcroyttp
      PUBLISHABLE_KEY: sb_publishable_jXaj3aY5lPDvLEUBOzAuCQ_eKoAHTKN
      CONFIRM: ${{ inputs.confirm }}
      INCIDENT: ${{ inputs.incident }}
    steps:
      - name: Require explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != 'restart-primary' ]; then
            echo '::error::Production restart confirmation did not match restart-primary.'
            exit 2
          fi
          if [ -z "${INCIDENT//[[:space:]]/}" ]; then
            echo '::error::An incident/reason is required.'
            exit 2
          fi
          echo "Emergency restart requested for incident: $INCIDENT"

      - name: Check whether restart is still necessary
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_REST="https://${PROJECT_REF}.supabase.co/rest/v1/public_course_catalog?select=*&limit=0"
          SENSITIVE_REST="https://${PROJECT_REF}.supabase.co/rest/v1/puplan_app_users?select=id&limit=1"

          rm -f /tmp/public-preflight-body
          public_rc=0
          public_code=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/public-preflight-body -w '%{http_code}' \
            "$PUBLIC_REST" -H "apikey: ${PUBLISHABLE_KEY}") || public_rc=$?
          public_body=$(cat /tmp/public-preflight-body 2>/dev/null || true)
          echo "Public health preflight rc=$public_rc HTTP=${public_code:-000}"

          if [ "$public_rc" -eq 0 ] && [ "$public_code" -ge 200 ] && [ "$public_code" -lt 300 ] \
            && ! grep -Eqi 'PGRST002|Gateway Timeout|Could not query the database for the schema cache' /tmp/public-preflight-body 2>/dev/null; then
            rm -f /tmp/sensitive-preflight-body
            sensitive_rc=0
            sensitive_code=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/sensitive-preflight-body -w '%{http_code}' \
              "$SENSITIVE_REST" -H "apikey: ${PUBLISHABLE_KEY}") || sensitive_rc=$?
            sensitive_body=$(cat /tmp/sensitive-preflight-body 2>/dev/null || true)
            echo "Sensitive boundary preflight rc=$sensitive_rc HTTP=${sensitive_code:-000}"

            if [ "$sensitive_rc" -eq 0 ] && [ "$sensitive_code" -ge 200 ] && [ "$sensitive_code" -lt 300 ]; then
              echo '::error::Anonymous puplan_app_users access is exposed; refusing to mask this security incident with a restart.'
              echo "$sensitive_body"
              exit 1
            fi
            if [ "$sensitive_rc" -eq 0 ] && [ "$sensitive_code" -ge 400 ] && [ "$sensitive_code" -lt 500 ]; then
              echo 'Public Data API is healthy and anonymous sensitive-table access remains blocked; restart is unnecessary.'
              echo 'should_restart=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo '::error::Public Data API is healthy but the sensitive-table boundary probe is unavailable or server-failing; refusing an automatic restart for a partial/ambiguous incident.'
            echo "$sensitive_body"
            exit 1
          fi

          if [ "$public_rc" -ne 0 ] || { [ "$public_code" -ge 500 ] && [ "$public_code" -lt 600 ]; }; then
            echo 'Data API health path remains transport-unreachable or server-failing; restart is warranted.'
            echo "$public_body"
            echo 'should_restart=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::error::Public health endpoint returned HTTP ${public_code:-000}; this looks like an auth/configuration/client-boundary problem that a database restart should not mask."
          echo "$public_body"
          exit 1

      - name: Restart project through Supabase Management API
        if: steps.preflight.outputs.should_restart == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo '::error::SUPABASE_ACCESS_TOKEN secret is not configured in this repository.'
            exit 2
          fi
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/restart.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json')
          echo "Restart request HTTP ${code}"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat /tmp/restart.json 2>/dev/null || true
            exit 1
          fi

      - name: Wait for Data API path and auth boundary
        if: steps.preflight.outputs.should_restart == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PUBLIC_REST="https://${PROJECT_REF}.supabase.co/rest/v1/public_course_catalog?select=*&limit=0"
          SENSITIVE_REST="https://${PROJECT_REF}.supabase.co/rest/v1/puplan_app_users?select=id&limit=1"

          for i in $(seq 1 36); do
            rm -f /tmp/public-body /tmp/sensitive-body
            public_rc=0
            public_code=$(curl -sS --connect-timeout 5 --max-time 8 -o /tmp/public-body -w '%{http_code}' \
              "$PUBLIC_REST" -H "apikey: ${PUBLISHABLE_KEY}") || public_rc=$?
            public_body=$(cat /tmp/public-body 2>/dev/null || true)
            echo "Public Data API probe $i rc=$public_rc HTTP=${public_code:-000}"

            if [ "$public_rc" -eq 0 ] && [ "$public_code" -ge 200 ] && [ "$public_code" -lt 300 ] \
              && ! grep -Eqi 'PGRST002|Gateway Timeout|Could not query the database for the schema cache' /tmp/public-body 2>/dev/null; then
              sensitive_rc=0
              sensitive_code=$(curl -sS --connect-timeout 5 --max-time 8 -o /tmp/sensitive-body -w '%{http_code}' \
                "$SENSITIVE_REST" -H "apikey: ${PUBLISHABLE_KEY}") || sensitive_rc=$?
              sensitive_body=$(cat /tmp/sensitive-body 2>/dev/null || true)
              echo "Sensitive boundary probe $i rc=$sensitive_rc HTTP=${sensitive_code:-000}"

              if [ "$sensitive_rc" -eq 0 ] && [ "$sensitive_code" -ge 200 ] && [ "$sensitive_code" -lt 300 ]; then
                echo '::error::Data API recovered but anonymous puplan_app_users access is exposed.'
                echo "$sensitive_body"
                exit 1
              fi
              if [ "$sensitive_rc" -eq 0 ] && [ "$sensitive_code" -ge 400 ] && [ "$sensitive_code" -lt 500 ]; then
                echo 'Data API health path recovered and anonymous sensitive-table access remains blocked.'
                exit 0
              fi
            fi

            if [ "$public_rc" -eq 0 ] && [ "$public_code" -ge 200 ] && [ "$public_code" -lt 300 ]; then
              echo "$public_body"
            fi
            sleep 8
          done
          echo '::error::Data API did not become healthy with the anonymous boundary intact within the restart validation window.'
          exit 1
