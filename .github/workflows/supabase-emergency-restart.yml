name: Supabase emergency restart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-emergency-restart.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hrrmkrayvrgnwcroyttp
    steps:
      - name: Restart project through Supabase Management API
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN secret is not configured in this repository.'
            exit 2
          fi
          code=$(curl -sS --max-time 30 -o /tmp/restart.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json')
          echo "Restart request HTTP ${code}"
          cat /tmp/restart.json || true
          test "$code" -ge 200 -a "$code" -lt 300

      - name: Wait for Nolu database to recover
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            code=$(curl -sS --max-time 8 -o /tmp/body -w '%{http_code}' \
              'https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-db-probe' || true)
            body=$(cat /tmp/body 2>/dev/null || true)
            echo "probe $i HTTP=$code $body"
            if [ "$code" = '200' ] && echo "$body" | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 8
          done
          echo 'Database did not recover within the restart validation window.'
          exit 1
