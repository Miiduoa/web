name: Supabase emergency restart

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type restart-primary to confirm a production database restart'
        required: true
        type: string
      incident:
        description: 'Short incident/reason for the restart'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nolu-supabase-emergency-restart
  cancel-in-progress: false

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hrrmkrayvrgnwcroyttp
      PUBLISHABLE_KEY: sb_publishable_jXaj3aY5lPDvLEUBOzAuCQ_eKoAHTKN
      CONFIRM: ${{ inputs.confirm }}
      INCIDENT: ${{ inputs.incident }}
    steps:
      - name: Require explicit production confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CONFIRM" != 'restart-primary' ]; then
            echo '::error::Production restart confirmation did not match restart-primary.'
            exit 2
          fi
          if [ -z "${INCIDENT//[[:space:]]/}" ]; then
            echo '::error::An incident/reason is required.'
            exit 2
          fi
          echo "Emergency restart requested for incident: $INCIDENT"

      - name: Check whether restart is still necessary
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          REST="https://${PROJECT_REF}.supabase.co/rest/v1/puplan_app_users?select=id&limit=1"
          rm -f /tmp/preflight-body
          rc=0
          code=$(curl -sS --connect-timeout 5 --max-time 10 -o /tmp/preflight-body -w '%{http_code}' \
            "$REST" -H "apikey: ${PUBLISHABLE_KEY}") || rc=$?
          body=$(cat /tmp/preflight-body 2>/dev/null || true)
          echo "Preflight Data API rc=$rc HTTP=${code:-000}"

          if [ "$rc" -eq 0 ] && [ "$code" -ge 400 ] && [ "$code" -lt 500 ]; then
            echo 'Data API is already responsive and the anonymous boundary is still closed; restart is unnecessary.'
            echo 'should_restart=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -eq 0 ] && [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            echo '::error::Anonymous puplan_app_users access is exposed; refusing to mask this security incident with a restart.'
            echo "$body"
            exit 1
          fi

          echo 'Data API remains unavailable or server-failing; restart is warranted.'
          echo 'should_restart=true' >> "$GITHUB_OUTPUT"

      - name: Restart project through Supabase Management API
        if: steps.preflight.outputs.should_restart == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo '::error::SUPABASE_ACCESS_TOKEN secret is not configured in this repository.'
            exit 2
          fi
          code=$(curl -sS --connect-timeout 10 --max-time 30 -o /tmp/restart.json -w '%{http_code}' \
            -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/restart" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json')
          echo "Restart request HTTP ${code}"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            cat /tmp/restart.json 2>/dev/null || true
            exit 1
          fi

      - name: Wait for Data API path and auth boundary
        if: steps.preflight.outputs.should_restart == 'true'
        shell: bash
        run: |
          set -euo pipefail
          REST="https://${PROJECT_REF}.supabase.co/rest/v1/puplan_app_users?select=id&limit=1"
          for i in $(seq 1 36); do
            rm -f /tmp/body
            rc=0
            code=$(curl -sS --connect-timeout 5 --max-time 8 -o /tmp/body -w '%{http_code}' \
              "$REST" -H "apikey: ${PUBLISHABLE_KEY}") || rc=$?
            body=$(cat /tmp/body 2>/dev/null || true)
            echo "Data API probe $i rc=$rc HTTP=${code:-000}"

            if [ "$rc" -eq 0 ] && [ "$code" -ge 400 ] && [ "$code" -lt 500 ]; then
              echo 'Data API is responsive and anonymous direct access remains blocked.'
              exit 0
            fi
            if [ "$rc" -eq 0 ] && [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo '::error::Data API recovered but anonymous puplan_app_users access is exposed.'
              echo "$body"
              exit 1
            fi
            sleep 8
          done
          echo '::error::Data API did not become responsive within the restart validation window.'
          exit 1
