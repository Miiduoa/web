name: nolu replica v2 client patch

on:
  push:
    branches: [fix/nolu-replica-v2-client]
    paths:
      - '.github/workflows/nolu-replica-v2-client-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/nolu-replica-v2-client
      - name: Replace retired v7 routing with v8 tier sessions
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('pu-plan/resilience.js')
          s=p.read_text()
          s=s.replace("const PRIMARY='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v7';", "const PRIMARY='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v8';")
          s=s.replace("const STANDBY='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/pu-plan-api-v7';", "const STANDBY='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/pu-plan-api-v8';")
          s=s.replace("const VERSION='20260911-ha2';", "const VERSION='20260911-ha3';")
          s=s.replace("const PORTABLE_KEY='puplan_portable_session_v1';\nconst NO_STANDBY_ACTIONS=new Set(['signup','recover_password']);", "const PORTABLE_KEY='puplan_portable_session_v1';\nconst PRIMARY_SESSION_KEY='puplan_session_primary_v1';\nconst STANDBY_SESSION_KEY='puplan_session_standby_v1';\nconst NO_STANDBY_ACTIONS=new Set(['signup','recover_password','change_password','rotate_recovery_code','search_people','send_request','accept_request','decline_request','remove_friend','create_meetup','respond_meetup','cancel_meetup','social']);")
          old="function authTokenFor(api){return api===PRIMARY||api===STANDBY?portableToken()||token():token()}"
          new="""function tierSession(api){\n  const current=token(),uid=parseTokenUid(current),key=api===STANDBY?STANDBY_SESSION_KEY:PRIMARY_SESSION_KEY,specific=localStorage.getItem(key)||'';\n  if(uid&&parseTokenUid(specific)===uid)return specific;\n  return current;\n}\nfunction authTokenFor(api){return api===STANDBY?tierSession(STANDBY):api===PRIMARY||api===COMPAT_V6||api===COMPAT_CORE?tierSession(PRIMARY):token()}"""
          if old not in s: raise SystemExit('resilience authTokenFor anchor missing')
          s=s.replace(old,new)
          old="""function storeResponseTokens(data,api){\n  const portable=typeof data?.portable_token==='string'?data.portable_token:api===STANDBY&&typeof data?.token==='string'?data.token:'';\n  if(portable&&portable.split('.').length===2)localStorage.setItem(PORTABLE_KEY,portable);\n  if(api!==STANDBY&&typeof data?.token==='string'&&data.token.split('.').length===2&&data.token!==token())localStorage.setItem('puplan_session',data.token);\n  if(portable||api!==STANDBY&&data?.token)document.dispatchEvent(new CustomEvent('nolu:session-rotated',{detail:{api,tier:api===STANDBY?'standby':'primary'}}));\n}"""
          new="""function storeResponseTokens(data,api){\n  const portable=typeof data?.portable_token==='string'?data.portable_token:'';\n  if(portable&&portable.split('.').length===3)localStorage.setItem(PORTABLE_KEY,portable);\n  const session=typeof data?.token==='string'&&data.token.split('.').length===2?data.token:'';\n  if(session){\n    const tier=api===STANDBY?'standby':'primary';\n    localStorage.setItem(tier==='standby'?STANDBY_SESSION_KEY:PRIMARY_SESSION_KEY,session);\n    document.dispatchEvent(new CustomEvent('nolu:session-rotated',{detail:{api,tier}}));\n  }\n}"""
          if old not in s: raise SystemExit('resilience storeResponseTokens anchor missing')
          s=s.replace(old,new)
          s=s.replace("let lastError=null,lastResponse=null,standby401=null;", "let lastError=null,lastResponse=null,tierAuth401=null;")
          old="if(api===STANDBY&&res.status===401&&hasAuthorization(options)){standby401=res;lastError=new Error('standby authorization unavailable');markFailure(api,lastError);continue}"
          new="if((api===PRIMARY||api===STANDBY)&&res.status===401&&hasAuthorization(options)){tierAuth401=res;lastError=new Error('tier-local authorization unavailable');continue}"
          if old not in s: raise SystemExit('resilience 401 anchor missing')
          s=s.replace(old,new)
          s=s.replace("if(standby401&&hasAuthorization(options))return new Response(JSON.stringify({error:'STANDBY_AUTH_UNCERTAIN',message:'主雲端暫時無法驗證登入狀態，已保留本機登入資料'}),{status:503,headers:{'Content-Type':'application/json; charset=utf-8','Cache-Control':'no-store'}});", "if(tierAuth401&&hasAuthorization(options))return new Response(JSON.stringify({error:'TIER_AUTH_UNCERTAIN',message:'雲端暫時無法驗證這個裝置的登入狀態，已保留本機資料'}),{status:503,headers:{'Content-Type':'application/json; charset=utf-8','Cache-Control':'no-store'}});")
          s=s.replace("window.NOLU_RESILIENCE={state,getMode:()=>state.mode,recover,flushPending,snapshot,currentUid,circuitOpen,apiCandidates,preferredCloud,setPreferredCloud,portableToken,PRIMARY,STANDBY};", "window.NOLU_RESILIENCE={state,getMode:()=>state.mode,recover,flushPending,snapshot,currentUid,circuitOpen,apiCandidates,preferredCloud,setPreferredCloud,portableToken,tierSession,PRIMARY,STANDBY,PRIMARY_SESSION_KEY,STANDBY_SESSION_KEY};")
          p.write_text(s)

          p=Path('pu-plan/transport-bridge.js')
          s=p.read_text()
          s=s.replace("const PRIMARY='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v7';", "const PRIMARY='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v8';")
          s=s.replace("const STANDBY='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/pu-plan-api-v7';", "const STANDBY='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/pu-plan-api-v8';")
          s=s.replace("const PORTABLE_KEY='puplan_portable_session_v1';", "const PORTABLE_KEY='puplan_portable_session_v1';\nconst PRIMARY_SESSION_KEY='puplan_session_primary_v1';\nconst STANDBY_SESSION_KEY='puplan_session_standby_v1';")
          old="function authTokenFor(endpoint){const primary=localStorage.getItem('puplan_session')||'',portable=localStorage.getItem(PORTABLE_KEY)||'';return endpoint===PRIMARY||endpoint===STANDBY?portable||primary:primary}"
          new="""function parseUid(raw){try{const [p,s,...rest]=String(raw||'').split('.');if(!p||!s||rest.length)return'';const n=p.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(p.length/4)*4,'=');const d=JSON.parse(decodeURIComponent(escape(atob(n))));return d?.v===4&&d?.uid&&d?.exp*1000>Date.now()?String(d.uid):''}catch{return''}}\nfunction tierSession(endpoint){const current=localStorage.getItem('puplan_session')||'',uid=parseUid(current),key=endpoint===STANDBY?STANDBY_SESSION_KEY:PRIMARY_SESSION_KEY,specific=localStorage.getItem(key)||'';return uid&&parseUid(specific)===uid?specific:current}\nfunction authTokenFor(endpoint){return endpoint===STANDBY?tierSession(STANDBY):endpoint===PRIMARY||endpoint===V6||endpoint===CORE||endpoint===LEGACY?tierSession(PRIMARY):localStorage.getItem('puplan_session')||''}"""
          if old not in s: raise SystemExit('transport auth anchor missing')
          s=s.replace(old,new)
          s=s.replace("!(endpoint===STANDBY&&(action==='signup'||action==='recover_password'))", "!(endpoint===STANDBY&&['signup','recover_password','change_password','rotate_recovery_code','search_people','send_request','accept_request','decline_request','remove_friend','create_meetup','respond_meetup','cancel_meetup','social'].includes(action))")
          old="""    const portable=typeof data?.portable_token==='string'?data.portable_token:endpoint===STANDBY&&typeof data?.token==='string'?data.token:'';\n    if(portable&&portable.split('.').length===2)localStorage.setItem(PORTABLE_KEY,portable);\n    if(endpoint!==STANDBY&&typeof data?.token==='string'&&data.token.split('.').length===2)localStorage.setItem('puplan_session',data.token);"""
          new="""    const portable=typeof data?.portable_token==='string'?data.portable_token:'';\n    if(portable&&portable.split('.').length===3)localStorage.setItem(PORTABLE_KEY,portable);\n    const session=typeof data?.token==='string'&&data.token.split('.').length===2?data.token:'';\n    if(session)localStorage.setItem(endpoint===STANDBY?STANDBY_SESSION_KEY:PRIMARY_SESSION_KEY,session);"""
          if old not in s: raise SystemExit('transport token store anchor missing')
          s=s.replace(old,new)
          s=s.replace("let lastResponse=null,lastError=null,standby401=false;", "let lastResponse=null,lastError=null,tierAuth401=false;")
          old="if(endpoint===STANDBY&&response.status===401&&hasAuth(options)){standby401=true;failure(endpoint,new Error('standby authorization unavailable'));continue}"
          new="if((endpoint===PRIMARY||endpoint===STANDBY)&&response.status===401&&hasAuth(options)){tierAuth401=true;lastError=new Error('tier-local authorization unavailable');continue}"
          if old not in s: raise SystemExit('transport 401 anchor missing')
          s=s.replace(old,new)
          s=s.replace("if(standby401&&hasAuth(options))return new Response(JSON.stringify({error:'STANDBY_AUTH_UNCERTAIN',message:'主雲端暫時無法驗證登入狀態'}),{status:503,headers:{'Content-Type':'application/json; charset=utf-8','Cache-Control':'no-store'}});", "if(tierAuth401&&hasAuth(options))return new Response(JSON.stringify({error:'TIER_AUTH_UNCERTAIN',message:'雲端暫時無法驗證這個裝置的登入狀態'}),{status:503,headers:{'Content-Type':'application/json; charset=utf-8','Cache-Control':'no-store'}});")
          p.write_text(s)

          p=Path('pu-plan/main.js')
          s=p.read_text()
          pattern=r"\n// v7 is provisioned separately.*?\n}\n\n// If the database is unreachable"
          replacement="\n// If the database is unreachable"
          s2,n=re.subn(pattern,replacement,s,flags=re.S)
          if n!=1: raise SystemExit(f'main v7 guard anchor count={n}')
          p.write_text(s2)
          PY

          node --check pu-plan/resilience.js
          node --check pu-plan/transport-bridge.js
          node --check pu-plan/cloud-replication.js
          node --check pu-plan/main.js
          grep -q 'pu-plan-api-v8' pu-plan/resilience.js
          ! grep -q 'pu-plan-api-v7' pu-plan/resilience.js
          ! grep -q 'pu-plan-sync-v1' pu-plan/cloud-replication.js
          grep -q 'pu-plan-replica-v2' pu-plan/cloud-replication.js
          grep -q 'puplan_session_standby_v1' pu-plan/resilience.js

      - name: Commit client routing changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pu-plan/resilience.js pu-plan/transport-bridge.js pu-plan/main.js
          git commit -m 'fix(nolu): route failover through independent v8 sessions'
          git push origin HEAD:fix/nolu-replica-v2-client
