name: nolu internal RPC boundary

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/nolu-internal-rpc-boundary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/nolu-internal-rpc-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-rpc-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROJECT_URL: https://hrrmkrayvrgnwcroyttp.supabase.co
      PUBLISHABLE_KEY: sb_publishable_jXaj3aY5lPDvLEUBOzAuCQ_eKoAHTKN
    steps:
      - uses: actions/checkout@v6

      - name: Verify migration keeps internal helpers service-only
        run: |
          set -euo pipefail
          f=supabase/migrations/20260911171500_lock_down_unguarded_security_definer_rpcs.sql
          test -f "$f"
          grep -q 'apply_late_penalty(uuid).*anon, authenticated' "$f"
          grep -q 'increment_ai_usage(uuid).*anon, authenticated' "$f"
          grep -q 'enqueue_webhook_event(text, jsonb).*anon, authenticated' "$f"
          grep -q 'apply_late_penalty(uuid).*service_role' "$f"
          grep -q 'increment_ai_usage(uuid).*service_role' "$f"
          grep -q 'enqueue_webhook_event(text, jsonb).*service_role' "$f"

      - name: Anonymous OpenAPI schema must not advertise internal RPCs
        run: |
          set -euo pipefail
          code=$(curl -sS --connect-timeout 3 --max-time 10 \
            -o /tmp/openapi.json -w '%{http_code}' \
            "$PROJECT_URL/rest/v1/" \
            -H "apikey: $PUBLISHABLE_KEY" \
            -H 'Accept: application/openapi+json')
          test "$code" = 200
          for fn in apply_late_penalty increment_ai_usage enqueue_webhook_event; do
            if grep -q "\/rpc\/$fn" /tmp/openapi.json; then
              echo "::error::Anonymous OpenAPI schema exposes internal RPC $fn"
              exit 1
            fi
          done

      - name: Safe anonymous probes must hit permission boundary
        run: |
          set -euo pipefail
          probe() {
            local fn="$1"
            local payload="$2"
            local body="/tmp/${fn}.json"
            local code
            code=$(curl -sS --connect-timeout 3 --max-time 8 \
              -o "$body" -w '%{http_code}' -X POST \
              "$PROJECT_URL/rest/v1/rpc/$fn" \
              -H "apikey: $PUBLISHABLE_KEY" \
              -H 'Content-Type: application/json' \
              --data "$payload")
            echo "$fn -> HTTP $code"
            if [[ "$code" =~ ^2 ]]; then
              echo "::error::Anonymous caller executed internal RPC $fn"
              cat "$body"
              exit 1
            fi
            if [ "$code" -ge 500 ]; then
              echo "::error::$fn returned server error instead of permission boundary"
              cat "$body"
              exit 1
            fi
          }
          probe apply_late_penalty '{"p_submission_id":"00000000-0000-4000-8000-000000000000"}'
          probe enqueue_webhook_event '{"p_event_type":"__nolu_security_probe_no_subscriber__","p_payload":{}}'
