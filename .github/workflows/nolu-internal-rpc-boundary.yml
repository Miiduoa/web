name: nolu internal RPC boundary

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/nolu-internal-rpc-boundary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/nolu-internal-rpc-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  internal-rpc-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PROJECT_URL: https://hrrmkrayvrgnwcroyttp.supabase.co
      PUBLISHABLE_KEY: sb_publishable_jXaj3aY5lPDvLEUBOzAuCQ_eKoAHTKN
    steps:
      - uses: actions/checkout@v7

      - name: Verify migration keeps internal helpers service-only
        run: |
          set -euo pipefail
          f=supabase/migrations/20260911171500_lock_down_unguarded_security_definer_rpcs.sql
          test -f "$f"
          grep -q 'apply_late_penalty(uuid).*anon, authenticated' "$f"
          grep -q 'increment_ai_usage(uuid).*anon, authenticated' "$f"
          grep -q 'enqueue_webhook_event(text, jsonb).*anon, authenticated' "$f"
          grep -q 'apply_late_penalty(uuid).*service_role' "$f"
          grep -q 'increment_ai_usage(uuid).*service_role' "$f"
          grep -q 'enqueue_webhook_event(text, jsonb).*service_role' "$f"

      - name: Verify course RPC authorization migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/20260911184500_harden_course_rpc_authorization.sql')
          assert p.exists(), 'course RPC hardening migration is missing'
          s=p.read_text().lower()
          required=[
            'peer_review_responses_one_per_pair_idx',
            'for update of pr',
            'v_reviewer is distinct from auth.uid()',
            "v_status <> 'pending'",
            "course_member_has_capability(v_course, 'assignments.grade'::text)",
            'v_pair_reviewer is distinct from auth.uid()',
            "a.visibility_scope = 'course'",
            "a.visibility_scope = 'group'",
            'where auth.uid() is not null',
            'drop policy if exists announcement_reads_insert_self',
            'drop policy if exists rubric_scores_insert_self',
            'drop policy if exists rubric_scores_update_self',
            'revoke all on function public.submit_peer_review(uuid, jsonb, text) from public, anon',
            'revoke all on function public.submit_rubric_score(uuid, text, uuid, jsonb, text) from public, anon',
            'revoke all on function public.mark_announcement_read(uuid) from public, anon',
            'revoke all on function public.my_calendar_events(timestamptz, timestamptz) from public, anon',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'missing course RPC guardrails: {missing}'
          print('course RPC authorization source guardrails passed')
          PY

      - name: Verify quiz integrity migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/20260911185500_harden_quiz_attempt_integrity.sql')
          assert p.exists(), 'quiz integrity migration is missing'
          s=p.read_text().lower()
          required=[
            'drop policy if exists quiz_attempts_insert',
            'drop policy if exists quiz_attempts_update_self_unsubmitted',
            'revoke insert, update, delete, truncate on table public.quiz_attempts',
            'manual_score is null',
            'qq.id = quiz_answers.question_id',
            'qq.quiz_id = qa.quiz_id',
            'quiz_answers.question_id = any (qa.drawn_question_ids)',
            'grant insert (attempt_id, question_id, answer)',
            'grant update (answer)',
            'revoke all on function public.start_quiz_attempt(uuid) from public, anon',
            'revoke all on function public.submit_quiz_attempt(uuid) from public, anon',
            'revoke all on function public.sync_quiz_gradebook_from_attempt(uuid) from public, anon',
            'revoke all on function public.set_quiz_manual_score(uuid, uuid, numeric) from public, anon',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'missing quiz integrity guardrails: {missing}'
          forbidden=[
            'grant update (manual_score)',
            'grant insert (attempt_id, question_id, answer, manual_score)',
          ]
          present=[x for x in forbidden if x in s]
          assert not present, f'unsafe quiz grants reintroduced: {present}'
          print('quiz integrity source guardrails passed')
          PY

      - name: Verify identity and grading integrity migration
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/migrations/20260911190000_harden_identity_grade_submission_boundaries.sql')
          assert p.exists(), 'identity/grade hardening migration is missing'
          s=p.read_text().lower()
          required=[
            'create or replace function public.protect_profile_role()',
            "new.role is distinct from old.role",
            "raise exception 'platform role is server-managed'",
            'revoke all on function public.protect_profile_role() from public, anon, authenticated',
            'create trigger profiles_protect_role',
            'drop policy if exists course_members_insert_self_student',
            'revoke all on function public.enroll_by_code(text) from public, anon',
            'drop policy if exists grade_scores_insert_student_own_quiz',
            'drop policy if exists grade_scores_update_student_own_quiz',
            'create or replace function public.protect_submission_integrity()',
            'new.assignment_id is distinct from old.assignment_id',
            'new.student_id is distinct from old.student_id',
            'new.grade is distinct from old.grade',
            'new.submitted_at is distinct from old.submitted_at',
            'create trigger submissions_protect_integrity',
            'and grade is null',
            'and graded_by is null',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'missing identity/grade guardrails: {missing}'
          print('identity, enrollment, grade and submission guardrails passed')
          PY

      - name: Anonymous Data API must reject internal and signed-in-only RPCs
        run: |
          set -euo pipefail
          probe() {
            local fn="$1"
            local payload="$2"
            local body="/tmp/${fn}.json"
            local code=""
            local rc=1
            local attempt
            for attempt in 1 2 3; do
              set +e
              code=$(curl -sS --connect-timeout 4 --max-time 8 \
                -o "$body" -w '%{http_code}' -X POST \
                "$PROJECT_URL/rest/v1/rpc/$fn" \
                -H "apikey: $PUBLISHABLE_KEY" \
                -H 'Content-Type: application/json' \
                --data "$payload")
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                break
              fi
              echo "::warning::$fn transport attempt $attempt failed with curl exit $rc; retrying"
              sleep "$attempt"
            done
            if [ "$rc" -ne 0 ]; then
              echo "::warning::$fn live probe was transport-inconclusive after 3 attempts; static ACL migration guard remains enforced"
              return 0
            fi
            echo "$fn -> HTTP $code"
            if [[ "$code" =~ ^2 ]]; then
              echo "::error::Anonymous caller executed protected RPC $fn"
              cat "$body"
              exit 1
            fi
            # Supabase may return an infrastructure-level 504 while the primary
            # database is unreachable. That response does not prove the RPC body
            # executed, so keep the static ACL assertion authoritative and mark
            # this individual live probe inconclusive. Other 5xx responses still
            # fail closed because they may come from an actually invoked RPC.
            if [ "$code" = "504" ] && grep -Eqi 'Gateway Timeout|upstream.*tim(e|ed)[ -]?out' "$body"; then
              echo "::warning::$fn live probe is infrastructure-inconclusive (HTTP 504 Gateway Timeout); static ACL migration guard remains enforced"
              return 0
            fi
            if [ "$code" -ge 500 ]; then
              echo "::error::$fn returned server error instead of permission boundary"
              cat "$body"
              exit 1
            fi
            if ! grep -Eqi 'PGRST202|PGRST301|permission denied|Could not find the function|not found|JWT|unauthenticated' "$body"; then
              echo "::error::$fn failed for a reason other than the expected permission/schema boundary"
              cat "$body"
              exit 1
            fi
          }
          probe apply_late_penalty '{"p_submission_id":"00000000-0000-4000-8000-000000000000"}'
          probe increment_ai_usage '{"p_uid":"00000000-0000-4000-8000-000000000000"}'
          probe enqueue_webhook_event '{"p_event_type":"__nolu_security_probe_no_subscriber__","p_payload":{}}'
          probe submit_peer_review '{"p_pair_id":"00000000-0000-4000-8000-000000000000","p_scores":{},"p_comment":""}'
          probe submit_rubric_score '{"p_rubric_id":"00000000-0000-4000-8000-000000000000","p_target_kind":"submission","p_target_id":"00000000-0000-4000-8000-000000000000","p_scores":{},"p_comment":""}'
          probe mark_announcement_read '{"p_announcement_id":"00000000-0000-4000-8000-000000000000"}'
          probe my_calendar_events '{"p_from":null,"p_to":null}'
          probe start_quiz_attempt '{"p_quiz_id":"00000000-0000-4000-8000-000000000000"}'
          probe submit_quiz_attempt '{"p_attempt_id":"00000000-0000-4000-8000-000000000000"}'
          probe sync_quiz_gradebook_from_attempt '{"p_attempt_id":"00000000-0000-4000-8000-000000000000"}'
          probe set_quiz_manual_score '{"p_attempt_id":"00000000-0000-4000-8000-000000000000","p_question_id":"00000000-0000-4000-8000-000000000000","p_score":0}'
          probe enroll_by_code '{"p_code":"__nolu_security_probe__"}'
