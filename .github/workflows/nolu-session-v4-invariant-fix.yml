name: nolu session v4 invariant fix

on:
  push:
    branches: [security/nolu-session-v4-20260911]
    paths:
      - '.github/workflows/nolu-session-v4-invariant-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Repair invariant and verify all active auth sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/pu-plan-api/index.ts')
          text=p.read_text()
          old="  let active=rows.find((s:any)=>s.is_current); if(!active){ active=rows[0]; await db.from('puplan_app_semesters').update({is_current:false}).eq('user_id',uid); await db.from('puplan_app_semesters').update({is_current:true,updated_at:new Date().toISOString()}).eq('id',active.id); active={...active,is_current:true}; rows=rows.map((s:any)=>({...s,is_current:s.id===active.id})); }\n  if(!active)throw new ApiError(500,'無法建立目前學期','SEMESTER_STATE_INVALID');"
          new="  let active=rows.find((s:any)=>s.is_current); if(!active){ const fallback=rows[0]; if(!fallback)throw new ApiError(500,'無法建立目前學期','SEMESTER_STATE_INVALID'); active=fallback; await db.from('puplan_app_semesters').update({is_current:false}).eq('user_id',uid); await db.from('puplan_app_semesters').update({is_current:true,updated_at:new Date().toISOString()}).eq('id',active.id); active={...active,is_current:true}; const activeId=active.id; rows=rows.map((s:any)=>({...s,is_current:s.id===activeId})); }"
          assert old in text, 'expected semester invariant source not found'
          p.write_text(text.replace(old,new,1))
          PY
          deno check supabase/functions/_shared/session-v4.ts supabase/functions/_shared/session-v4_test.ts
          deno check supabase/functions/pu-plan-api-v6/index.ts
          deno check supabase/functions/pu-plan-core-v1/index.ts
          deno check supabase/functions/pu-plan-api/index.ts
          deno check supabase/functions/pu-plan-social/index.ts
          deno check supabase/functions/pu-plan-admin/index.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/pu-plan-api/index.ts
          git diff --cached --check
          git commit -m 'fix(nolu): validate active semester before use'
          git push
