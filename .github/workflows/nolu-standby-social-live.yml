name: nolu standby social live

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/pu-plan-social-standby/index.ts'
      - '.github/workflows/nolu-standby-social-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Trusted origin preflight is scoped
        run: |
          set -euo pipefail
          url='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/pu-plan-social'
          code="$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' -X OPTIONS -H 'Origin: https://miiduoa.github.io' "$url")"
          echo "preflight status=$code"
          sed -n '1,30p' /tmp/headers
          case "$code" in 200|204) ;; *) exit 1 ;; esac
          tr -d '\r' </tmp/headers >/tmp/headers.clean
          grep -Fxiq 'access-control-allow-origin: https://miiduoa.github.io' /tmp/headers.clean
          ! grep -Fxiq 'access-control-allow-origin: *' /tmp/headers.clean
      - name: Evil browser origin is rejected
        run: |
          set -euo pipefail
          url='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/pu-plan-social'
          code="$(curl -sS -o /tmp/body -w '%{http_code}' -X OPTIONS -H 'Origin: https://evil.invalid' "$url")"
          test "$code" = 403
      - name: Missing session cannot reach social data
        run: |
          set -euo pipefail
          url='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/pu-plan-social'
          code="$(curl -sS -o /tmp/body -w '%{http_code}' -X POST -H 'Origin: https://miiduoa.github.io' -H 'Content-Type: application/json' --data '{"action":"feed"}' "$url")"
          test "$code" = 401
          grep -Eq 'UNAUTHORIZED|SESSION_' /tmp/body
