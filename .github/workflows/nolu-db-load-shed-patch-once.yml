name: nolu chat load-shed patch once

on:
  push:
    branches:
      - perf/nolu-free-db-load-shed-20260911
    paths:
      - .github/workflows/nolu-db-load-shed-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: perf/nolu-free-db-load-shed-20260911
      - name: Apply load-shed patch
        run: python3 .github/scripts/patch-community-load-shed.py
      - name: Validate JavaScript
        run: |
          node --check pu-plan/community.js
          grep -q 'inboxInFlight' pu-plan/community.js
          grep -q 'pollingDelay' pu-plan/community.js
          if grep -q 'globalPoll' pu-plan/community.js; then exit 1; fi
          if grep -q 'setInterval(' pu-plan/community.js; then exit 1; fi
      - name: Commit patch
        run: |
          git config user.name Miiduoa
          git config user.email 107848266+Miiduoa@users.noreply.github.com
          git add pu-plan/community.js
          git commit -m 'perf(nolu): shed chat polling database load'
          git push origin HEAD:perf/nolu-free-db-load-shed-20260911
