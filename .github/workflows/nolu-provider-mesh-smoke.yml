name: nolu provider mesh smoke

on:
  push:
    paths:
      - 'pu-plan/provider-config.js'
      - 'pu-plan/provider-mesh.js'
      - 'pu-plan/durable-store.js'
      - 'pu-plan/main.js'
      - 'pu-plan/sw.js'
      - '.github/workflows/nolu-provider-mesh-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-mesh:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Syntax check
        run: |
          node --check pu-plan/provider-config.js
          node --check pu-plan/provider-mesh.js
          node --check pu-plan/durable-store.js
          node --check pu-plan/main.js
          node --check pu-plan/sw.js

      - name: Install Playwright
        run: |
          npm --prefix /tmp/nolu-mesh init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-mesh install playwright >/dev/null 2>&1
          cd /tmp/nolu-mesh && npx playwright install --with-deps chromium >/dev/null

      - name: Verify Neon plus Netlify quorum recovery and fan-out
        env:
          NODE_PATH: /tmp/nolu-mesh/node_modules
        run: |
          cp -R pu-plan /tmp/nolu-provider-app
          python3 - <<'PY'
          from pathlib import Path

          p=Path('/tmp/nolu-provider-app/provider-config.js')
          s=p.read_text()
          s=s.replace(
              "https://ep-delicate-frost-b3q46ijf.apirest.c-4.ap-southeast-1.aws.neon.tech/neondb/rest/v1",
              "https://neon.test/rest/v1"
          )
          p.write_text(s)
          Path('/tmp/nolu-provider-app/mesh-test.html').write_text('''<!doctype html><html><body><script>
          window.__localSnapshot=null;
          window.NOLU_DURABLE={
            getSnapshot:async()=>window.__localSnapshot,
            bindCurrentSession:async()=>true
          };
          window.NOLU_RESILIENCE={state:{mode:'online',activeApi:'https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v8'}};
          window.PUPLAN_CLOUD={isSignedIn:()=>true};
          </script><script type="module" src="./provider-mesh.js"></script></body></html>''')
          PY
          python3 -m http.server 4175 --directory /tmp/nolu-provider-app >/tmp/nolu-provider-http.log 2>&1 &
          cat >/tmp/nolu-mesh/check.cjs <<'NODE'
          const {chromium}=require('playwright');
          const crypto=require('crypto');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const b64=s=>Buffer.from(s).toString('base64url');
          const uid='33333333-3333-4333-8333-333333333333';
          const now=Math.floor(Date.now()/1000);
          const session=`${b64(JSON.stringify({v:4,uid,iat:now,exp:now+3600,cv:'mesh-test'}))}.test-signature`;
          const portable=`${b64(JSON.stringify({alg:'ES256',typ:'NOLU',kid:'test'}))}.${b64(JSON.stringify({v:1,sub:uid,cv:'mesh-test',iat:now,exp:now+3600,iss:'nolu',aud:'nolu-provider-mesh'}))}.test-signature`;
          const fp=crypto.createHash('sha256').update(session).digest('hex');
          const baseSnapshot={
            uid,
            profile:{id:uid,display_name:'Mesh Test',username:'mesh_test',bio:'',avatar_data:'',discoverable:true,role:'user',profile_visibility:'public'},
            courses:[{id:'remote',name:'遠端雙副本課程',day:3,start:2,end:3,teacher:'',room:'C303',color:'green'}],
            meta:{},savedAt:Date.now(),revision:Date.now(),sessionFingerprint:fp
          };
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext();
              const writes={neon:[],netlify:[]};
              await context.route('https://neon.test/**',async route=>{
                const req=route.request();
                if(req.method()==='POST'){
                  const body=JSON.parse(req.postData()||'{}');
                  writes.neon.push(body.snapshot);
                  return route.fulfill({status:201,contentType:'application/json',body:JSON.stringify([body])});
                }
                if(req.method()==='GET'){
                  return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify([{uid,revision:baseSnapshot.revision,digest:'',snapshot:baseSnapshot}])});
                }
                return route.fulfill({status:405,contentType:'application/json',body:'{}'});
              });
              await context.route('https://nolu-mirror.netlify.app/mirror',async route=>{
                const body=JSON.parse(route.request().postData()||'{}');
                if(body.action==='put_snapshot'){
                  writes.netlify.push(body.snapshot);
                  return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,stored:true})});
                }
                if(body.action==='get_snapshot'){
                  return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,snapshot:baseSnapshot})});
                }
                return route.fulfill({status:400,contentType:'application/json',body:JSON.stringify({message:'bad action'})});
              });
              const page=await context.newPage();
              await page.addInitScript(({session,portable,uid})=>{
                localStorage.setItem('puplan_session',session);
                localStorage.setItem('puplan_portable_session_v1',portable);
                localStorage.setItem('puplan_course_owner',uid);
              },{session,portable,uid});
              await page.goto('http://127.0.0.1:4175/mesh-test.html',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>!!window.NOLU_PROVIDER_MESH,{timeout:10000});

              const configured=await page.evaluate(()=>window.NOLU_PROVIDER_MESH.state.configuredProviders);
              assert(configured.includes('supabase')&&configured.includes('neon')&&configured.includes('netlify'),'production mesh4 providers must be registered');
              assert(!configured.includes('render'),'disabled Render candidate must not count toward quorum');

              const recovered=await page.evaluate(()=>window.NOLU_PROVIDER_MESH.recover('ci'));
              assert(recovered===true,'two matching independent mirrors should recover a missing local snapshot');
              const stored=await page.evaluate(async uid=>{const m=await import('./durable-store.js');return m.getSnapshot(uid)},uid);
              assert(stored?.courses?.[0]?.name==='遠端雙副本課程','quorum recovery should persist the agreed remote snapshot');

              await page.evaluate(snap=>{window.__localSnapshot=snap},baseSnapshot);
              const synced=await page.evaluate(()=>window.NOLU_PROVIDER_MESH.sync('ci',true));
              assert(synced===true,'mirror fan-out should succeed when independent providers acknowledge');
              assert(writes.neon.length>=1,'Neon Data API mirror should receive the snapshot');
              assert(writes.netlify.length>=1,'Netlify mirror should receive the snapshot');
              assert(writes.neon.at(-1)?.uid===uid&&writes.netlify.at(-1)?.uid===uid,'both mirrors must receive only the current account snapshot');
              console.log('PROVIDER_MESH4_OK',{configured,writes:{neon:writes.neon.length,netlify:writes.netlify.length}});
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 90s node /tmp/nolu-mesh/check.cjs
