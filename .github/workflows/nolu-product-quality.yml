name: nolu product quality
on:
  push:
    branches: [main, fix/nolu-product-quality-20261011]
    paths: ['pu-plan/**', 'tests/product/**', '.github/workflows/nolu-product-quality.yml']
  pull_request:
    branches: [main]
    paths: ['pu-plan/**', 'tests/product/**', '.github/workflows/nolu-product-quality.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: product-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: find pu-plan -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run planning and input boundary tests
        run: TZ=Asia/Taipei node --test tests/product/planning.test.mjs
      - name: Run account isolation regression
        run: node .github/tests/guest-privacy.cjs
      - name: Install browser test runner
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise isolated guest workflows
        run: python tests/product/browser.py
      - name: Preserve screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nolu-product-quality
          path: product-test-results/
          retention-days: 7
          if-no-files-found: warn
