name: nolu product quality

on:
  push:
    branches: [main, fix/nolu-product-quality-20261011]
    paths:
      - 'pu-plan/**'
      - 'tests/product/**'
      - '.github/workflows/nolu-product-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/**'
      - 'tests/product/**'
      - '.github/workflows/nolu-product-quality.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend JavaScript syntax
        run: find pu-plan -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run account isolation unit tests
        run: node .github/tests/guest-privacy.cjs
      - name: Capture tracked frontend for isolated regression review
        run: git archive --format=tar.gz --output=/tmp/nolu-ui-source.tar.gz HEAD pu-plan .github package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: nolu-ui-review-source
          path: /tmp/nolu-ui-source.tar.gz
          retention-days: 1
          if-no-files-found: error
