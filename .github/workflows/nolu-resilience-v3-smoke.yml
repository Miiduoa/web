name: nolu resilience v3 smoke

on:
  push:
    branches: [main, fix/nolu-resilience-v3, feat/nolu-hot-standby-v1]
    paths:
      - 'pu-plan/durable-store.js'
      - 'pu-plan/durable-bridge.js'
      - 'pu-plan/transport-bridge.js'
      - 'pu-plan/resilience.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - 'pu-plan/index.html'
      - '.github/workflows/nolu-resilience-v3-smoke.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  resilience-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: |
          node --check pu-plan/durable-store.js
          node --check pu-plan/durable-bridge.js
          node --check pu-plan/transport-bridge.js
          node --check pu-plan/resilience.js
          node --check pu-plan/sw.js
          node --check pu-plan/pwa.js

      - name: Install Playwright
        run: |
          npm --prefix /tmp/nolu-v3 init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-v3 install playwright >/dev/null 2>&1
          cd /tmp/nolu-v3 && npx playwright install --with-deps chromium >/dev/null

      - name: Verify durable cache is bound to the exact session
        env:
          NODE_PATH: /tmp/nolu-v3/node_modules
        run: |
          cat >pu-plan/__durable_v3_test.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body><div id="cloudState"></div><script type="module" src="./durable-bridge.js"></script></body>
          HTML
          python3 -m http.server 4173 --directory pu-plan >/tmp/nolu-v3-http.log 2>&1 &
          cat >/tmp/nolu-v3/session.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const b64=s=>Buffer.from(s).toString('base64url');
          const makeToken=(uid,nonce)=>`${b64(JSON.stringify({v:4,uid,nonce,iat:Math.floor(Date.now()/1000),exp:Math.floor(Date.now()/1000)+3600,cv:`cv-${nonce}`}))}.${b64(`sig-${nonce}`)}`;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext();
              const page=await context.newPage();
              await page.goto('http://127.0.0.1:4173/__durable_v3_test.html');
              const uid='33333333-3333-4333-8333-333333333333';
              const tokenA=makeToken(uid,'A');
              await page.evaluate(({uid,tokenA})=>{
                localStorage.clear();sessionStorage.clear();
                localStorage.setItem('puplan_session',tokenA);
                localStorage.setItem('puplan_course_owner',uid);
                localStorage.setItem('puplan_name','Session A');
                localStorage.setItem('puplan_username','session_a');
                localStorage.setItem('puplan_courses',JSON.stringify([{id:'secret-a',name:'只屬於 Session A',day:1,start:1,end:1,teacher:'',room:'A1',color:'violet'}]));
              },{uid,tokenA});
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.NOLU_DURABLE?.state?.ready===true&&window.NOLU_DURABLE?.state?.bound===true);
              await page.evaluate(()=>window.NOLU_DURABLE.mirror());
              const first=await page.evaluate(uid=>window.NOLU_DURABLE.getSnapshot(uid),uid);
              assert(first?.courses?.[0]?.name==='只屬於 Session A','session A snapshot was not stored');
              assert(first?.sessionFingerprint,'session A snapshot is not fingerprint-bound');

              const tokenB=makeToken(uid,'B');
              await page.evaluate(tokenB=>{
                localStorage.setItem('puplan_session',tokenB);
                localStorage.removeItem('puplan_courses');
                localStorage.setItem('puplan_name','Session B');
                localStorage.setItem('puplan_username','session_b');
              },tokenB);
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.NOLU_DURABLE?.state?.ready===true&&window.NOLU_DURABLE?.state?.bound===true);
              const second=await page.evaluate(()=>({
                courses:JSON.parse(localStorage.getItem('puplan_courses')||'[]'),
                fingerprint:window.NOLU_DURABLE.state.sessionFingerprint
              }));
              const storedB=await page.evaluate(uid=>window.NOLU_DURABLE.getSnapshot(uid),uid);
              assert(second.courses.length===0,'old durable courses leaked into a different session token');
              assert(storedB?.courses?.length===0,'old durable snapshot was not replaced for the new session');
              assert(storedB?.sessionFingerprint===second.fingerprint,'new durable snapshot is not bound to session B');
              assert(storedB?.sessionFingerprint!==first.sessionFingerprint,'session fingerprints unexpectedly match');
              console.log('SESSION_BOUND_DURABLE_OK');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 70s node /tmp/nolu-v3/session.cjs
          rm -f pu-plan/__durable_v3_test.html

      - name: Verify cloud and legacy circuit breakers fail fast after dual-region outage
        env:
          NODE_PATH: /tmp/nolu-v3/node_modules
        run: |
          cat >pu-plan/__circuit_v3_test.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body><div id="cloudState"></div><script type="module">import './transport-bridge.js';import './resilience.js';</script></body>
          HTML
          cat >/tmp/nolu-v3/circuit.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const b64=s=>Buffer.from(s).toString('base64url');
          const MUMBAI='hrrmkrayvrgnwcroyttp';
          const TOKYO='ltfurqaspqsvswmebyzw';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext();
              let requests=0;const seen=[];
              await context.route('https://*.supabase.co/functions/v1/**',route=>{
                const host=new URL(route.request().url()).host;
                if(host.startsWith(MUMBAI)||host.startsWith(TOKYO)){requests++;seen.push(route.request().url())}
                route.abort('timedout');
              });
              const page=await context.newPage();
              const uid='44444444-4444-4444-8444-444444444444';
              const token=`${b64(JSON.stringify({v:4,uid,iat:Math.floor(Date.now()/1000),exp:Math.floor(Date.now()/1000)+3600,cv:'circuit-test'}))}.test-signature`;
              await page.addInitScript(({uid,token})=>{
                localStorage.clear();sessionStorage.clear();
                localStorage.setItem('puplan_session',token);
                localStorage.setItem('puplan_course_owner',uid);
                localStorage.setItem('puplan_name','Circuit Test');
                localStorage.setItem('puplan_username','circuit_test');
              },{uid,token});
              await page.goto('http://127.0.0.1:4173/__circuit_v3_test.html',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.NOLU_RESILIENCE&&window.NOLU_TRANSPORT);
              requests=0;seen.length=0;
              const primary='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v8';
              const opts={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'bootstrap'})};
              const first=await page.evaluate(async({primary,opts})=>{const t=performance.now();const r=await fetch(primary,opts);return {ms:performance.now()-t,data:await r.json()}},{primary,opts});
              const afterFirst=requests,firstSeen=[...seen];
              const second=await page.evaluate(async({primary,opts})=>{const t=performance.now();const r=await fetch(primary,opts);return {ms:performance.now()-t,data:await r.json()}},{primary,opts});
              const afterSecond=requests;
              assert(first.data?.offline===true&&second.data?.offline===true,'safe bootstrap did not fall back offline');
              assert(firstSeen.some(u=>u.includes(MUMBAI)),'first outage request did not attempt Mumbai');
              assert(firstSeen.some(u=>u.includes(TOKYO)),'first outage request did not attempt Tokyo standby');
              assert(afterSecond===afterFirst,'second outage request ignored open cloud circuits');
              assert(second.ms<500,`second cloud request did not fail fast: ${second.ms}ms`);

              const legacy='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api';
              const legacyOpts={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'semesters'})};
              const expectedLegacy=await page.evaluate(()=>window.NOLU_TRANSPORT.candidates.length);
              const beforeLegacy=requests;
              await page.evaluate(async({legacy,legacyOpts})=>{try{await fetch(legacy,legacyOpts)}catch{}},{legacy,legacyOpts});
              const afterLegacyFirst=requests;
              const legacySecond=await page.evaluate(async({legacy,legacyOpts})=>{const t=performance.now();try{await fetch(legacy,legacyOpts)}catch{}return performance.now()-t},{legacy,legacyOpts});
              const afterLegacySecond=requests;
              assert(afterLegacyFirst-beforeLegacy===expectedLegacy,`legacy transport attempted ${afterLegacyFirst-beforeLegacy}, expected ${expectedLegacy}`);
              assert(afterLegacySecond===afterLegacyFirst,'legacy transport ignored its open circuits');
              assert(legacySecond<500,`legacy circuit did not fail fast: ${legacySecond}ms`);
              console.log('CIRCUIT_BREAKERS_OK',{afterFirst,secondMs:second.ms,legacyFirst:afterLegacyFirst-beforeLegacy,legacySecondMs:legacySecond});
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 70s node /tmp/nolu-v3/circuit.cjs
          rm -f pu-plan/__circuit_v3_test.html
