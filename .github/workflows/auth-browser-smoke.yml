name: nolu browser auth connectivity

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/cloud.js'
      - 'pu-plan/auth.js'
      - 'pu-plan/guest-privacy.js'
      - 'pu-plan/index.html'
      - 'pu-plan/sw.js'
      - '.github/tests/guest-privacy.cjs'
      - '.github/workflows/auth-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolu-browser-auth-connectivity
  cancel-in-progress: true

jobs:
  browser-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check guest data isolation
        run: node .github/tests/guest-privacy.cjs
      - name: Install Playwright
        run: |
          npm --prefix /tmp/nolu-auth init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-auth install playwright >/dev/null 2>&1
          cd /tmp/nolu-auth && npx playwright install --with-deps chromium >/dev/null
      - name: Diagnose browser transport and login path
        env:
          NODE_PATH: /tmp/nolu-auth/node_modules
        run: |
          cat >/tmp/nolu-auth/check.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              await page.goto('https://miiduoa.github.io/web/',{waitUntil:'domcontentloaded',timeout:45000});
              const results=await page.evaluate(async()=>{
                const base='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v6';
                async function probe(label,body,contentType,ms=6000){
                  const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),ms),started=performance.now();
                  try{
                    const r=await fetch(base,{method:'POST',headers:{'Content-Type':contentType},body:JSON.stringify(body),signal:ctrl.signal,cache:'no-store'});
                    return {label,ok:true,status:r.status,ms:Math.round(performance.now()-started),acao:r.headers.get('access-control-allow-origin'),text:(await r.text()).slice(0,240)};
                  }catch(e){return {label,ok:false,ms:Math.round(performance.now()-started),name:e?.name||'',error:String(e)}}
                  finally{clearTimeout(timer)}
                }
                return [
                  await probe('simple-no-db',{action:'bootstrap'},'text/plain;charset=UTF-8'),
                  await probe('preflight-no-db',{action:'bootstrap'},'application/json'),
                  await probe('simple-login-db',{action:'login',email:'browser-smoke-does-not-exist@example.invalid',password:'invalid-password-123'},'text/plain;charset=UTF-8',8000)
                ];
              });
              console.log('AUTH_DIAGNOSTICS',JSON.stringify(results));
              const simple=results.find(x=>x.label==='simple-no-db');
              if(!simple?.ok||simple.status!==401)throw new Error(`edge transport without preflight failed: ${JSON.stringify(results)}`);
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 70s node /tmp/nolu-auth/check.cjs
