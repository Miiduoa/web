name: nolu browser auth connectivity

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/cloud.js'
      - 'pu-plan/auth.js'
      - 'pu-plan/index.html'
      - 'pu-plan/sw.js'
      - '.github/workflows/auth-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolu-browser-auth-connectivity
  cancel-in-progress: true

jobs:
  browser-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install Playwright
        run: |
          npm --prefix /tmp/nolu-auth init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-auth install playwright >/dev/null 2>&1
          cd /tmp/nolu-auth && npx playwright install --with-deps chromium >/dev/null
      - name: Verify production browser can reach at least one auth API
        env:
          NODE_PATH: /tmp/nolu-auth/node_modules
        run: |
          cat >/tmp/nolu-auth/check.cjs <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              await page.goto('https://miiduoa.github.io/web/',{waitUntil:'domcontentloaded',timeout:45000});
              const result=await page.evaluate(async()=>{
                const urls=[
                  'https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v6',
                  'https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-core-v1'
                ];
                const out=[];
                for(const url of urls){
                  const ctrl=new AbortController();
                  const timer=setTimeout(()=>ctrl.abort(),8000);
                  try{
                    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:'browser-smoke-does-not-exist@example.invalid',password:'invalid-password-123'}),signal:ctrl.signal,cache:'no-store'});
                    out.push({url,ok:true,status:r.status,acao:r.headers.get('access-control-allow-origin'),text:(await r.text()).slice(0,240)});
                  }catch(e){out.push({url,ok:false,error:String(e),name:e?.name||''})}
                  finally{clearTimeout(timer)}
                  if(out.at(-1)?.ok&&(out.at(-1).status===401||out.at(-1).status===429))break;
                }
                return out;
              });
              console.log('AUTH_BROWSER_RESULTS',JSON.stringify(result));
              const good=result.find(x=>x.ok&&(x.status===401||x.status===429));
              if(!good)throw new Error(`all browser auth endpoints failed: ${JSON.stringify(result)}`);
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 90s node /tmp/nolu-auth/check.cjs
