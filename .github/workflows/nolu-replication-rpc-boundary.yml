name: nolu replication RPC boundary

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/nolu-replication-rpc-boundary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/nolu-replication-rpc-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PROJECT_URL: https://hrrmkrayvrgnwcroyttp.supabase.co
      PUBLISHABLE_KEY: sb_publishable_jXaj3aY5lPDvLEUBOzAuCQ_eKoAHTKN
    steps:
      - uses: actions/checkout@v6

      - name: Verify migration revokes public execution
        run: |
          set -euo pipefail
          f=supabase/migrations/20260911171000_lock_down_nolu_replication_rpcs.sql
          test -f "$f"
          grep -q 'puplan_apply_failback_snapshot(jsonb).*anon, authenticated' "$f"
          grep -q 'puplan_enqueue_social_replication().*anon, authenticated' "$f"
          grep -q 'puplan_queue_replication_for_user(uuid).*anon, authenticated' "$f"
          grep -q 'puplan_apply_failback_snapshot(jsonb).*service_role' "$f"
          grep -q 'puplan_queue_replication_for_user(uuid).*service_role' "$f"

      - name: Anonymous Data API must not execute privileged replication RPCs
        run: |
          set -euo pipefail
          probe() {
            local fn="$1"
            local payload="$2"
            local body="/tmp/${fn}.json"
            local code=""
            local rc=1
            local attempt
            for attempt in 1 2 3; do
              set +e
              code=$(curl -sS --connect-timeout 3 --max-time 8 -o "$body" -w '%{http_code}' -X POST \
                "$PROJECT_URL/rest/v1/rpc/$fn" \
                -H "apikey: $PUBLISHABLE_KEY" \
                -H 'Content-Type: application/json' \
                --data "$payload")
              rc=$?
              set -e
              if [ "$rc" -eq 0 ]; then
                break
              fi
              echo "::warning::$fn transport attempt $attempt failed with curl exit $rc; retrying"
              sleep "$attempt"
            done
            if [ "$rc" -ne 0 ]; then
              echo "::warning::$fn live probe was transport-inconclusive after 3 attempts; migration ACL guard remains enforced"
              return 0
            fi
            echo "$fn -> HTTP $code"
            if [[ "$code" =~ ^2 ]]; then
              echo "::error::Anonymous caller executed privileged RPC $fn"
              cat "$body"
              exit 1
            fi
            if [ "$code" -ge 500 ]; then
              echo "::error::$fn returned server error instead of a permission boundary"
              cat "$body"
              exit 1
            fi
          }
          probe puplan_apply_failback_snapshot '{"p_payload":{"v":1,"kind":"failback-snapshot","iss":"ltfurqaspqsvswmebyzw","aud":"hrrmkrayvrgnwcroyttp","uid":"00000000-0000-4000-8000-000000000000","iat":"2099-01-01T00:00:00Z","exp":"2099-01-01T00:01:00Z","bundle":{"user":{"id":"00000000-0000-4000-8000-000000000000"}}}}'
          probe puplan_queue_replication_for_user '{"p_uid":"00000000-0000-4000-8000-000000000000"}'
