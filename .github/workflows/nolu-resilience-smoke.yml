name: nolu resilience smoke

on:
  push:
    branches: [main, fix/nolu-resilience-v1, feat/nolu-hot-standby-v1]
    paths:
      - 'pu-plan/resilience.js'
      - 'pu-plan/main.js'
      - 'pu-plan/cloud.js'
      - 'pu-plan/durable-bridge.js'
      - 'pu-plan/guest-privacy.js'
      - '.github/workflows/nolu-resilience-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/resilience.js'
      - 'pu-plan/main.js'
      - 'pu-plan/cloud.js'
      - 'pu-plan/durable-bridge.js'
      - 'pu-plan/guest-privacy.js'
      - '.github/workflows/nolu-resilience-smoke.yml'

permissions:
  contents: read

jobs:
  offline-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: |
          node --check pu-plan/resilience.js
          node --check pu-plan/main.js
          node --check pu-plan/durable-bridge.js
          node --check pu-plan/guest-privacy.js
      - name: Install Playwright
        run: |
          npm --prefix /tmp/nolu-resilience init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-resilience install playwright >/dev/null 2>&1
          cd /tmp/nolu-resilience && npx playwright install --with-deps chromium >/dev/null
      - name: Verify trusted cached account opens and queues writes while both clouds are down
        env:
          NODE_PATH: /tmp/nolu-resilience/node_modules
        run: |
          cat >pu-plan/__resilience_seed_test.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>nolu resilience seed</title>
          HTML
          python3 -m http.server 4173 --directory pu-plan >/tmp/nolu-http.log 2>&1 &
          cat >/tmp/nolu-resilience/check.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const b64=s=>Buffer.from(s).toString('base64url');
          const MUMBAI='hrrmkrayvrgnwcroyttp',TOKYO='ltfurqaspqsvswmebyzw';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext();
              await context.route('https://*.supabase.co/functions/v1/**',route=>{
                const host=new URL(route.request().url()).host;
                if(host.startsWith(MUMBAI)||host.startsWith(TOKYO))return route.abort('timedout');
                return route.continue();
              });
              const page=await context.newPage();
              const uid='11111111-1111-4111-8111-111111111111';
              const issued=Math.floor(Date.now()/1000);
              const payload=b64(JSON.stringify({v:4,uid,iat:issued,exp:issued+3600,cv:'offline-test'}));
              const token=`${payload}.test-signature`;

              // Model a previously authenticated device. The server signature is not
              // re-verified while offline; trust comes only from possession of the exact
              // raw token that was fingerprint-bound to this durable snapshot earlier.
              await page.goto('http://127.0.0.1:4173/__resilience_seed_test.html',{waitUntil:'domcontentloaded'});
              await page.evaluate(async({uid,token})=>{
                localStorage.clear();sessionStorage.clear();
                localStorage.setItem('puplan_session',token);
                const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token));
                const sessionFingerprint=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');
                const snapshot={
                  uid,
                  profile:{id:uid,display_name:'Offline Test',username:'offline_test',avatar_data:'',bio:'',discoverable:true},
                  courses:[{id:'c1',name:'離線課程',day:1,start:1,end:2,teacher:'',room:'A101',color:'violet'}],
                  meta:{school:'Offline Test'},
                  savedAt:Date.now(),revision:Date.now(),sessionFingerprint
                };
                await new Promise((resolve,reject)=>{
                  const req=indexedDB.open('nolu-resilience-v2',1);
                  req.onupgradeneeded=()=>{
                    const db=req.result;
                    if(!db.objectStoreNames.contains('snapshots'))db.createObjectStore('snapshots',{keyPath:'uid'});
                    if(!db.objectStoreNames.contains('outbox')){
                      const store=db.createObjectStore('outbox',{keyPath:'id'});
                      store.createIndex('by_uid','uid',{unique:false});
                      store.createIndex('by_uid_changed',['uid','changedAt'],{unique:false});
                    }
                  };
                  req.onerror=()=>reject(req.error);
                  req.onsuccess=()=>{
                    const db=req.result,tx=db.transaction('snapshots','readwrite');
                    tx.objectStore('snapshots').put(snapshot);
                    tx.oncomplete=()=>{db.close();resolve()};
                    tx.onerror=()=>reject(tx.error);
                  };
                });
              },{uid,token});

              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.PUPLAN_CLOUD?.isSignedIn?.()===true&&window.NOLU_DURABLE?.state?.bound===true,{timeout:15000});
              const result=await page.evaluate(()=>({
                gateOff:document.querySelector('#authGate')?.classList.contains('off'),
                mode:window.NOLU_RESILIENCE?.getMode?.(),
                courses:window.PUPLAN_APP?.courses?.(),
                banner:document.querySelector('#noluResilienceBanner')?.textContent||'',
                bound:window.NOLU_DURABLE?.state?.bound
              }));
              console.log('OFFLINE_BOOTSTRAP',result);
              assert(result.gateOff,'auth gate should be hidden for a fingerprint-bound cached account');
              assert(result.bound===true,'durable snapshot must be bound to the exact session fingerprint');
              assert(result.mode==='offline','resilience mode should be offline');
              assert(result.courses?.[0]?.name==='離線課程','trusted cached schedule should remain available');
              assert(result.banner.includes('離線保護模式'),'offline banner should be visible');
              await page.evaluate(()=>window.PUPLAN_APP.setCoursesFromUser([{id:'c2',name:'新離線課程',day:2,start:3,end:4,teacher:'',room:'B202',color:'blue'}]));
              await page.waitForFunction(uid=>{
                const queued=JSON.parse(localStorage.getItem(`nolu_pending_mutations_v1:${uid}`)||'{}');
                return queued.schedule?.courses?.[0]?.name==='新離線課程';
              },uid,{timeout:10000});
              const queued=await page.evaluate(uid=>JSON.parse(localStorage.getItem(`nolu_pending_mutations_v1:${uid}`)||'{}'),uid);
              console.log('QUEUED_WRITE',queued);
              assert(queued.schedule?.courses?.[0]?.name==='新離線課程','schedule edit should be queued locally');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 70s node /tmp/nolu-resilience/check.cjs
          rm -f pu-plan/__resilience_seed_test.html
