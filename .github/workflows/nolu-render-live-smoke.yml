name: nolu Render mirror live smoke

on:
  push:
    branches: [main]
    paths:
      - 'services/nolu-render-mirror/**'
      - 'pu-plan/nolu-mesh-jwks.json'
      - '.github/workflows/nolu-render-live-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/nolu-render-mirror/**'
      - 'pu-plan/nolu-mesh-jwks.json'
      - '.github/workflows/nolu-render-live-smoke.yml'
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolu-render-live-smoke-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          server='services/nolu-render-mirror/server.mjs'
          jwks='pu-plan/nolu-mesh-jwks.json'
          test -s "$server"
          test -s "$jwks"
          grep -q "const ALLOWED_ORIGIN='https://miiduoa.github.io'" "$server"
          grep -q "'mesh-mumbai-20260911-5'" "$server"
          grep -q "'mesh-tokyo-20260911-5'" "$server"
          grep -q 'mesh-mumbai-20260911-5' "$jwks"
          grep -q 'mesh-tokyo-20260911-5' "$jwks"
          grep -q "status:'unconfigured'" "$server"
          grep -q "status:'available'" "$server"
          grep -q "status:'unavailable'" "$server"
          grep -q "portable_auth:'regional-es256-v2'" "$server"
          ! grep -Eqi 'console\.(log|error).*DATABASE_URL|console\.(log|error).*SERVICE_ROLE|console\.(log|error).*PRIVATE KEY' "$server"

      - name: Verify Render readiness and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nolu-render-mirror.onrender.com'
          body=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$body" "$headers"' EXIT

          code='000'
          for attempt in 1 2 3 4 5; do
            : >"$body"
            : >"$headers"
            set +e
            code=$(curl -sS --connect-timeout 8 --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$BASE/health")
            rc=$?
            set -e
            if [ "$rc" -eq 0 ] && { [ "$code" = '200' ] || [ "$code" = '503' ]; }; then
              break
            fi
            echo "::warning::Render health attempt $attempt was inconclusive (curl=$rc HTTP=${code:-000})"
            sleep 5
          done
          echo "[health] HTTP $code :: $(cat "$body")"
          if [ "$code" != '200' ] && [ "$code" != '503' ]; then
            echo "::error::Render health endpoint did not return an expected readiness status"
            exit 1
          fi
          grep -Eqi '^cache-control:[[:space:]]*no-store' "$headers"
          ! grep -Eqi '(postgres(ql)?://|password|service_role|private[[:space:]_-]*key|database_url)' "$body"

          CODE="$code" BODY="$body" python3 - <<'PY'
          import json, os
          code=int(os.environ['CODE'])
          with open(os.environ['BODY'], encoding='utf-8') as f:
              data=json.load(f)
          assert data.get('provider') == 'render', data
          assert data.get('portable_auth') == 'regional-es256-v2', data
          if code == 200:
              assert data.get('ok') is True, data
              assert data.get('configured') is True, data
              assert data.get('status') == 'available', data
              print('RENDER_STORAGE_READY=true')
          else:
              if data.get('ok') is False and data.get('configured') is False and data.get('status') == 'unconfigured':
                  print('RENDER_STORAGE_READY=false')
                  print('Render storage is intentionally unconfigured; provider must remain outside the storage quorum.')
              else:
                  raise AssertionError(f'configured Render provider is unhealthy or readiness contract drifted: {data!r}')
          PY

          code=$(curl -sS --connect-timeout 5 --max-time 15 -o "$body" -w '%{http_code}' \
            -X POST "$BASE/mirror" \
            -H 'Origin: https://miiduoa.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"action":"get_snapshot"}')
          echo "[unauthenticated] HTTP $code :: $(cat "$body")"
          test "$code" = '401'
          grep -q 'UNAUTHORIZED' "$body"

          now=$(date +%s)
          payload=$(printf '{"v":1,"sub":"11111111-1111-4111-8111-111111111111","cv":"test-version","role":"authenticated","iat":%s,"exp":%s,"iss":"nolu","aud":"nolu-provider-mesh","auth_domain":"mumbai"}' "$now" "$((now+240))" | base64 -w0 | tr '+/' '-_' | tr -d '=')

          retired_header=$(printf '%s' '{"alg":"ES256","typ":"NOLU","kid":"mesh-20260911-1"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          code=$(curl -sS --connect-timeout 5 --max-time 15 -o "$body" -w '%{http_code}' \
            -X POST "$BASE/mirror" \
            -H 'Origin: https://miiduoa.github.io' \
            -H "Authorization: Bearer ${retired_header}.${payload}.AA" \
            -H 'Content-Type: application/json' \
            --data '{"action":"get_snapshot"}')
          echo "[retired kid] HTTP $code :: $(cat "$body")"
          test "$code" = '401'
          grep -q 'UNAUTHORIZED' "$body"

          current_header=$(printf '%s' '{"alg":"ES256","typ":"NOLU","kid":"mesh-mumbai-20260911-5"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          code=$(curl -sS --connect-timeout 5 --max-time 15 -o "$body" -w '%{http_code}' \
            -X POST "$BASE/mirror" \
            -H 'Origin: https://miiduoa.github.io' \
            -H "Authorization: Bearer ${current_header}.${payload}.AA" \
            -H 'Content-Type: application/json' \
            --data '{"action":"get_snapshot"}')
          echo "[forged current kid] HTTP $code :: $(cat "$body")"
          test "$code" = '401'
          grep -q 'UNAUTHORIZED' "$body"

          code=$(curl -sS --connect-timeout 5 --max-time 15 -o "$body" -w '%{http_code}' \
            -X POST "$BASE/mirror" \
            -H 'Origin: https://evil.example' \
            -H 'Content-Type: application/json' \
            --data '{"action":"get_snapshot"}')
          echo "[evil POST origin] HTTP $code :: $(cat "$body")"
          test "$code" = '403'
          grep -q 'ORIGIN_NOT_ALLOWED' "$body"

          : >"$headers"
          code=$(curl -sS --connect-timeout 5 --max-time 15 -D "$headers" -o "$body" -w '%{http_code}' \
            -X OPTIONS "$BASE/mirror" \
            -H 'Origin: https://evil.example' \
            -H 'Access-Control-Request-Method: POST')
          echo "[evil preflight] HTTP $code :: $(cat "$body")"
          test "$code" = '403'
          ! grep -Eqi '^access-control-allow-origin:[[:space:]]*https://evil\.example' "$headers"

          code=$(curl -sS --connect-timeout 5 --max-time 15 -o "$body" -w '%{http_code}' "$BASE/mirror")
          echo "[method boundary] HTTP $code :: $(cat "$body")"
          test "$code" = '404'

          echo 'RENDER_LIVE_BOUNDARY_OK=true'
