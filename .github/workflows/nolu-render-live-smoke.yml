name: nolu Render mirror live smoke

on:
  push:
    branches: [main, test/nolu-render-live-20260911]
    paths:
      - 'services/nolu-render-mirror/**'
      - 'pu-plan/nolu-mesh-jwks.json'
      - '.github/workflows/nolu-render-live-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/nolu-render-mirror/**'
      - 'pu-plan/nolu-mesh-jwks.json'
      - '.github/workflows/nolu-render-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify Render readiness and auth boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://nolu-render-mirror.onrender.com'
          tmp=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$tmp" "$headers"' EXIT

          # A disabled candidate is allowed to report unconfigured, but it must do
          # so explicitly and without leaking connection material. When DATABASE_URL
          # is bound, this same probe automatically tightens to available/200.
          code='000'
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS --max-time 25 -D "$headers" -o "$tmp" -w '%{http_code}' "$BASE/health" || true)
            [ "$code" = 200 ] || [ "$code" = 503 ] && break
            sleep 4
          done
          echo "[health] HTTP $code :: $(cat "$tmp")"
          test "$code" = 200 -o "$code" = 503
          grep -q '"provider":"render"' "$tmp"
          grep -q '"portable_auth":"regional-es256-v2"' "$tmp"
          grep -qi '^cache-control: no-store' "$headers"
          ! grep -Eqi '(postgres(?:ql)?://|password|service_role|PRIVATE KEY)' "$tmp"
          if [ "$code" = 200 ]; then
            grep -q '"ok":true' "$tmp"
            grep -q '"configured":true' "$tmp"
            grep -q '"status":"available"' "$tmp"
            echo 'RENDER_STORAGE_READY=true'
          else
            grep -q '"ok":false' "$tmp"
            grep -q '"configured":false' "$tmp"
            grep -q '"status":"unconfigured"' "$tmp"
            echo '::warning::Render mirror storage is not bound yet; keep provider disabled.'
            echo 'RENDER_STORAGE_READY=false'
          fi

          code=$(curl -sS --max-time 15 -o "$tmp" -w '%{http_code}' -X POST "$BASE/mirror" -H 'Origin: https://miiduoa.github.io' -H 'Content-Type: application/json' --data '{"action":"get_snapshot"}')
          echo "[unauth] HTTP $code :: $(cat "$tmp")"
          test "$code" = 401
          grep -q 'UNAUTHORIZED' "$tmp"

          now=$(date +%s)
          payload=$(printf '{"v":1,"sub":"11111111-1111-4111-8111-111111111111","cv":"test-version","role":"authenticated","iat":%s,"exp":%s,"iss":"nolu","aud":"nolu-provider-mesh","auth_domain":"mumbai"}' "$now" "$((now+240))" | base64 -w0 | tr '+/' '-_' | tr -d '=')

          old_header=$(printf '%s' '{"alg":"ES256","typ":"NOLU","kid":"mesh-20260911-1"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          code=$(curl -sS --max-time 15 -o "$tmp" -w '%{http_code}' -X POST "$BASE/mirror" -H 'Origin: https://miiduoa.github.io' -H "Authorization: Bearer ${old_header}.${payload}.AA" -H 'Content-Type: application/json' --data '{"action":"get_snapshot"}')
          echo "[retired kid] HTTP $code :: $(cat "$tmp")"
          test "$code" = 401
          grep -q 'UNAUTHORIZED' "$tmp"

          current_header=$(printf '%s' '{"alg":"ES256","typ":"NOLU","kid":"mesh-mumbai-20260911-5"}' | base64 -w0 | tr '+/' '-_' | tr -d '=')
          code=$(curl -sS --max-time 15 -o "$tmp" -w '%{http_code}' -X POST "$BASE/mirror" -H 'Origin: https://miiduoa.github.io' -H "Authorization: Bearer ${current_header}.${payload}.AA" -H 'Content-Type: application/json' --data '{"action":"get_snapshot"}')
          echo "[forged current kid] HTTP $code :: $(cat "$tmp")"
          test "$code" = 401
          grep -q 'UNAUTHORIZED' "$tmp"

          code=$(curl -sS --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' -X OPTIONS "$BASE/mirror" -H 'Origin: https://evil.example' -H 'Access-Control-Request-Method: POST')
          echo "[evil origin] HTTP $code :: $(cat "$tmp")"
          test "$code" = 403
          ! grep -qi '^access-control-allow-origin: https://evil.example' "$headers"
          echo 'RENDER_LIVE_BOUNDARY_OK'
