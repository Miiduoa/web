name: nolu login patience smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/login-transport-patience.js'
      - 'pu-plan/login-failover-budget.js'
      - 'pu-plan/main.js'
      - 'pu-plan/index.html'
      - 'pu-plan/sw.js'
      - '.github/workflows/nolu-login-patience-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'pu-plan/login-transport-patience.js'
      - 'pu-plan/login-failover-budget.js'
      - 'pu-plan/main.js'
      - 'pu-plan/index.html'
      - 'pu-plan/sw.js'
      - '.github/workflows/nolu-login-patience-smoke.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - name: Verify bounded regional login patience
        run: |
          set -euo pipefail
          node --check pu-plan/login-transport-patience.js
          node --check pu-plan/login-failover-budget.js
          node --experimental-default-type=module --check pu-plan/main.js
          grep -Fq "hrrmkrayvrgnwcroyttp.supabase.co" pu-plan/login-transport-patience.js
          grep -Fq "ltfurqaspqsvswmebyzw.supabase.co" pu-plan/login-transport-patience.js
          grep -Fq "primaryLoginTimeoutMs:5000" pu-plan/login-transport-patience.js
          grep -Fq "standbyLoginTimeoutMs:6500" pu-plan/login-transport-patience.js
          grep -Fq "nolu-browser-gateway-v1" pu-plan/login-transport-patience.js
          grep -Fq "actionOf(options)!=='login'" pu-plan/login-transport-patience.js
          grep -Fq "const {signal:_ignored,...rest}=options||{}" pu-plan/login-transport-patience.js
          ! grep -Eq "password_hash|recovery_hash|service_role|PRIVATE KEY" pu-plan/login-transport-patience.js
          test "$(grep -o '<script' pu-plan/index.html | wc -l)" -eq 1
          grep -Fq "import './login-transport-patience.js';" pu-plan/main.js
          grep -Fq "await import('./login-failover-budget.js');" pu-plan/main.js
          grep -Fq "'./login-transport-patience.js'" pu-plan/sw.js
          grep -Fq "'./login-failover-budget.js'" pu-plan/sw.js
          node <<'NODE'
          const fs=require('node:fs');
          const patience=fs.readFileSync('pu-plan/login-transport-patience.js','utf8');
          const budget=fs.readFileSync('pu-plan/login-failover-budget.js','utf8');
          if((patience.match(/baseFetch\(/g)||[]).length<2)throw Error('patience wrapper must delegate ordinary and login traffic');
          if(/setInterval|while\s*\(/.test(patience))throw Error('login patience must not retry or loop');
          if(!budget.includes('OVERALL_LOGIN_TIMEOUT_MS=14000'))throw Error('missing bounded whole-login failover budget');
          console.log('NOLU_REGIONAL_LOGIN_PATIENCE_OK');
          NODE
