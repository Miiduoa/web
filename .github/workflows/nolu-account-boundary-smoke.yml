name: nolu account boundary smoke

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/account-boundary.js'
      - 'pu-plan/main.js'
      - 'pu-plan/sw.js'
      - '.github/workflows/nolu-account-boundary-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/account-boundary.js'
      - 'pu-plan/main.js'
      - 'pu-plan/sw.js'
      - '.github/workflows/nolu-account-boundary-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  account-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Verify guard is installed before app state
        run: |
          set -euo pipefail
          grep -q "await import('./account-boundary.js')" pu-plan/main.js
          grep -q "'./account-boundary.js'" pu-plan/sw.js
          python - <<'PY'
          from pathlib import Path
          s=Path('pu-plan/main.js').read_text()
          assert s.index("await import('./guest-privacy.js')") < s.index("await import('./account-boundary.js')") < s.index("await import('./durable-bridge.js')")
          PY

      - name: Account transitions cannot keep prior in-memory context
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const code=fs.readFileSync('pu-plan/account-boundary.js','utf8');

          class Target {
            constructor(){this.handlers=new Map()}
            addEventListener(type,fn){const a=this.handlers.get(type)||[];a.push(fn);this.handlers.set(type,a)}
            emit(type,event={}){for(const fn of this.handlers.get(type)||[])fn(event)}
          }
          function scenario(initialOwner,mutate,emit){
            const data=new Map();
            if(initialOwner)data.set('puplan_course_owner',initialOwner);
            const session=new Map();
            let reloads=0;
            const document=new Target(),window=new Target();
            const localStorage={getItem:k=>data.has(k)?data.get(k):null,setItem:(k,v)=>data.set(k,String(v)),removeItem:k=>data.delete(k)};
            const sessionStorage={getItem:k=>session.has(k)?session.get(k):null,setItem:(k,v)=>session.set(k,String(v)),removeItem:k=>session.delete(k)};
            const context=vm.createContext({document,window,localStorage,sessionStorage,location:{reload:()=>reloads++},Date,JSON});
            vm.runInContext(code,context,{filename:'account-boundary.js'});
            mutate(localStorage);
            emit({document,window});
            return {reloads,guard:window.NOLU_ACCOUNT_BOUNDARY};
          }

          let r=scenario('',s=>s.setItem('puplan_course_owner','A'),({document})=>document.emit('puplan:profile-changed'));
          if(r.reloads!==0)throw new Error('first sign-in must not reload');
          if(r.guard?.version!=='20260911-account-boundary1')throw new Error('guard version missing');

          r=scenario('A',s=>s.setItem('puplan_course_owner','B'),({document})=>document.emit('puplan:profile-changed'));
          if(r.reloads!==1)throw new Error('A -> B must hard reload');

          r=scenario('A',s=>s.removeItem('puplan_course_owner'),({document})=>document.emit('puplan:profile-changed'));
          if(r.reloads!==1)throw new Error('logout/guest transition must hard reload');

          r=scenario('A',s=>s.setItem('puplan_course_owner','B'),({window})=>window.emit('storage',{key:'puplan_course_owner'}));
          if(r.reloads!==1)throw new Error('cross-tab account switch must hard reload');
          NODE
