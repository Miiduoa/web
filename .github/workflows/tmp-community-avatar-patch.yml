name: temporary community avatar patch
on:
  push:
    branches: [security/nolu-avatar-rendering-20260910]
    paths: ['.github/workflows/tmp-community-avatar-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: security/nolu-avatar-rendering-20260910
      - name: Patch community avatar renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('pu-plan/community.js')
          s=p.read_text()
          imp="import {cleanAvatar} from './core/state.js';\n"
          if not s.startswith(imp): s=imp+s
          old="function avatar(p,cls='avatar'){\n  return p?.avatar_data?`<div class=\"${cls}\"><img src=\"${esc(p.avatar_data)}\" alt=\"\"></div>`:`<div class=\"${cls}\">${esc((p?.display_name||'?').slice(0,1))}</div>`;\n}"
          new="function avatar(p,cls='avatar'){\n  const src=cleanAvatar(p?.avatar_data||'');\n  return src?`<div class=\"${cls}\"><img src=\"${esc(src)}\" alt=\"\"></div>`:`<div class=\"${cls}\">${esc((p?.display_name||'?').slice(0,1))}</div>`;\n}"
          if old not in s and new not in s: raise SystemExit('community avatar target not found')
          p.write_text(s.replace(old,new))
          PY
          git diff --check
          node --check pu-plan/community.js
          git diff -- pu-plan/community.js
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pu-plan/community.js
          git commit -m 'security(nolu): sanitize community avatars'
          git push origin HEAD:security/nolu-avatar-rendering-20260910
