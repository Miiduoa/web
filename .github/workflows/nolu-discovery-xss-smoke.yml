name: nolu discovery xss smoke

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/discover.js'
      - 'pu-plan/core/state.js'
      - '.github/workflows/nolu-discovery-xss-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/discover.js'
      - 'pu-plan/core/state.js'
      - '.github/workflows/nolu-discovery-xss-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-xss:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Source guardrails
        run: |
          set -euo pipefail
          node --check pu-plan/discover.js
          python3 - <<'PY'
          from pathlib import Path
          import re

          src=Path('pu-plan/discover.js').read_text()
          core_imports=re.findall(r"import\s*\{([^}]*)\}\s*from\s*['\"]\./core/state\.js['\"]\s*;",src)
          imported={name.strip().split(' as ')[-1].strip() for group in core_imports for name in group.split(',')}
          assert 'cleanAvatar' in imported, 'discover.js must import cleanAvatar from core/state.js'
          assert re.search(r"cleanAvatar\s*\(\s*p\?\.avatar_data\s*\|\|\s*['\"]['\"]\s*\)",src), 'profile avatar must pass through cleanAvatar'
          assert re.search(r"<img\s+src=\\?['\"]?\$\{esc\(src\)\}",src), 'sanitized avatar source must be escaped before HTML rendering'
          assert "p?.avatar_data?`<img" not in src, 'raw avatar_data must never choose an image path directly'
          print('discovery rendering guardrails: ok')
          PY
      - name: Avatar allowlist rejects executable payloads
        run: |
          node --input-type=module <<'NODE'
          import {cleanAvatar} from './pu-plan/core/state.js';
          const bad=[
            'javascript:alert(1)',
            'x" onerror="globalThis.__NOLU_DISCOVERY_XSS__=1',
            'data:text/html;base64,PHNjcmlwdD5hbGVydCgxKTwvc2NyaXB0Pg==',
            'data:image/svg+xml,<svg onload=alert(1)>',
            'data:image/svg+xml;base64,PHN2ZyBvbmxvYWQ9YWxlcnQoMSk+',
            'https://evil.example/avatar.png'
          ];
          for(const value of bad){
            if(cleanAvatar(value)!=='')throw new Error(`unsafe discovery avatar accepted: ${value}`);
          }
          const good='data:image/png;base64,iVBORw0KGgo=';
          if(cleanAvatar(good)!==good)throw new Error('valid PNG avatar rejected');
          console.log('discovery avatar allowlist: ok');
          NODE
