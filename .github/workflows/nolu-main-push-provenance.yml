name: nolu main push provenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/nolu-main-push-provenance.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify provenance alarm contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.github/workflows/nolu-main-push-provenance.yml').read_text()
          required=[
            "if: github.event_name == 'push'",
            'pull-requests: read',
            '/commits/${SHA}/pulls',
            "pr.get('merged_at')",
            "pr.get('merge_commit_sha')==sha",
            "pr.get('base',{}).get('ref')=='main'",
            'DIRECT_MAIN_PUSH_DETECTED',
          ]
          missing=[x for x in required if x not in s]
          assert not missing, f'missing main-push provenance guardrails: {missing}'
          print('NOLU_MAIN_PUSH_PROVENANCE_CONTRACT_OK')
          PY

  main-push-provenance:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require main commit to be a merged PR result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}/commits/${SHA}/pulls"
          body=/tmp/nolu-associated-prs.json
          code='000'

          for attempt in 1 2 3 4; do
            code=$(curl -sS --connect-timeout 5 --max-time 10 \
              -o "$body" -w '%{http_code}' \
              "$api" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28')
            echo "associated PR lookup attempt $attempt: HTTP $code"

            if [ "$code" = '200' ] && python3 - "$SHA" "$body" <<'PY'
          import json,sys
          sha,path=sys.argv[1],sys.argv[2]
          with open(path,encoding='utf-8') as fh:
              prs=json.load(fh)
          matches=[pr for pr in prs if pr.get('merged_at') and pr.get('merge_commit_sha')==sha and pr.get('base',{}).get('ref')=='main']
          if not matches:
              raise SystemExit(1)
          print('MAIN_PUSH_FROM_MERGED_PR', ','.join(f"#{pr.get('number')}" for pr in matches))
          PY
            then
              exit 0
            fi

            [ "$attempt" -lt 4 ] && sleep "$attempt"
          done

          if [ "$code" != '200' ]; then
            echo "::error::MAIN_PUSH_PROVENANCE_API_UNAVAILABLE HTTP=$code"
            cat "$body" 2>/dev/null || true
            exit 1
          fi

          echo "::error::DIRECT_MAIN_PUSH_DETECTED ${SHA} is not the merge commit of a merged PR targeting main"
          cat "$body" 2>/dev/null || true
          exit 1
