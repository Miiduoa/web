name: nolu hot standby smoke

on:
  push:
    branches: [main, fix/nolu-retired-ha-endpoint-compat]
    paths:
      - 'pu-plan/resilience.js'
      - 'pu-plan/transport-bridge.js'
      - 'pu-plan/main.js'
      - 'pu-plan/index.html'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - '.github/workflows/nolu-hot-standby-smoke.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  retired-ha-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6

      - name: Syntax and retirement wiring check
        run: |
          set -euo pipefail
          node --check pu-plan/resilience.js
          node --check pu-plan/transport-bridge.js
          node --check pu-plan/main.js
          node --check pu-plan/sw.js
          node --check pu-plan/pwa.js
          ! grep -q "import('./cloud-replication.js')" pu-plan/main.js
          ! grep -q "'./cloud-replication.js'" pu-plan/sw.js
          grep -q "RETIRED_PRIMARY" pu-plan/resilience.js
          grep -q "RETIRED_STANDBY" pu-plan/resilience.js

      - name: Install Playwright
        run: |
          npm --prefix /tmp/nolu-ha init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-ha install playwright >/dev/null 2>&1
          cd /tmp/nolu-ha && npx playwright install --with-deps chromium >/dev/null

      - name: Verify cached v7 requests bypass retired endpoints
        env:
          NODE_PATH: /tmp/nolu-ha/node_modules
        run: |
          cat >pu-plan/__retired_ha_test.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body><div id="cloudState"></div><script type="module">import './transport-bridge.js';import './resilience.js';</script></body>
          HTML
          python3 -m http.server 4173 --directory pu-plan >/tmp/nolu-ha-http.log 2>&1 &
          cat >/tmp/nolu-ha/test.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const MUMBAI='hrrmkrayvrgnwcroyttp',TOKYO='ltfurqaspqsvswmebyzw';
          const V7=`https://${MUMBAI}.supabase.co/functions/v1/pu-plan-api-v7`;
          const TOKYO_V7=`https://${TOKYO}.supabase.co/functions/v1/pu-plan-api-v7`;
          const V6=`https://${MUMBAI}.supabase.co/functions/v1/pu-plan-api-v6`;
          const CORE=`https://${MUMBAI}.supabase.co/functions/v1/pu-plan-core-v1`;
          const LEGACY=`https://${MUMBAI}.supabase.co/functions/v1/pu-plan-api`;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext();
              const attempts=[];
              let mode='v6-ok';
              await context.route('https://*.supabase.co/functions/v1/**',async route=>{
                const url=route.request().url();attempts.push(url);
                if(url===V7||url===TOKYO_V7)return route.fulfill({status:410,contentType:'application/json',body:'{"error":"DISABLED"}'});
                if(url===V6){
                  if(mode==='v6-ok')return route.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"via":"v6"}'});
                  return route.fulfill({status:503,contentType:'application/json',body:'{"message":"v6 down"}'});
                }
                if(url===CORE)return route.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"via":"core"}'});
                if(url===LEGACY)return route.fulfill({status:200,contentType:'application/json',body:'{"ok":true,"via":"legacy"}'});
                return route.abort();
              });
              const page=await context.newPage();
              await page.goto('http://127.0.0.1:4173/__retired_ha_test.html');
              await page.waitForFunction(()=>window.NOLU_RESILIENCE&&window.NOLU_TRANSPORT);

              attempts.length=0;
              const oldCached=await page.evaluate(async V7=>{const r=await fetch(V7,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',email:'x@example.com',password:'not-used'})});return {status:r.status,data:await r.json()}},V7);
              assert(oldCached.status===200&&oldCached.data.via==='v6','cached v7 request did not transparently use v6');
              assert(attempts.includes(V6),'v6 was not attempted for cached v7 request');
              assert(!attempts.includes(V7)&&!attempts.includes(TOKYO_V7),'retired v7 endpoint was contacted');

              mode='v6-down';attempts.length=0;
              const legacyResult=await page.evaluate(async LEGACY=>{const r=await fetch(LEGACY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'semesters'})});return {status:r.status,data:await r.json(),candidates:window.NOLU_TRANSPORT.candidates}},LEGACY);
              assert(legacyResult.status===200&&legacyResult.data.via==='core','legacy failover did not reach core after v6 failure');
              assert(legacyResult.candidates.length===3,'legacy transport still contains retired HA candidates');
              assert(legacyResult.candidates.every(x=>!x.includes('/pu-plan-api-v7')),'v7 remained in transport candidate list');
              assert(attempts.includes(V6)&&attempts.includes(CORE),'legacy failover did not try v6 then core');
              assert(!attempts.includes(V7)&&!attempts.includes(TOKYO_V7),'legacy path contacted a retired v7 endpoint');
              console.log('RETIRED_HA_COMPAT_OK',attempts);
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 75s node /tmp/nolu-ha/test.cjs
          rm -f pu-plan/__retired_ha_test.html
