name: nolu hot standby smoke

on:
  push:
    branches: [main, feat/nolu-replica-v3-client-final-20260911]
    paths:
      - 'pu-plan/resilience.js'
      - 'pu-plan/transport-bridge.js'
      - 'pu-plan/cloud-replication.js'
      - '.github/workflows/nolu-hot-standby-smoke.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hot-standby:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - name: Routing invariants
        run: |
          set -euo pipefail
          node --check pu-plan/resilience.js
          node --check pu-plan/transport-bridge.js
          node --check pu-plan/cloud-replication.js
          grep -q 'pu-plan-api-v8' pu-plan/resilience.js
          grep -q 'pu-plan-api-v8' pu-plan/transport-bridge.js
          ! grep -q 'pu-plan-api-v7' pu-plan/resilience.js
          ! grep -q 'pu-plan-api-v7' pu-plan/transport-bridge.js
          ! grep -q 'pu-plan-sync-v1' pu-plan/cloud-replication.js
          ! grep -q 'pu-plan-replica-v2' pu-plan/cloud-replication.js
          grep -q 'pu-plan-replica-v3' pu-plan/cloud-replication.js
          grep -q 'manualReconcileRequired' pu-plan/cloud-replication.js
          grep -q 'puplan_session_primary_v1' pu-plan/cloud-replication.js
          grep -q 'puplan_session_standby_v1' pu-plan/cloud-replication.js

      - name: Install Playwright
        run: |
          npm --prefix /tmp/nolu-ha init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-ha install playwright >/dev/null 2>&1
          cd /tmp/nolu-ha && npx playwright install --with-deps chromium >/dev/null

      - name: Verify primary seed and standby fail-closed behavior
        env:
          NODE_PATH: /tmp/nolu-ha/node_modules
        run: |
          set -euo pipefail
          printf '%s\n' '<!doctype html><meta charset="utf-8"><body>ha</body>' > pu-plan/__ha_v3.html
          python3 -m http.server 4173 --directory pu-plan >/tmp/nolu-ha-http.log 2>&1 &
          cat >/tmp/nolu-ha/test.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const b64=s=>Buffer.from(s).toString('base64url');
          const uid='55555555-5555-4555-8555-555555555555';
          const now=Math.floor(Date.now()/1000);
          const token=n=>`${b64(JSON.stringify({v:4,uid,iat:now,exp:now+3600,cv:'ci-v3'}))}.${b64('sig-'+n)}`;
          const primary=token('primary'),standby=token('standby');
          const A='hrrmkrayvrgnwcroyttp',B='ltfurqaspqsvswmebyzw';
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const c1=await browser.newContext({serviceWorkers:'block'});
              const p1=await c1.newPage();
              let primaryCalls=0,lastAuth='';
              await p1.route(`https://${A}.supabase.co/functions/v1/pu-plan-replica-v3`,route=>{
                primaryCalls++;lastAuth=route.request().headers()['authorization']||'';
                return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,peer_synced:true,peer_ref:B,peer_token:standby})});
              });
              await p1.goto('http://127.0.0.1:4173/__ha_v3.html');
              await p1.evaluate(({A,primary})=>{
                localStorage.clear();sessionStorage.clear();
                localStorage.setItem('puplan_session',primary);
                localStorage.setItem('puplan_session_primary_v1',primary);
                window.NOLU_RESILIENCE={state:{activeApi:`https://${A}.supabase.co/functions/v1/pu-plan-api-v8`},preferredCloud:()=> 'primary'};
                window.PUPLAN_CLOUD={isSignedIn:()=>true};
              },{A,primary});
              await p1.evaluate(async()=>{await import('./cloud-replication.js?primary-ci')});
              const seeded=await p1.evaluate(()=>NOLU_REPLICATION.sync('ci-primary',true));
              const s1=await p1.evaluate(()=>({canonical:localStorage.getItem('puplan_session'),primary:localStorage.getItem('puplan_session_primary_v1'),standby:localStorage.getItem('puplan_session_standby_v1'),ready:NOLU_REPLICATION.state.peerSessionReady}));
              assert(seeded===true,'primary seed failed');
              assert(primaryCalls>=1,'replica-v3 primary endpoint was not called');
              assert(lastAuth===`Bearer ${primary}`,'replica-v3 did not use the Mumbai-local session');
              assert(s1.canonical===primary&&s1.primary===primary,'primary identity changed during seed');
              assert(s1.standby===standby&&s1.ready===true,'Tokyo-local session was not prewarmed');
              await c1.close();

              const c2=await browser.newContext({serviceWorkers:'block'});
              const p2=await c2.newPage();
              let networkCalls=0;
              await p2.route('https://*.supabase.co/functions/v1/pu-plan-replica-v3',route=>{networkCalls++;return route.abort()});
              await p2.goto('http://127.0.0.1:4173/__ha_v3.html');
              await p2.evaluate(({B,primary,standby})=>{
                localStorage.clear();sessionStorage.clear();
                localStorage.setItem('puplan_session',standby);
                localStorage.setItem('puplan_session_primary_v1',primary);
                localStorage.setItem('puplan_session_standby_v1',standby);
                localStorage.setItem('nolu_preferred_cloud_v1','standby');
                window.NOLU_RESILIENCE={state:{activeApi:`https://${B}.supabase.co/functions/v1/pu-plan-api-v8`},preferredCloud:()=> 'standby'};
                window.PUPLAN_CLOUD={isSignedIn:()=>true};
              },{B,primary,standby});
              await p2.evaluate(async()=>{await import('./cloud-replication.js?standby-ci')});
              await p2.evaluate(()=>NOLU_REPLICATION.markStandbyDirty());
              const synced=await p2.evaluate(()=>NOLU_REPLICATION.sync('ci-standby',true));
              const s2=await p2.evaluate(()=>({canonical:localStorage.getItem('puplan_session'),primary:localStorage.getItem('puplan_session_primary_v1'),standby:localStorage.getItem('puplan_session_standby_v1'),dirty:NOLU_REPLICATION.hasStandbyDirty(),manual:NOLU_REPLICATION.state.manualReconcileRequired}));
              assert(synced===false,'standby auto-failback must be blocked');
              assert(networkCalls===0,'standby unexpectedly contacted replica-v3');
              assert(s2.dirty===true&&s2.manual===true,'standby writes were not held for reconciliation');
              assert(s2.canonical===standby&&s2.primary===primary&&s2.standby===standby,'regional sessions changed during blocked failback');
              await c2.close();
              console.log('HOT_STANDBY_REPLICA_V3_OK');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 80s node /tmp/nolu-ha/test.cjs
          rm -f pu-plan/__ha_v3.html
