name: nolu hot standby smoke

on:
  push:
    branches: [main, feat/nolu-hot-standby-v1]
    paths:
      - 'pu-plan/resilience.js'
      - 'pu-plan/transport-bridge.js'
      - 'pu-plan/cloud-replication.js'
      - 'pu-plan/main.js'
      - 'pu-plan/auth.js'
      - 'pu-plan/index.html'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - '.github/workflows/nolu-hot-standby-smoke.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hot-standby:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Syntax check
        run: |
          node --check pu-plan/resilience.js
          node --check pu-plan/transport-bridge.js
          node --check pu-plan/cloud-replication.js
          node --check pu-plan/main.js
          node --check pu-plan/auth.js
          node --check pu-plan/sw.js
          node --check pu-plan/pwa.js

      - name: Install Playwright
        run: |
          npm --prefix /tmp/nolu-ha init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-ha install playwright >/dev/null 2>&1
          cd /tmp/nolu-ha && npx playwright install --with-deps chromium >/dev/null

      - name: Verify Tokyo v8 failover, regional credentials, auth preservation, and replica-v2 failback
        env:
          NODE_PATH: /tmp/nolu-ha/node_modules
        run: |
          cat >pu-plan/__hot_standby_test.html <<'HTML'
          <!doctype html><meta charset="utf-8"><body><div id="cloudState"></div><script type="module">import './transport-bridge.js';import './resilience.js';</script></body>
          HTML
          python3 -m http.server 4173 --directory pu-plan >/tmp/nolu-ha-http.log 2>&1 &
          cat >/tmp/nolu-ha/test.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const b64=s=>Buffer.from(s).toString('base64url');
          const uid='55555555-5555-4555-8555-555555555555';
          const issuedAt=Math.floor(Date.now()/1000);
          const token=(nonce)=>`${b64(JSON.stringify({v:4,uid,iat:issuedAt,exp:issuedAt+3600,cv:'cv-test'}))}.${b64('sig-'+nonce)}`;
          const PRIMARY=token('primary');
          const STANDBY=token('standby');
          const STANDBY_ROTATED=token('standby-rotated');
          const PRIMARY_PEER=token('primary-peer');
          const PORTABLE_SENTINEL='portable-must-remain-separate';
          const A='hrrmkrayvrgnwcroyttp',B='ltfurqaspqsvswmebyzw';
          const PRIMARY_V8=`https://${A}.supabase.co/functions/v1/pu-plan-api-v8`;
          const STANDBY_V8=`https://${B}.supabase.co/functions/v1/pu-plan-api-v8`;
          const STANDBY_REPLICA=`https://${B}.supabase.co/functions/v1/pu-plan-replica-v2`;
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext({serviceWorkers:'block'});
              const counts={a8:0,aCompat:0,b8:0,bReplica:0};
              const wrongRegionAuth=[];
              let standbyMode='ok',lastStandbyAuth='',lastReplicaAuth='';
              await context.route('https://*.supabase.co/functions/v1/**',async route=>{
                const req=route.request(),url=new URL(req.url()),path=url.pathname;
                const auth=req.headers()['authorization']||'';
                if(url.host.startsWith(A)&&(auth===`Bearer ${STANDBY}`||auth===`Bearer ${STANDBY_ROTATED}`))wrongRegionAuth.push({host:'Mumbai',auth,path});
                if(url.host.startsWith(B)&&auth===`Bearer ${PRIMARY}`)wrongRegionAuth.push({host:'Tokyo',auth,path});
                if(url.host.startsWith(A)){
                  if(path.endsWith('/pu-plan-api-v8'))counts.a8++;else counts.aCompat++;
                  return route.abort('timedout');
                }
                if(url.host.startsWith(B)&&path.endsWith('/pu-plan-replica-v2')){
                  counts.bReplica++;lastReplicaAuth=auth;
                  return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({ok:true,peer_synced:true,peer_token:PRIMARY_PEER,peer_ref:A})});
                }
                if(url.host.startsWith(B)&&path.endsWith('/pu-plan-api-v8')){
                  counts.b8++;lastStandbyAuth=auth;
                  if(standbyMode==='unauthorized')return route.fulfill({status:401,contentType:'application/json',body:JSON.stringify({error:'UNAUTHORIZED',message:'standby rejected session'})});
                  return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({token:STANDBY_ROTATED,profile:{id:uid,display_name:'Tokyo User',username:'tokyo_user',avatar_data:'',bio:'',discoverable:true},courses:[{id:'ha',name:'Tokyo course',day:1,start:1,end:1,teacher:'',room:'T1',color:'blue'}],semesters:[],active_semester:null,social:{relationships:[],profiles:[],friends:[],meetups:[],deferred:true}})});
                }
                return route.abort();
              });

              const page=await context.newPage();
              await page.goto('http://127.0.0.1:4173/__hot_standby_test.html');
              await page.evaluate(({uid,PRIMARY,STANDBY,PORTABLE_SENTINEL})=>{
                localStorage.clear();sessionStorage.clear();
                localStorage.setItem('puplan_session',PRIMARY);
                localStorage.setItem('puplan_standby_session_v2',STANDBY);
                localStorage.setItem('puplan_portable_session_v1',PORTABLE_SENTINEL);
                localStorage.setItem('puplan_course_owner',uid);
                localStorage.setItem('puplan_name','Cached User');
                localStorage.setItem('puplan_username','cached_user');
                localStorage.setItem('puplan_courses',JSON.stringify([{id:'local',name:'Local course',day:2,start:2,end:2,teacher:'',room:'L1',color:'gray'}]));
              },{uid,PRIMARY,STANDBY,PORTABLE_SENTINEL});
              await page.reload({waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.NOLU_RESILIENCE&&window.NOLU_TRANSPORT);

              const requested=`https://${A}.supabase.co/functions/v1/pu-plan-api-v6`;
              const authHeaders={'Content-Type':'application/json','Authorization':`Bearer ${PRIMARY}`};
              const first=await page.evaluate(async({url,headers})=>{
                const r=await fetch(url,{method:'POST',headers,body:JSON.stringify({action:'bootstrap'})});
                return {status:r.status,data:await r.json(),active:NOLU_RESILIENCE.state.activeApi,preferred:NOLU_RESILIENCE.preferredCloud(),primary:localStorage.getItem('puplan_session'),standby:localStorage.getItem('puplan_standby_session_v2'),portable:localStorage.getItem('puplan_portable_session_v1')};
              },{url:requested,headers:authHeaders});
              console.log('FIRST_FAILOVER',first,counts);
              assert(first.status===200,'standby bootstrap failed');
              assert(first.active===STANDBY_V8,'Tokyo v8 was not selected as active cloud');
              assert(first.preferred==='standby','standby preference was not persisted');
              assert(first.primary===PRIMARY,'standby bootstrap overwrote the Mumbai session token');
              assert(first.standby===STANDBY_ROTATED,'Tokyo token rotation was not stored in the standby slot');
              assert(first.portable===PORTABLE_SENTINEL,'regional failover polluted the portable session slot');
              assert(counts.a8>=1&&counts.b8>=1,'first request did not try Mumbai v8 then Tokyo v8');
              assert(lastStandbyAuth===`Bearer ${STANDBY}`,'initial Tokyo request did not use the Tokyo regional session');
              assert(wrongRegionAuth.length===0,`regional credential crossed providers: ${JSON.stringify(wrongRegionAuth)}`);

              const aBefore=counts.a8+counts.aCompat,bBefore=counts.b8;
              const second=await page.evaluate(async url=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer stale-is-replaced'},body:JSON.stringify({action:'bootstrap'})});return r.status},requested);
              assert(second===200,'preferred Tokyo request failed');
              assert(counts.b8===bBefore+1,'second request did not go to Tokyo first');
              assert(counts.a8+counts.aCompat===aBefore,'second request unnecessarily hammered Mumbai');
              assert(lastStandbyAuth===`Bearer ${STANDBY_ROTATED}`,'Tokyo request did not use the rotated Tokyo session');
              assert(wrongRegionAuth.length===0,`regional credential crossed providers after rotation: ${JSON.stringify(wrongRegionAuth)}`);

              const bBeforeSignup=counts.b8;
              await page.evaluate(async url=>{try{await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'signup',display_name:'x',username:'xx',email:'x@example.com',password:'12345678'})})}catch{}},requested);
              assert(counts.b8===bBeforeSignup,'signup was incorrectly allowed to fail over to standby');

              standbyMode='unauthorized';
              const beforeProtected=await page.evaluate(()=>({primary:localStorage.getItem('puplan_session'),standby:localStorage.getItem('puplan_standby_session_v2'),portable:localStorage.getItem('puplan_portable_session_v1')}));
              const protectedResult=await page.evaluate(async url=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer stale-is-replaced'},body:JSON.stringify({action:'bootstrap'})});return {status:r.status,data:await r.json(),primary:localStorage.getItem('puplan_session'),standby:localStorage.getItem('puplan_standby_session_v2'),portable:localStorage.getItem('puplan_portable_session_v1')}},requested);
              assert(protectedResult.status===200&&protectedResult.data.offline===true,'standby 401 did not safely degrade to local offline bootstrap');
              assert(protectedResult.primary===beforeProtected.primary&&protectedResult.standby===beforeProtected.standby,'uncertain standby auth changed regional sessions');
              assert(protectedResult.portable===PORTABLE_SENTINEL,'uncertain standby auth changed portable session');

              standbyMode='ok';
              await page.evaluate(async()=>{window.PUPLAN_CLOUD={isSignedIn:()=>true};await import('./cloud-replication.js?ci=regional-v8')});
              const synced=await page.evaluate(()=>window.NOLU_REPLICATION.sync('ci',true));
              const finalState=await page.evaluate(()=>({primary:localStorage.getItem('puplan_session'),standby:localStorage.getItem('puplan_standby_session_v2'),portable:localStorage.getItem('puplan_portable_session_v1'),preferred:localStorage.getItem('nolu_preferred_cloud_v1')}));
              console.log('REPLICA_V2_FAILBACK',synced,finalState,counts);
              assert(synced===true,'standby -> primary replica-v2 reconciliation did not report success');
              assert(counts.bReplica>=1,'reconciliation did not use the Tokyo replica-v2 endpoint');
              assert(lastReplicaAuth===`Bearer ${STANDBY_ROTATED}`,'replica-v2 did not use the Tokyo regional session');
              assert(finalState.primary===PRIMARY_PEER,'replica-v2 peer credential was not stored as the Mumbai session');
              assert(finalState.standby===STANDBY_ROTATED,'replica-v2 overwrote the Tokyo session');
              assert(finalState.portable===PORTABLE_SENTINEL,'replica-v2 touched the provider-mesh portable session');
              assert(finalState.preferred==='primary','client did not permit primary failback after successful replica-v2 sync');
              assert(wrongRegionAuth.length===0,`regional credential crossed providers during failback: ${JSON.stringify(wrongRegionAuth)}`);
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 90s node /tmp/nolu-ha/test.cjs
          rm -f pu-plan/__hot_standby_test.html
