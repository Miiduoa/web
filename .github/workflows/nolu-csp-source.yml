name: Put CSP in Nolu source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nolu-csp-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Add source-owned security policy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('pu-plan/index.html')
          s=p.read_text(encoding='utf-8')
          if 'Content-Security-Policy' not in s:
              policy='''<meta name="referrer" content="strict-origin-when-cross-origin">\n<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://hrrmkrayvrgnwcroyttp.supabase.co; media-src 'self' blob: https://hrrmkrayvrgnwcroyttp.supabase.co; connect-src 'self' https://hrrmkrayvrgnwcroyttp.supabase.co https://cdn.jsdelivr.net https://raw.githubusercontent.com https://tessdata.projectnaptha.com; worker-src 'self' blob: https://cdn.jsdelivr.net; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; upgrade-insecure-requests">'''
              s=s.replace('<meta name="theme-color" content="#151515" />', '<meta name="theme-color" content="#151515" />\n'+policy)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q "Content-Security-Policy" pu-plan/index.html
          grep -q "object-src 'none'" pu-plan/index.html
          git rm -f .github/workflows/nolu-csp-source.yml
      - name: Commit
        run: |
          git config user.name "Miiduoa"
          git config user.email "107848266+Miiduoa@users.noreply.github.com"
          git add -A
          git commit -m "Keep Nolu CSP in the production source"
          git push origin HEAD:main
