name: nolu public shell live smoke

on:
  push:
    branches: [main, test/nolu-public-live-20260911]
    paths:
      - 'pu-plan/index.html'
      - 'pu-plan/main.js'
      - 'pu-plan/auth-trace.js'
      - 'pu-plan/origin-gateway.js'
      - 'pu-plan/media-failback-guard.js'
      - 'pu-plan/login-failover-budget.js'
      - 'pu-plan/login-transport-patience.js'
      - 'pu-plan/provider-config.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - '.github/workflows/nolu-public-shell-live-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/index.html'
      - 'pu-plan/main.js'
      - 'pu-plan/auth-trace.js'
      - 'pu-plan/origin-gateway.js'
      - 'pu-plan/media-failback-guard.js'
      - 'pu-plan/login-failover-budget.js'
      - 'pu-plan/login-transport-patience.js'
      - 'pu-plan/provider-config.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - '.github/workflows/nolu-public-shell-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Verify source shell contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '20260912-gate-stability7' pu-plan/index.html
          grep -q "nolu-shell-20260912-gate-stability7" pu-plan/sw.js
          grep -q "nolu_shell_reload_20260912_gate_stability7" pu-plan/pwa.js
          grep -q "./auth-trace.js" pu-plan/sw.js
          grep -q "import './auth-trace.js'" pu-plan/main.js
          grep -q "./origin-gateway.js" pu-plan/sw.js
          grep -q "./media-failback-guard.js" pu-plan/sw.js
          grep -q "./login-failover-budget.js" pu-plan/sw.js
          grep -q "import './origin-gateway.js'" pu-plan/main.js
          grep -q "import './media-failback-guard.js'" pu-plan/origin-gateway.js
          grep -q "await import('./login-failover-budget.js')" pu-plan/main.js
          grep -q "OVERALL_LOGIN_TIMEOUT_MS=14000" pu-plan/login-failover-budget.js
          grep -q "standbyLoginTimeoutMs:6500" pu-plan/login-transport-patience.js
          grep -q "deadlineAware:true" pu-plan/login-transport-patience.js

      - name: Verify deployed GitHub Pages shell
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://miiduoa.github.io/web'
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          ready=0
          for attempt in $(seq 1 24); do
            ok=1
            curl -fsS --max-time 15 "$BASE/sw.js?shell=20260912gatestability7" -o "$tmp/sw.js" || ok=0
            curl -fsS --max-time 15 "$BASE/?shell=20260912gatestability7" -o "$tmp/index.html" || ok=0
            curl -fsS --max-time 15 "$BASE/auth-trace.js?shell=20260912gatestability7" -o "$tmp/auth-trace.js" || ok=0
            curl -fsS --max-time 15 "$BASE/login-transport-patience.js?shell=20260912gatestability7" -o "$tmp/login-patience.js" || ok=0
            curl -fsS --max-time 15 "$BASE/pwa.js?shell=20260912gatestability7" -o "$tmp/pwa.js" || ok=0
            if [ "$ok" = 1 ] \
              && grep -q 'nolu-shell-20260912-gate-stability7' "$tmp/sw.js" \
              && grep -q '20260912-gate-stability7' "$tmp/index.html" \
              && grep -q '20260912-auth-trace1' "$tmp/auth-trace.js" \
              && grep -q 'deadlineAware:true' "$tmp/login-patience.js" \
              && grep -q 'nolu_shell_reload_20260912_gate_stability7' "$tmp/pwa.js"; then
              ready=1
              break
            fi
            echo "Pages shell not coherent yet (attempt $attempt/24); waiting..."
            sleep 5
          done
          test "$ready" = 1

          grep -q 'https://nolu-mirror.netlify.app' "$tmp/index.html"
          grep -q "object-src 'none'" "$tmp/index.html"
          grep -q "frame-src 'none'" "$tmp/index.html"

          curl -fsS --retry 4 --retry-delay 2 --max-time 15 "$BASE/main.js?shell=20260912gatestability7" -o "$tmp/main.js"
          grep -q "import './auth-trace.js'" "$tmp/main.js"
          grep -q "import './origin-gateway.js'" "$tmp/main.js"
          grep -q "await import('./login-failover-budget.js')" "$tmp/main.js"
          curl -fsS --retry 4 --retry-delay 2 --max-time 15 "$BASE/origin-gateway.js?shell=20260912gatestability7" -o "$tmp/origin-gateway.js"
          grep -q 'nolu-browser-gateway-v1' "$tmp/origin-gateway.js"
          grep -q "import './media-failback-guard.js'" "$tmp/origin-gateway.js"
          curl -fsS --retry 4 --retry-delay 2 --max-time 15 "$BASE/media-failback-guard.js?shell=20260912gatestability7" -o "$tmp/media-failback-guard.js"
          grep -q 'pu-plan-media-failback-v1' "$tmp/media-failback-guard.js"
          curl -fsS --retry 4 --retry-delay 2 --max-time 15 "$BASE/login-failover-budget.js?shell=20260912gatestability7" -o "$tmp/login-budget.js"
          grep -q 'OVERALL_LOGIN_TIMEOUT_MS=14000' "$tmp/login-budget.js"
          grep -q 'standbyLoginTimeoutMs:6500' "$tmp/login-patience.js"

          curl -fsS --retry 4 --retry-delay 2 --max-time 15 "$BASE/provider-config.js?shell=20260912gatestability7" -o "$tmp/provider-config.js"
          grep -q "PROVIDER_MESH_VERSION='20260911-mesh5'" "$tmp/provider-config.js"
          grep -q 'pu-plan-portable-v2' "$tmp/provider-config.js"
          ! grep -q 'pu-plan-portable-v1' "$tmp/provider-config.js"
          grep -q "provider:'netlify'" "$tmp/provider-config.js"
          grep -q "enabled:true" "$tmp/provider-config.js"

          grep -q "./auth-trace.js" "$tmp/sw.js"
          grep -q "./origin-gateway.js" "$tmp/sw.js"
          grep -q "./media-failback-guard.js" "$tmp/sw.js"
          grep -q "./login-failover-budget.js" "$tmp/sw.js"
          grep -q "outage-mirror-bridge.js" "$tmp/sw.js"
          echo 'PUBLIC_SHELL_LIVE_OK'

      - name: Verify Netlify mirror public boundary
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nolu-mirror.netlify.app'
          tmp=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$tmp" "$headers"' EXIT
          code=$(curl -sS --retry 3 --retry-delay 2 --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' "$URL/health")
          echo "[health] HTTP $code :: $(cat "$tmp")"
          test "$code" = 200
          grep -q '"provider":"netlify"' "$tmp"
          grep -q '"status":"available"' "$tmp"
          grep -qi '^cache-control: no-store' "$headers"
          check_cors() {
            local origin="$1"
            : > "$headers"
            code=$(curl -sS --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' -X OPTIONS "$URL/mirror" -H "Origin: ${origin}" -H 'Access-Control-Request-Method: POST')
            echo "[mirror cors][$origin] HTTP $code"
            test "$code" = 204
            tr -d '\r' < "$headers" | grep -Fqi "access-control-allow-origin: ${origin}"
          }
          check_cors 'https://miiduoa.github.io'
          if getent hosts nolu.tw >/dev/null 2>&1; then check_cors 'https://nolu.tw'; else echo '[mirror][https://nolu.tw] inactive DNS; live CORS check skipped'; fi
          if getent hosts nolu-8r2.pages.dev >/dev/null 2>&1; then check_cors 'https://nolu-8r2.pages.dev'; else echo '[mirror][https://nolu-8r2.pages.dev] inactive DNS; live CORS check skipped'; fi
          code=$(curl -sS --max-time 15 -o "$tmp" -w '%{http_code}' -X POST "$URL/mirror" -H 'Origin: https://miiduoa.github.io' -H 'Content-Type: application/json' --data '{"action":"get_snapshot"}')
          echo "[unauth] HTTP $code :: $(cat "$tmp")"
          test "$code" = 401
          grep -q 'UNAUTHORIZED' "$tmp"
          : > "$headers"
          code=$(curl -sS --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' -X OPTIONS "$URL/mirror" -H 'Origin: https://evil.example' -H 'Access-Control-Request-Method: POST')
          echo "[evil origin] HTTP $code :: $(cat "$tmp")"
          test "$code" = 403
          ! tr -d '\r' < "$headers" | grep -Fqi 'access-control-allow-origin: https://evil.example'
          echo 'NETLIFY_PUBLIC_BOUNDARY_OK'
