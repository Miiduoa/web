name: nolu retired Edge endpoint guard

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/pu-plan-social-core-v1/**'
      - 'supabase/functions/pu-plan-social-v*/**'
      - 'supabase/functions/pu-plan-api-v5/**'
      - 'supabase/functions/pu-plan-api-v7/**'
      - 'supabase/functions/pu-plan-sync-v1/**'
      - 'supabase/functions/pu-plan-admin-audit-test/**'
      - 'supabase/functions/pu-plan-db-probe/**'
      - 'supabase/functions/pu-plan-load-proxy/**'
      - 'supabase/functions/pu-plan-load-fixture/**'
      - 'supabase/functions/campus-member-profile/**'
      - '.github/workflows/nolu-retired-edge-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/pu-plan-social-core-v1/**'
      - 'supabase/functions/pu-plan-social-v*/**'
      - 'supabase/functions/pu-plan-api-v5/**'
      - 'supabase/functions/pu-plan-api-v7/**'
      - 'supabase/functions/pu-plan-sync-v1/**'
      - 'supabase/functions/pu-plan-admin-audit-test/**'
      - 'supabase/functions/pu-plan-db-probe/**'
      - 'supabase/functions/pu-plan-load-proxy/**'
      - 'supabase/functions/pu-plan-load-fixture/**'
      - 'supabase/functions/campus-member-profile/**'
      - '.github/workflows/nolu-retired-edge-smoke.yml'
  schedule:
    - cron: '47 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolu-retired-edge-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  retired-endpoints:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retired nolu Edge endpoints must remain disabled
        shell: bash
        run: |
          set -euo pipefail
          primary='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1'
          standby='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1'
          retired=(
            pu-plan-social-v12
            pu-plan-social-v13
            pu-plan-social-v14
            pu-plan-social-v15
            pu-plan-social-v16
            pu-plan-social-v17
            pu-plan-api-v5
            pu-plan-api-v7
            pu-plan-sync-v1
            pu-plan-admin-audit-test
            pu-plan-db-probe
            pu-plan-load-proxy
            pu-plan-load-fixture
            campus-member-profile
          )
          failed=0
          check_disabled() {
            local base="$1" slug="$2" tag="$3"
            local body="/tmp/${tag}-${slug}.body"
            local headers="/tmp/${tag}-${slug}.headers"
            local code rc attempt
            code='000'; rc=1
            for attempt in 1 2 3; do
              : >"$body"
              : >"$headers"
              set +e
              code=$(curl -sS --connect-timeout 5 --max-time 15 -D "$headers" -o "$body" -w '%{http_code}' "$base/$slug")
              rc=$?
              set -e
              [ "$rc" -eq 0 ] && break
              echo "::warning::$tag/$slug transport attempt $attempt failed (curl=$rc)"
              sleep "$attempt"
            done
            echo "$tag/$slug rc=$rc HTTP=$code"
            if [ "$rc" -ne 0 ] || [ "$code" != '410' ] || ! grep -q 'DISABLED' "$body"; then
              echo "::error::$tag/$slug must remain reachable only as HTTP 410 DISABLED"
              cat "$body" 2>/dev/null || true
              failed=1
              return
            fi
            if ! grep -Eqi '^cache-control:[[:space:]]*no-store' "$headers"; then
              echo "::error::$tag/$slug retired response must be no-store"
              failed=1
            fi
          }
          for slug in "${retired[@]}"; do check_disabled "$primary" "$slug" primary; done
          check_disabled "$standby" pu-plan-api-v7 standby
          check_disabled "$standby" pu-plan-sync-v1 standby
          check_disabled "$standby" pu-plan-social-core-v1 standby
          [ "$failed" = '0' ]
