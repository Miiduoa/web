name: nolu database recovery probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/db-direct-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify nolu database through Edge health probe
        shell: bash
        run: |
          set -euo pipefail
          url='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-db-probe'
          code=$(curl -sS --max-time 45 -o /tmp/body -w '%{http_code}' "$url" || true)
          body=$(cat /tmp/body 2>/dev/null || true)
          echo "HTTP=$code"
          echo "$body"
          if [ "$code" != '200' ] || ! echo "$body" | grep -q '"ok":true'; then
            echo 'nolu database path is not healthy.'
            exit 1
          fi
