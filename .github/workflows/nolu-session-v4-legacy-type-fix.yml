name: nolu session v4 legacy type fix

on:
  push:
    branches: [security/nolu-session-v4-20260911]
    paths:
      - '.github/workflows/nolu-session-v4-legacy-type-fix.yml'

permissions:
  contents: write

jobs:
  patch-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make active-semester invariant explicit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/pu-plan-api/index.ts')
          text=p.read_text()
          old="  return {rows,active};\n}\nasync function semesterBundle(uid:string)"
          new="  if(!active)throw new ApiError(500,'無法建立目前學期','SEMESTER_STATE_INVALID');\n  return {rows,active};\n}\nasync function semesterBundle(uid:string)"
          assert old in text, 'expected semester invariant source not found'
          p.write_text(text.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/pu-plan-api/index.ts
          git diff --cached --check
          git commit -m 'fix(nolu): make active semester invariant explicit'
          git push
