name: nolu strict regional credentials

on:
  push:
    branches: [fix/nolu-strict-regional-credentials-20260911]
    paths:
      - 'pu-plan/resilience.js'
      - 'pu-plan/transport-bridge.js'
      - 'pu-plan/cloud-replication.js'
      - 'pu-plan/provider-mesh.js'
      - '.github/workflows/nolu-strict-regional-credentials.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/resilience.js'
      - 'pu-plan/transport-bridge.js'
      - 'pu-plan/cloud-replication.js'
      - 'pu-plan/provider-mesh.js'
      - '.github/workflows/nolu-strict-regional-credentials.yml'

permissions:
  contents: read

jobs:
  strict-regional-credentials:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Syntax check
        run: |
          node --check pu-plan/resilience.js
          node --check pu-plan/transport-bridge.js
          node --check pu-plan/cloud-replication.js
          node --check pu-plan/provider-mesh.js
      - name: Install Playwright
        run: |
          npm --prefix /tmp/nolu-strict-region init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-strict-region install playwright >/dev/null 2>&1
          cd /tmp/nolu-strict-region && npx playwright install --with-deps chromium >/dev/null
      - name: Tokyo-only login must never authorize Mumbai
        env:
          NODE_PATH: /tmp/nolu-strict-region/node_modules
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory pu-plan >/tmp/nolu-strict-region-http.log 2>&1 &
          cat >/tmp/nolu-strict-region/check.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const b64=s=>Buffer.from(s).toString('base64url');
          const uid='77777777-7777-4777-8777-777777777777';
          const now=Math.floor(Date.now()/1000);
          const TOKYO=`${b64(JSON.stringify({v:4,uid,iat:now,exp:now+3600,cv:'tokyo-only'}))}.${b64('tokyo-signature')}`;
          const A='hrrmkrayvrgnwcroyttp',B='ltfurqaspqsvswmebyzw';
          let standbyDown=false;
          const wrongRegional=[];
          const mintCalls=[];
          const bundle={profile:{id:uid,display_name:'Tokyo Only',username:'tokyo_only',avatar_data:'',bio:'',discoverable:true},courses:[],semesters:[],active_semester:null,social:{relationships:[],profiles:[],friends:[],meetups:[]}};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const context=await browser.newContext({serviceWorkers:'block'});
              await context.route('https://*.supabase.co/functions/v1/**',async route=>{
                const req=route.request(),url=new URL(req.url()),path=url.pathname,auth=req.headers()['authorization']||'';
                let body={};try{body=JSON.parse(req.postData()||'{}')}catch{}
                if(url.host.startsWith(A)&&auth===`Bearer ${TOKYO}`)wrongRegional.push({host:'Mumbai',path,action:body.action||'',auth});
                if(path.endsWith('/pu-plan-portable-v1')){
                  mintCalls.push({host:url.host,path,auth});
                  return route.fulfill({status:410,contentType:'application/json',body:'{"error":"DISABLED"}'});
                }
                if(path.endsWith('/pu-plan-replica-v2'))return route.fulfill({status:503,contentType:'application/json',body:'{"error":"REPLICA_OFF"}'});
                if(url.host.startsWith(A))return route.fulfill({status:503,contentType:'application/json',body:'{"error":"PRIMARY_DOWN"}'});
                if(url.host.startsWith(B)&&path.endsWith('/pu-plan-api-v8')){
                  if(standbyDown)return route.fulfill({status:503,contentType:'application/json',body:'{"error":"STANDBY_DOWN"}'});
                  if(body.action==='login')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({...bundle,token:TOKYO})});
                  if(body.action==='bootstrap')return route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(bundle)});
                  return route.fulfill({status:200,contentType:'application/json',body:'{"ok":true}'});
                }
                return route.fulfill({status:503,contentType:'application/json',body:'{}'});
              });

              const page=await context.newPage();
              await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForFunction(()=>!!window.PUPLAN_CLOUD&&!!window.NOLU_RESILIENCE&&!!window.NOLU_REPLICATION&&!!window.NOLU_PROVIDER_MESH,{timeout:15000});
              await page.locator('[data-auth-tab="login"]').click();
              await page.locator('#loginEmail').waitFor({state:'visible'});
              await page.fill('#loginEmail','tokyo-only@example.invalid');
              await page.fill('#loginPassword','not-a-real-password');
              await page.locator('#loginForm').evaluate(form=>form.requestSubmit());
              await page.waitForFunction(token=>localStorage.getItem('puplan_session')===token&&localStorage.getItem('puplan_session_standby_v1')===token,TOKYO,{timeout:15000});
              await page.waitForTimeout(800);

              const afterLogin=await page.evaluate(()=>({
                canonical:localStorage.getItem('puplan_session'),
                primary:localStorage.getItem('puplan_session_primary_v1'),
                standby:localStorage.getItem('puplan_session_standby_v1'),
                preferred:localStorage.getItem('nolu_preferred_cloud_v1')
              }));
              console.log('TOKYO_ONLY_AFTER_LOGIN',afterLogin);

              // Remove any accidentally seeded primary slot so request routing itself
              // is independently tested rather than only the migration helper.
              await page.evaluate(()=>localStorage.removeItem('puplan_session_primary_v1'));
              wrongRegional.length=0;
              standbyDown=true;
              const offline=await page.evaluate(async()=>{
                const url='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v6';
                const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer stale'},body:JSON.stringify({action:'bootstrap'})});
                return {status:r.status,data:await r.json()};
              });
              console.log('TOKYO_ONLY_PRIMARY_OUTAGE',offline,'WRONG_REGIONAL',wrongRegional);

              mintCalls.length=0;
              await page.evaluate(()=>window.NOLU_PROVIDER_MESH.mintPortableToken(true));
              console.log('TOKYO_ONLY_MINT_CALLS',mintCalls);
              const primaryMintWithTokyo=mintCalls.some(x=>x.host.startsWith(A)&&x.auth===`Bearer ${TOKYO}`);

              assert(afterLogin.canonical===TOKYO&&afterLogin.standby===TOKYO,'Tokyo login did not establish its own regional session');
              assert(!afterLogin.primary,'Tokyo canonical session was incorrectly seeded into the Mumbai slot');
              assert(afterLogin.preferred==='standby','Tokyo login did not preserve standby preference');
              assert(offline.status===200&&offline.data?.offline===true,'dual-region outage did not use safe local bootstrap');
              assert(wrongRegional.length===0,`Tokyo session leaked to Mumbai request path: ${JSON.stringify(wrongRegional)}`);
              assert(!primaryMintWithTokyo,'Tokyo session was sent to the Mumbai portable-token mint endpoint');
            }finally{await browser.close()}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 100s node /tmp/nolu-strict-region/check.cjs
