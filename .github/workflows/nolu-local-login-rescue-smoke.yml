name: nolu local login rescue smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/offline-session-rescue.js'
      - 'pu-plan/session-recovery.js'
      - 'pu-plan/account-boundary.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - 'pu-plan/index.html'
      - '.github/workflows/nolu-local-login-rescue-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'pu-plan/offline-session-rescue.js'
      - 'pu-plan/session-recovery.js'
      - 'pu-plan/account-boundary.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - 'pu-plan/index.html'
      - '.github/workflows/nolu-local-login-rescue-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  same-device-rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - name: Parse rescue and PWA files
        run: |
          set -euo pipefail
          node --check pu-plan/offline-session-rescue.js
          node --check pu-plan/session-recovery.js
          node --check pu-plan/account-boundary.js
          node --check pu-plan/sw.js
          node --check pu-plan/pwa.js
      - name: Require authority-first login rescue
        run: |
          set -euo pipefail
          f=pu-plan/offline-session-rescue.js
          grep -Fq "if(response.status<500&&response.status!==410)return response" "$f"
          grep -Fq "if(action==='login')" "$f"
          grep -Fq "return loginResponse(trusted)" "$f"
          grep -Fq "String(recovery?.uid||'')===String(trusted.session.uid)" "$f"
          grep -Fq "['canonical-ok','recovered','local-grace']" "$f"
          grep -Fq "error:'AUTHORITY_UNAVAILABLE'" "$f"
          ! grep -Eq 'checkPassword|passwordHash|recover_password|signup' "$f"
      - name: Require exact-fingerprint owner repair only from IndexedDB
        run: |
          set -euo pipefail
          f=pu-plan/offline-session-rescue.js
          grep -Fq "const exact=x=>x?.uid===id&&x?.profile?.id===id&&x?.sessionFingerprint===fp" "$f"
          grep -Fq "if(exact(durable))candidates.push({snap:durable,durable:true})" "$f"
          grep -Fq "if(owner===id&&exact(local))candidates.push({snap:local,durable:false})" "$f"
          grep -Fq "if(best.durable&&owner!==id)rebindFromDurable(id,best.snap)" "$f"
      - name: Require current installed shell
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const sw=fs.readFileSync('pu-plan/sw.js','utf8');
          const pwa=fs.readFileSync('pu-plan/pwa.js','utf8');
          const index=fs.readFileSync('pu-plan/index.html','utf8');
          const generation=sw.match(/const CACHE='nolu-shell-([^']+)'/)?.[1];
          assert(generation,'service-worker shell generation missing');
          const pwaGeneration=pwa.match(/const SHELL_GENERATION='([^']+)'/)?.[1];
          assert.equal(pwaGeneration,generation,'PWA shell generation drifted');
          assert.match(pwa,/outcome:'no-mid-session-reload'/,'PWA must keep no-mid-session-reload behavior');
          const versions=[...index.matchAll(/\?v=([A-Za-z0-9_-]+)/g)].map(m=>m[1]);
          assert(versions.length>0,'HTML versioned assets missing');
          assert.deepEqual([...new Set(versions)],[generation],'HTML shell generation drifted');
          for(const path of ['./auth-trace.js','./offline-session-rescue.js','./account-boundary.js','./media-failback-guard.js']){
            assert(sw.includes(`'${path}'`),`service worker missing ${path}`);
          }
          console.log(`NOLU_LOCAL_RESCUE_SHELL_OK ${generation}`);
          NODE