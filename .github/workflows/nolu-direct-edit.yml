name: nolu direct timetable editing
on:
  pull_request:
    branches: [main]
    paths: ['pu-plan/**', 'tests/product/**', '.github/workflows/nolu-direct-edit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: direct-edit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct-edit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check placement boundaries and syntax
        run: |
          node --check pu-plan/features/direct-edit.js
          TZ=Asia/Taipei node --test tests/product/direct-placement.test.mjs
      - name: Install isolated browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise direct pointer and keyboard editing
        env:
          NOLU_BROWSER: ${{ matrix.browser }}
        run: python tests/product/direct_edit.py
      - name: Preserve exact source, screenshots and check records
        if: always()
        run: |
          mkdir -p product-test-results
          tar -czf product-test-results/source-direct-edit.tar.gz pu-plan tests/product .github/tests .github/workflows package.json package-lock.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nolu-direct-edit-${{ matrix.browser }}
          path: product-test-results/
          retention-days: 7
