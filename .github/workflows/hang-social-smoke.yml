name: hang social integration smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hang-social-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  social-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Test posting, reply editing, profile and ranking
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const CORE='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-core-v1';
          const SOCIAL='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-social-v16';
          const PROFILE='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/campus-member-profile';
          const tag=(Date.now().toString(36)+crypto.randomBytes(3).toString('hex')).toLowerCase();
          const email=`hang-smoke-${tag}@example.test`;
          const username=`hs${tag}`.replace(/[^a-z0-9]/g,'').slice(0,22);
          const password=`Smoke-${crypto.randomBytes(14).toString('base64url')}Aa9!`;
          const postBody=`hang social smoke post ${tag}`;
          const replyBody=`hang social smoke reply ${tag}`;
          const editedBody=`hang social smoke edited ${tag}`;
          const report={tag,email,username,checks:[],started_at:new Date().toISOString()};
          const check=(name,ok,detail='')=>{report.checks.push({name,ok,detail});console.log(`${ok?'PASS':'FAIL'} ${name}${detail?`: ${detail}`:''}`);if(!ok)throw new Error(`${name}: ${detail}`)};
          async function call(url,body,token=''){
            const res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Origin':'https://miiduoa.github.io',...(token?{Authorization:`Bearer ${token}`}:{})},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
            const text=await res.text();let data={};try{data=JSON.parse(text||'{}')}catch{}
            if(!res.ok)throw new Error(`${url.split('/').pop()} ${res.status}: ${data.message||text}`);
            return data;
          }
          (async()=>{
            const signup=await call(CORE,{action:'signup',display_name:'hang 測試帳號',username,email,password});
            check('signup',!!signup.token&&signup.profile?.username===username,signup.profile?.username||'missing profile');
            const token=signup.token;

            await call(SOCIAL,{action:'create_post',body:postBody,visibility:'public'},token);
            let latest=await call(SOCIAL,{action:'feed',mode:'latest',limit:20},token);
            check('latest ranking mode',latest.ranking==='latest',String(latest.ranking));
            const post=(latest.posts||[]).find(x=>x.body===postBody);
            check('created post visible',!!post,`posts=${latest.posts?.length||0}`);

            await call(SOCIAL,{action:'reply_post',post_id:post.id,body:replyBody},token);
            latest=await call(SOCIAL,{action:'feed',mode:'latest',limit:20},token);
            const postWithReply=(latest.posts||[]).find(x=>x.id===post.id);
            const reply=(postWithReply?.replies||[]).find(x=>x.body===replyBody);
            check('reply visible',!!reply,`reply_count=${postWithReply?.reply_count||0}`);

            const edited=await call(SOCIAL,{action:'edit_reply',reply_id:reply.id,body:editedBody},token);
            check('edit reply response',edited.reply?.body===editedBody,edited.reply?.body||'missing edited reply');
            latest=await call(SOCIAL,{action:'feed',mode:'latest',limit:20},token);
            const editedReply=((latest.posts||[]).find(x=>x.id===post.id)?.replies||[]).find(x=>x.id===reply.id);
            check('edited reply persisted',editedReply?.body===editedBody,editedReply?.body||'not found');

            const profile=await call(PROFILE,{username},token);
            check('profile opens by username',profile.profile?.username===username,profile.profile?.username||'missing');
            check('profile includes post',(profile.posts||[]).some(x=>x.id===post.id),`posts=${profile.posts?.length||0}`);

            const recommended=await call(SOCIAL,{action:'feed',mode:'for_you',limit:20},token);
            check('recommended ranking mode',recommended.ranking==='for_you',String(recommended.ranking));
            check('recommended feed returns posts',Array.isArray(recommended.posts)&&recommended.posts.length>0,`posts=${recommended.posts?.length||0}`);

            report.finished_at=new Date().toISOString();
          })().catch(e=>{report.error=String(e?.stack||e);process.exitCode=1}).finally(()=>fs.writeFileSync('hang-social-smoke.json',JSON.stringify(report,null,2)));
          NODE
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hang-social-smoke
          path: hang-social-smoke.json
          retention-days: 2
