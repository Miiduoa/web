name: nolu API authorization boundary smoke

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/pu-plan-social/**'
      - 'supabase/functions/pu-plan-admin/**'
      - 'supabase/functions/pu-plan-api/**'
      - 'supabase/functions/pu-plan-api-v8/**'
      - 'supabase/functions/_shared/session-v4.ts'
      - '.github/workflows/nolu-api-authz-boundary-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/pu-plan-social/**'
      - 'supabase/functions/pu-plan-admin/**'
      - 'supabase/functions/pu-plan-api/**'
      - 'supabase/functions/pu-plan-api-v8/**'
      - 'supabase/functions/_shared/session-v4.ts'
      - '.github/workflows/nolu-api-authz-boundary-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authz-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BASE: https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1
      GOOD_ORIGIN: https://miiduoa.github.io
      EVIL_ORIGIN: https://evil.example
    steps:
      - uses: actions/checkout@v6
      - name: Source authorization and IDOR guardrails
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          social=Path('supabase/functions/pu-plan-social/index.ts').read_text()
          admin=Path('supabase/functions/pu-plan-admin/index.ts').read_text()
          core=Path('supabase/functions/pu-plan-api/index.ts').read_text()
          v8=Path('supabase/functions/pu-plan-api-v8/index.ts').read_text()

          # Social/chat mutations must derive ownership and membership from the
          # verified session, never from a caller supplied user id.
          assert "session=await verifySignedSessionV4" in social
          assert "await assertCredentialCurrent" in social
          assert "const member=await memberOf(id,uid);if(!member)throw new ApiError(403" in social
          assert "if(!(await memberOf(id,u.id)))throw new ApiError(403" in social
          assert "if(viewer.role!=='admin'&&r.author_id!==viewer.id)throw new ApiError(403" in social
          assert "if(u.role!=='admin'&&p.author_id!==u.id)throw new ApiError(403" in social
          assert "if(u.role!=='admin'&&r.author_id!==u.id)throw new ApiError(403" in social

          # Admin capability is checked again server-side after session
          # verification/current-credential validation.
          assert "const admin = await requireAdmin(req);" in admin
          assert "if (user.role !== 'admin')" in admin
          assert "verifySignedSessionV4(token, SERVICE_KEY)" in admin
          assert "await assertCredentialCurrent(session, user.password_salt || '')" in admin

          # Legacy/core account, schedule, friend and meetup mutations must be
          # scoped to the authenticated user at every object boundary.
          assert "session=await verifySignedSessionV4(token,SERVICE_KEY)" in core
          assert "await assertCredentialCurrent(session,user.password_salt||'')" in core
          assert ".eq('user_id',user.id).eq('semester_key',key)" in core
          assert "insert({requester_id:user.id,addressee_id:target,status:'pending'})" in core
          assert ".eq('addressee_id',user.id).eq('status','pending')" in core
          assert "if(!(await areFriends(user.id,target)))throw new ApiError(403" in core
          assert ".eq('invitee_id',user.id).eq('status','pending')" in core
          assert ".eq('creator_id',user.id).in('status',['pending','accepted'])" in core

          # v8 must authenticate locally, scope semester writes to user.id, and
          # forward primary-only mutations with the original Authorization header
          # instead of trusting any body.user_id as the caller identity.
          assert "session = await verifySignedSessionV4(token, SERVICE_KEY)" in v8
          assert "await assertCredentialCurrent(session, user.password_salt || '')" in v8
          assert ".eq('user_id', user.id).eq('semester_key', key)" in v8
          assert "if (PRIMARY_ONLY_ACTIONS.has(action)) return await forwardPrimary(req, body);" in v8
          assert "'Authorization': req.headers.get('authorization') || ''" in v8
          print('API authorization and IDOR source guardrails passed')
          PY

      - name: Anonymous and forged sessions must be rejected
        run: |
          set -euo pipefail
          probe(){
            local endpoint="$1" body="$2" auth="${3:-}"
            local code="" rc=1
            for attempt in 1 2; do
              local args=(-sS --connect-timeout 3 --max-time 7 -o /tmp/body -w '%{http_code}' -X POST "$BASE/$endpoint" -H "Origin: $GOOD_ORIGIN" -H 'Content-Type: application/json' --data "$body")
              if [ -n "$auth" ]; then args+=(-H "Authorization: Bearer $auth"); fi
              set +e
              code=$(curl "${args[@]}")
              rc=$?
              set -e
              [ "$rc" -eq 0 ] && break
              echo "::warning::$endpoint transport attempt $attempt failed (curl=$rc)"
              sleep "$attempt"
            done
            if [ "$rc" -ne 0 ]; then
              echo "::warning::$endpoint auth probe transport-inconclusive; source guardrails remain enforced"
              return 0
            fi
            echo "$endpoint $body -> $code"
            if [ "$code" != 401 ]; then
              echo "::error::$endpoint accepted or misrouted an anonymous/forged session (HTTP $code)"
              cat /tmp/body
              exit 1
            fi
          }
          probe pu-plan-social '{"action":"profile_view","username":"someone"}'
          probe pu-plan-social '{"action":"conversation","conversation_id":"00000000-0000-4000-8000-000000000000"}' forged.session
          probe pu-plan-social '{"action":"send_message","conversation_id":"00000000-0000-4000-8000-000000000000","body":"x"}' forged.session
          probe pu-plan-admin '{"action":"overview"}'
          probe pu-plan-admin '{"action":"user_detail","user_id":"00000000-0000-4000-8000-000000000000"}' forged.session
          probe pu-plan-admin '{"action":"moderate_post","id":"00000000-0000-4000-8000-000000000000","mode":"remove"}' forged.session
          probe pu-plan-admin '{"action":"remove_message","id":"00000000-0000-4000-8000-000000000000"}' forged.session
          probe pu-plan-api '{"action":"bootstrap"}' forged.session
          probe pu-plan-api '{"action":"update_profile","display_name":"x","username":"xx"}' forged.session
          probe pu-plan-api '{"action":"send_request","user_id":"00000000-0000-4000-8000-000000000000"}' forged.session
          probe pu-plan-api-v8 '{"action":"bootstrap"}' forged.session
          probe pu-plan-api-v8 '{"action":"save_schedule","courses":[]}' forged.session

      - name: Cross-origin browser calls must be rejected
        run: |
          set -euo pipefail
          for endpoint in pu-plan-social pu-plan-admin pu-plan-api pu-plan-api-v8; do
            code=""; rc=0
            code=$(curl -sS --connect-timeout 3 --max-time 7 -o /tmp/body -w '%{http_code}' -X OPTIONS "$BASE/$endpoint" -H "Origin: $EVIL_ORIGIN" -H 'Access-Control-Request-Method: POST') || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::$endpoint cross-origin probe transport-inconclusive (curl=$rc)"
              continue
            fi
            echo "$endpoint evil preflight -> $code"
            test "$code" = 403
          done
