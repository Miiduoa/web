name: Nolu mobile layout check

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/**'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6

      - name: Install browser test runner
        run: |
          npm --prefix /tmp/nolu-ui init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-ui install playwright >/dev/null 2>&1
          cd /tmp/nolu-ui && npx playwright install --with-deps chromium >/dev/null

      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory pu-plan > /tmp/nolu-http.log 2>&1 &
          echo $! > /tmp/nolu-http.pid
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .25; done
          exit 1

      - name: Check mobile layouts
        env:
          NODE_PATH: /tmp/nolu-ui/node_modules
        run: |
          mkdir -p ui-smoke
          cat >/tmp/nolu-ui/check.cjs <<'NODE'
          const {chromium}=require('playwright');
          const fs=require('fs');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const intersects=(a,b)=>a&&b&&!(a.x+a.width<=b.x||b.x+b.width<=a.x||a.y+a.height<=b.y||b.y+b.height<=a.y);
          async function inspect(page,label){
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#authGate');
            const metrics=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth,bodyWidth:document.body.scrollWidth}));
            assert(metrics.scrollWidth<=metrics.innerWidth+2,`${label}: document overflows horizontally (${metrics.scrollWidth}/${metrics.innerWidth})`);
            assert(metrics.bodyWidth<=metrics.innerWidth+2,`${label}: body overflows horizontally`);
            const art=await page.locator('.auth-art').boundingBox();
            const title=await page.locator('.auth-poster h2').boundingBox();
            const copy=await page.locator('.auth-poster p').boundingBox();
            assert(art&&title&&copy,`${label}: login brand elements missing`);
            assert(!intersects(art,title),`${label}: logo/wordmark overlaps headline`);
            assert(!intersects(art,copy),`${label}: logo/wordmark overlaps copy`);
            assert(!intersects(title,copy),`${label}: headline overlaps copy`);
            await page.getByRole('button',{name:'登入',exact:true}).first().click();
            await page.waitForTimeout(50);
            assert(await page.locator('#loginForm').isVisible(),`${label}: login form did not open`);
            const fields=await page.locator('#loginForm input').all();
            for(const field of fields){const b=await field.boundingBox();assert(b&&b.x>=-1&&b.x+b.width<=metrics.innerWidth+1,`${label}: login field outside viewport`)}
            await page.screenshot({path:`ui-smoke/login-${label}.png`,fullPage:true});
            await page.locator('#guestMode').click();
            await page.waitForTimeout(350);
            const appMetrics=await page.evaluate(()=>({innerWidth,scrollWidth:document.documentElement.scrollWidth}));
            assert(appMetrics.scrollWidth<=appMetrics.innerWidth+2,`${label}: app shell overflows horizontally`);
            await page.screenshot({path:`ui-smoke/app-${label}.png`,fullPage:true});
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [w,h,label] of [[390,844,'390x844'],[430,932,'430x932']]){
              const page=await browser.newPage({viewport:{width:w,height:h},deviceScaleFactor:1,isMobile:true,hasTouch:true});
              page.on('pageerror',e=>console.error('PAGE_ERROR',e.message));
              await inspect(page,label);
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node /tmp/nolu-ui/check.cjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nolu-mobile-layout
          path: ui-smoke/*.png
          retention-days: 3
