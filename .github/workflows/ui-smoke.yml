name: nolu mobile layout check

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/**'
      - '.github/workflows/ui-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolu-mobile-layout
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - name: Install browser test runner
        run: |
          npm --prefix /tmp/nolu-ui init -y >/dev/null 2>&1
          npm --prefix /tmp/nolu-ui install playwright >/dev/null 2>&1
          cd /tmp/nolu-ui && npx playwright install --with-deps chromium >/dev/null
      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory pu-plan > /tmp/nolu-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0; sleep .25; done
          exit 1
      - name: Check mobile layouts
        env:
          NODE_PATH: /tmp/nolu-ui/node_modules
        run: |
          mkdir -p ui-smoke
          cat >/tmp/nolu-ui/check.cjs <<'NODE'
          const {chromium}=require('playwright');
          const assert=(ok,msg)=>{if(!ok)throw new Error(msg)};
          const intersects=(a,b)=>a&&b&&!(a.right<=b.x||b.right<=a.x||a.bottom<=b.y||b.bottom<=a.y);
          async function box(page,selector){const e=page.locator(selector).first();if(!await e.count())return null;const r=await e.boundingBox();return r?{x:r.x,y:r.y,width:r.width,height:r.height,right:r.x+r.width,bottom:r.y+r.height}:null}
          async function overflow(page,label,view){const m=await page.evaluate(()=>({w:innerWidth,d:document.documentElement.scrollWidth,b:document.body.scrollWidth}));assert(m.d<=m.w+2&&m.b<=m.w+2,`${label} ${view}: horizontal overflow ${m.d}/${m.b}/${m.w}`);return m}
          async function within(page,selector,label){const r=await box(page,selector),w=await page.evaluate(()=>innerWidth);assert(r&&r.x>=-1&&r.right<=w+1,`${label}: ${selector} outside viewport`);return r}
          async function screenshot(page,name){await page.screenshot({path:`ui-smoke/${name}.png`,fullPage:true})}
          async function inspect(browser,w,h,label){
            const context=await browser.newContext({viewport:{width:w,height:h},deviceScaleFactor:1,isMobile:true,hasTouch:true,serviceWorkers:'block'});
            const page=await context.newPage();page.setDefaultTimeout(5000);page.setDefaultNavigationTimeout(8000);
            await page.addInitScript(()=>localStorage.setItem('puplan_guest','1'));
            await page.route('**/*',route=>{const u=new URL(route.request().url());u.hostname==='127.0.0.1'?route.continue():route.abort()});
            await page.goto('http://127.0.0.1:4173/',{waitUntil:'domcontentloaded'});
            await page.waitForSelector('#authGate');
            await page.waitForFunction(()=>!!window.PUPLAN_CLOUD?.showGate,{timeout:10000});

            await page.evaluate(()=>{localStorage.removeItem('puplan_guest');window.PUPLAN_CLOUD.showGate('register')});
            await overflow(page,label,'login');
            const brand=await within(page,'.auth-brand',`${label} login`),title=await within(page,'.auth-copy h1',`${label} login`),copy=await within(page,'.auth-copy p',`${label} login`),card=await within(page,'.auth-card',`${label} login`);
            assert(!intersects(brand,title)&&!intersects(brand,copy)&&!intersects(title,copy),`${label}: login hero overlaps`);
            assert(card.y>=copy.bottom-2,`${label}: login card overlaps hero`);
            assert((await page.locator('.auth-brand strong').textContent())?.trim()==='nolu',`${label}: wrong brand`);
            await page.getByRole('button',{name:'登入',exact:true}).first().click();
            await page.waitForFunction(()=>!document.querySelector('#loginForm')?.classList.contains('hidden'));
            for(const field of await page.locator('#loginForm input').all()){const b=await field.boundingBox();assert(b&&b.x>=-1&&b.x+b.width<=w+1,`${label}: login field outside viewport`)}
            await screenshot(page,`login-${label}`);

            await page.evaluate(()=>document.querySelector('#authGate')?.classList.add('off'));
            await page.waitForTimeout(80);
            assert(await page.locator('.bottom button').count()===5,`${label}: bottom navigation must have exactly 5 items`);
            await page.evaluate(()=>window.PUPLAN_APP?.changeView?.('schedule'));
            await overflow(page,label,'schedule');
            const topTitle=await within(page,'#title',`${label} schedule`),actions=await within(page,'.actions',`${label} schedule`);assert(!intersects(topTitle,actions),`${label}: top bar title overlaps actions`);
            const hero=await within(page,'.hero-main',`${label} schedule`),stats=await within(page,'.hero-side',`${label} schedule`);assert(stats.y>=hero.bottom-2,`${label}: schedule still in desktop columns`);
            assert(await page.locator('#mobileAdd').isVisible(),`${label}: schedule add button missing`);
            await screenshot(page,`schedule-${label}`);

            await page.evaluate(()=>window.PUPLAN_APP?.changeView?.('friends'));await page.waitForTimeout(50);await overflow(page,label,'friends');
            const friendSide=await within(page,'.friend-side',`${label} friends`),friendMain=await within(page,'.friend-main',`${label} friends`);assert(friendMain.y>=friendSide.bottom-2,`${label}: friends still in desktop columns`);
            const duplicateFriendHeading=await page.locator('#friends .section-head h2').evaluate(e=>getComputedStyle(e).display);assert(duplicateFriendHeading==='none',`${label}: duplicate friends title visible`);
            await page.evaluate(()=>{const root=document.querySelector('#friendView');root.innerHTML='<div class="profile-page"><div class="profile-hero"><div class="avatar-profile"></div><div class="profile-title"><h2>測試</h2></div><div class="profile-actions"><button>好友</button></div></div></div>'});
            assert(await page.locator('#friendView .profile-hero').evaluate(e=>getComputedStyle(e).display)==='grid',`${label}: member sheet CSS leaked into friend profile`);
            await screenshot(page,`friends-${label}`);

            await page.evaluate(()=>window.PUPLAN_APP?.changeView?.('ai'));await page.waitForTimeout(40);await overflow(page,label,'assistant');
            const chat=await within(page,'.ai-chat',`${label} assistant`),side=await within(page,'.ai-side',`${label} assistant`);assert(side.y>=chat.bottom-2,`${label}: assistant still in desktop columns`);assert(await page.locator('#ai .section-head h2').evaluate(e=>getComputedStyle(e).display)==='none',`${label}: duplicate assistant title visible`);
            await screenshot(page,`assistant-${label}`);

            await page.evaluate(()=>window.PUPLAN_APP?.changeView?.('settings'));await page.waitForTimeout(40);await overflow(page,label,'settings');
            await within(page,'#settings .settings',`${label} settings`);const editorDisplay=await page.locator('#settings .profile-editor-head').evaluate(e=>getComputedStyle(e).display);assert(editorDisplay==='grid',`${label}: profile editor lost mobile grid layout`);
            assert(!await page.locator('#mobileAdd').isVisible(),`${label}: add button visible outside schedule`);
            await screenshot(page,`settings-${label}`);

            const communityButton=page.locator('[data-community-open]:visible').first();
            assert(await communityButton.count(),`${label}: visible community button missing`);
            await communityButton.click();await page.waitForTimeout(50);await overflow(page,label,'community');
            await within(page,'.community-tabs',`${label} community`);assert(!await page.locator('#mobileAdd').isVisible(),`${label}: add button visible over community`);assert(!await page.locator('#importSchedule').isVisible(),`${label}: import visible over community`);
            assert((await page.locator('#title').textContent())?.trim()==='動態',`${label}: community title incorrect`);
            await screenshot(page,`community-${label}`);

            await page.evaluate(()=>window.PUPLAN_APP?.changeView?.('schedule'));await page.waitForTimeout(30);
            assert(await page.locator('#importSchedule').isVisible(),`${label}: import did not return after leaving community`);
            await page.locator('#mobileAdd').click();await page.waitForSelector('#courseDialog[open]');await within(page,'#courseDialog',`${label} course dialog`);await overflow(page,label,'course-dialog');await screenshot(page,`course-dialog-${label}`);await page.evaluate(()=>document.querySelector('#courseDialog')?.close());
            await page.locator('#importSchedule').click();await page.waitForSelector('#importDialog[open]');await within(page,'#importDialog',`${label} import dialog`);await overflow(page,label,'import-dialog');await screenshot(page,`import-dialog-${label}`);await page.evaluate(()=>document.querySelector('#importDialog')?.close());
            await context.close();
          }
          (async()=>{const browser=await chromium.launch({headless:true});try{for(const [w,h,label] of [[375,812,'375x812'],[390,844,'390x844'],[430,932,'430x932']])await inspect(browser,w,h,label)}finally{await browser.close()}})().then(()=>process.exit(0)).catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 120s node /tmp/nolu-ui/check.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nolu-mobile-layout
          path: ui-smoke/*.png
          retention-days: 3
