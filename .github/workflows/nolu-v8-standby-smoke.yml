name: nolu independent standby v8 smoke

on:
  push:
    branches: [feat/nolu-independent-standby-v8]
    paths:
      - 'supabase/functions/pu-plan-api-v8/**'
      - '.github/workflows/nolu-v8-standby-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/pu-plan-api-v8/**'
      - '.github/workflows/nolu-v8-standby-smoke.yml'

permissions:
  contents: read

jobs:
  standby-v8:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6

      - name: Static security invariants
        run: |
          set -euo pipefail
          FILE=supabase/functions/pu-plan-api-v8/index.ts
          grep -q "verifySignedSessionV4" "$FILE"
          grep -q "assertCredentialCurrent" "$FILE"
          grep -q "PBKDF2_ITERATIONS = 210000" "$FILE"
          grep -q "STANDBY_NOT_SEEDED" "$FILE"
          grep -q "PRIMARY_REQUIRED" "$FILE"
          ! grep -Eq 'SUPABASE_SERVICE_ROLE_KEY[[:space:]]*=[[:space:]]*"' "$FILE"
          ! grep -Eq 'sb_secret_[A-Za-z0-9_-]+' "$FILE"

      - name: Live Tokyo v8 attack and availability smoke
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/pu-plan-api-v8'
          ORIGIN='https://miiduoa.github.io'
          tmp=$(mktemp)

          code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "$BASE" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{"action":"health"}')
          test "$code" = 200
          grep -q '"ok":true' "$tmp"
          grep -q '"cloud_tier":"standby"' "$tmp"
          grep -q '"protocol":"independent-session-v1"' "$tmp"

          code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "$BASE" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{"action":"bootstrap"}')
          test "$code" = 401
          grep -Eq 'UNAUTHORIZED|SESSION_' "$tmp"

          forged='eyJ2Ijo0LCJ1aWQiOiI1NTU1NTU1NS01NTU1LTQ1NTUtODU1NS01NTU1NTU1NTU1NTUiLCJpYXQiOjE3ODkwMDAwMDAsImV4cCI6MTc4OTAwMzYwMCwiY3YiOiJmYWtlIn0.ZmFrZQ'
          code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "$BASE" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' -H "Authorization: Bearer $forged" --data '{"action":"bootstrap"}')
          test "$code" = 401

          code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X OPTIONS "$BASE" -H 'Origin: https://evil.example' -H 'Access-Control-Request-Method: POST')
          test "$code" = 403

          code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' "$BASE")
          test "$code" = 405

          code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "$BASE" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{"action":"signup","display_name":"Smoke","username":"standby_smoke","email":"never-create@example.invalid","password":"12345678"}')
          test "$code" = 503
          grep -q 'PRIMARY_REQUIRED' "$tmp"

          code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "$BASE" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{"action":"login","email":"definitely-missing-v8@example.invalid","password":"not-a-real-password"}')
          test "$code" = 503
          grep -q 'STANDBY_NOT_SEEDED' "$tmp"

          if grep -Eqi 'password_hash|password_salt|postgres(ql)?://|SUPABASE_SERVICE_ROLE_KEY|stack|trace' "$tmp"; then
            echo 'Sensitive material leaked in response'
            cat "$tmp"
            exit 1
          fi

      - name: Retired experimental endpoints stay disabled
        run: |
          set -euo pipefail
          for path in pu-plan-api-v7 pu-plan-sync-v1; do
            code=$(curl -sS --max-time 12 -o /tmp/retired.json -w '%{http_code}' -X POST "https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/$path" -H 'Origin: https://miiduoa.github.io' -H 'Content-Type: application/json' --data '{"action":"health"}')
            test "$code" = 410
            grep -q 'DISABLED' /tmp/retired.json
          done
