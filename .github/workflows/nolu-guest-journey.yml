name: nolu guest journey
on:
  pull_request:
    branches: [main]
    paths: ['pu-plan/**', 'tests/product/**', '.github/workflows/nolu-guest-journey.yml']
  push:
    branches: [main]
    paths: ['pu-plan/**', 'tests/product/**', '.github/workflows/nolu-guest-journey.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: guest-journey-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guest-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Prepare an inspectable static preview
        run: |
          mkdir -p product-test-results
          tar -czf product-test-results/source-preview.tar.gz pu-plan tests/product .github/tests .github/workflows package.json package-lock.json
      - name: Install isolated browser tests
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify guest continuity in Chromium and WebKit
        run: python tests/product/guest_journey.py
      - name: Verify account isolation remains enforced
        if: ${{ !cancelled() }}
        run: node .github/tests/guest-privacy.cjs
      - name: Preserve preview, screenshots and exact results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nolu-guest-journey
          path: product-test-results/
          retention-days: 7
          if-no-files-found: error
