name: Controlled production load test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/load-test.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campus-load-test
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      SITE: https://miiduoa.github.io/web/
      API: https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api
      SOCIAL: https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-social-v12
      FIXTURE: https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-load-fixture
    steps:
      - name: Run realistic social traffic simulation
        id: load
        continue-on-error: true
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const crypto=require('crypto');
          const {performance}=require('perf_hooks');
          const SITE=process.env.SITE,API=process.env.API,SOCIAL=process.env.SOCIAL,FIXTURE=process.env.FIXTURE;
          const tag=(Date.now().toString(36)+crypto.randomBytes(3).toString('hex')).replace(/[^a-z0-9]/g,'').slice(-14);
          const password=`Load-${crypto.randomBytes(12).toString('base64url')}Aa9!`;
          const letters=['a','b','c','d'];
          const emails=letters.map(x=>`loadreal-${tag}-${x}@puplan.test`);
          const usernames=letters.map(x=>`lr${tag.slice(-9)}${x}`.toLowerCase().slice(0,24));
          const report={tag,started_at:new Date().toISOString(),fixture:{authors:0,conversations:0,feed_posts:0},results:[],fatal:null};

          async function fetchTimed(url,options={}){const start=performance.now();try{const res=await fetch(url,{...options,signal:AbortSignal.timeout(18000)});const text=await res.text();return{ok:res.ok,status:res.status,ms:performance.now()-start,text}}catch(e){return{ok:false,status:0,ms:performance.now()-start,error:String(e),text:''}}}
          async function call(url,action,payload={},token=''){const r=await fetchTimed(url,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})},body:JSON.stringify({action,...payload})});let data={};try{data=JSON.parse(r.text||'{}')}catch{}return{...r,data}}
          const pct=(v,p)=>{if(!v.length)return 0;const s=[...v].sort((a,b)=>a-b);return s[Math.min(s.length-1,Math.max(0,Math.ceil((p/100)*s.length)-1))]};
          function summarize(name,concurrency,rows,seconds){const lat=rows.map(x=>x.ms),ok=rows.filter(x=>x.ok).length;const x={name,concurrency,requests:rows.length,success_rate:+(100*ok/Math.max(1,rows.length)).toFixed(2),p50_ms:+pct(lat,50).toFixed(1),p95_ms:+pct(lat,95).toFixed(1),p99_ms:+pct(lat,99).toFixed(1),max_ms:+Math.max(0,...lat).toFixed(1),rps:+(rows.length/Math.max(.001,seconds)).toFixed(1),http_429:rows.filter(x=>x.status===429).length,http_5xx:rows.filter(x=>x.status>=500).length,http_0:rows.filter(x=>x.status===0).length};report.results.push(x);console.log('LOAD_RESULT '+JSON.stringify(x));return x}
          const stop=x=>x.success_rate<97||x.p95_ms>10000||x.http_5xx/Math.max(1,x.requests)>.02;
          async function stage(name,c,fn){const t=performance.now(),rows=await Promise.all(Array.from({length:c},(_,i)=>fn(i)));return summarize(name,c,rows,(performance.now()-t)/1000)}
          async function staged(name,levels,fn){for(const c of levels){const r=await stage(name,c,fn);if(stop(r))break}}
          const need=(r,label)=>{if(!r.ok)throw new Error(`${label} ${r.status}: ${String(r.text||r.error).slice(0,300)}`);return r};
          function save(){report.finished_at=new Date().toISOString();fs.writeFileSync('load-results.json',JSON.stringify(report,null,2))}

          (async()=>{
            need(await fetchTimed(SITE),'site');
            const users=[];
            for(let i=0;i<4;i++){
              const r=need(await call(API,'signup',{display_name:`流量測試 ${i+1}`,username:usernames[i],email:emails[i],password}),`signup_${i+1}`);
              const u={id:r.data.profile.id,token:r.data.token};users.push(u);
              const fx=need(await fetchTimed(FIXTURE,{method:'POST',headers:{'Authorization':`Bearer ${u.token}`,'Content-Type':'application/json'},body:'{}'}),`fixture_${i+1}`);
              let d={};try{d=JSON.parse(fx.text||'{}')}catch{}report.fixture.authors=Math.max(report.fixture.authors,Number(d.authors||0));report.fixture.conversations=Math.max(report.fixture.conversations,Number(d.conversations||0));
            }
            const wf=need(await call(SOCIAL,'feed',{},users[0].token),'feed_warm');report.fixture.feed_posts=wf.data.posts?.length||0;
            const wi=need(await call(SOCIAL,'inbox',{},users[0].token),'inbox_warm');const conversations=(wi.data.conversations||[]).map(x=>x.id);if(!conversations.length)throw new Error('no fixture conversations');console.log('FIXTURE '+JSON.stringify(report.fixture));

            await staged('static_html',[500,1000,2000],()=>fetchTimed(SITE));
            await staged('feed_read_5000_posts',[50,100,250,500,750,1000],i=>call(SOCIAL,'feed',{},users[i%users.length].token));
            await staged('inbox_read_50_chats',[50,100,250,500,750,1000],i=>call(SOCIAL,'inbox',{},users[i%users.length].token));
            await staged('conversation_read',[50,100,250,500,750,1000],i=>call(SOCIAL,'conversation',{conversation_id:conversations[i%conversations.length]},users[i%users.length].token));

            for(const c of [25,50,100,200,300]){const t=performance.now(),rows=[];await Promise.all(Array.from({length:c},(_,i)=>(async()=>{const u=users[i%users.length],cid=conversations[i%conversations.length];for(const [url,action,payload] of [[API,'bootstrap',{}],[SOCIAL,'feed',{}],[SOCIAL,'inbox',{}],[SOCIAL,'conversation',{conversation_id:cid}]]){const r=await call(url,action,payload,u.token);rows.push(r);if(!r.ok)break}})()));const r=summarize('full_signed_in_journey',c,rows,(performance.now()-t)/1000);if(stop(r))break}

            await stage('chat_send_write',30,i=>call(SOCIAL,'send_message',{conversation_id:conversations[i%conversations.length],body:`聊天寫入測試 ${i+1}`},users[i%users.length].token));
            await stage('post_create_write',8,i=>call(SOCIAL,'create_post',{body:`貼文寫入測試 ${i+1}`,visibility:'private'},users[i%users.length].token));
          })().catch(e=>{report.fatal=String(e?.stack||e);console.error(report.fatal);process.exitCode=1}).finally(save);
          NODE

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puplan-realistic-load-result
          path: load-results.json
          if-no-files-found: error
          retention-days: 3
