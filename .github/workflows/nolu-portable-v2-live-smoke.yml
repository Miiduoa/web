name: nolu portable v2 live smoke

on:
  push:
    branches: [main, security/nolu-portable-v2-live-smoke-20260911]
    paths:
      - 'pu-plan/nolu-mesh-jwks.json'
      - '.github/workflows/nolu-portable-v2-live-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/nolu-mesh-jwks.json'
      - '.github/workflows/nolu-portable-v2-live-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6

      - name: Verify staged public JWKS
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const jwks=JSON.parse(fs.readFileSync('pu-plan/nolu-mesh-jwks.json','utf8'));
          assert(Array.isArray(jwks.keys),'JWKS keys must be an array');
          const byKid=new Map(jwks.keys.map(k=>[k.kid,k]));
          for(const kid of ['mesh-mumbai-20260911-5','mesh-tokyo-20260911-5']){
            const k=byKid.get(kid);
            assert(k,`missing ${kid}`);
            assert.equal(k.kty,'EC');assert.equal(k.crv,'P-256');assert.equal(k.alg,'ES256');assert.equal(k.use,'sig');
            assert(k.x&&k.y,`${kid} missing public coordinates`);
            assert(!('d' in k),`${kid} must never expose a private scalar`);
          }
          assert.notDeepEqual(byKid.get('mesh-mumbai-20260911-5'),byKid.get('mesh-tokyo-20260911-5'),'regional public keys must be independent');
          console.log('PORTABLE_V2_JWKS_OK');
          NODE

      - name: Verify both regional portable v2 endpoints fail closed
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN='https://miiduoa.github.io'
          for entry in 'hrrmkrayvrgnwcroyttp mesh-mumbai-20260911-5' 'ltfurqaspqsvswmebyzw mesh-tokyo-20260911-5'; do
            set -- $entry
            REF="$1"; EXPECTED_KID="$2"
            URL="https://${REF}.supabase.co/functions/v1/pu-plan-portable-v2"
            tmp=$(mktemp)
            headers=$(mktemp)

            code=$(curl -sS --max-time 12 -D "$headers" -o "$tmp" -w '%{http_code}' "$URL" -H "Origin: $ORIGIN")
            echo "[$REF jwks] HTTP $code :: $(cat "$tmp")"
            test "$code" = 200
            EXPECTED_KID="$EXPECTED_KID" node - "$tmp" <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const body=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          assert.equal(body.keys?.length,1);
          const k=body.keys[0];
          assert.equal(k.kid,process.env.EXPECTED_KID);assert.equal(k.kty,'EC');assert.equal(k.crv,'P-256');assert.equal(k.alg,'ES256');
          assert(k.x&&k.y);assert(!('d' in k),'endpoint leaked private scalar');
          NODE
            grep -qi '^cache-control: no-store' "$headers"
            grep -qi '^access-control-allow-origin: https://miiduoa.github.io' "$headers"

            code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "$URL" -H "Origin: $ORIGIN" -H 'Content-Type: application/json' --data '{}')
            echo "[$REF unauth mint] HTTP $code :: $(cat "$tmp")"
            test "$code" = 401
            grep -q 'UNAUTHORIZED' "$tmp"

            code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "$URL" -H "Origin: $ORIGIN" -H 'Authorization: Bearer forged.invalid' -H 'Content-Type: application/json' --data '{}')
            echo "[$REF forged session] HTTP $code :: $(cat "$tmp")"
            test "$code" = 401
            grep -q 'UNAUTHORIZED' "$tmp"

            code=$(curl -sS --max-time 12 -D "$headers" -o "$tmp" -w '%{http_code}' -X OPTIONS "$URL" -H 'Origin: https://evil.example' -H 'Access-Control-Request-Method: POST')
            echo "[$REF evil origin] HTTP $code"
            test "$code" = 403
            ! grep -qi '^access-control-allow-origin:' "$headers"

            rm -f "$tmp" "$headers"
          done
