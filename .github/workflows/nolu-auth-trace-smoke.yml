name: nolu auth trace smoke

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/auth-trace.js'
      - 'pu-plan/media-input-guard.js'
      - 'pu-plan/account-boundary.js'
      - 'pu-plan/session-recovery.js'
      - 'pu-plan/cloud.js'
      - 'pu-plan/login-failover-budget.js'
      - 'pu-plan/pwa.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/main.js'
      - 'pu-plan/index.html'
      - '.github/workflows/nolu-auth-trace-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/auth-trace.js'
      - 'pu-plan/media-input-guard.js'
      - 'pu-plan/account-boundary.js'
      - 'pu-plan/session-recovery.js'
      - 'pu-plan/cloud.js'
      - 'pu-plan/login-failover-budget.js'
      - 'pu-plan/pwa.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/main.js'
      - 'pu-plan/index.html'
      - '.github/workflows/nolu-auth-trace-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-trace:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7

      - name: Syntax and shell contract
        run: |
          set -euo pipefail
          node --check pu-plan/auth-trace.js
          node --check pu-plan/media-input-guard.js
          node --check pu-plan/account-boundary.js
          node --check pu-plan/session-recovery.js
          node --check pu-plan/cloud.js
          node --check pu-plan/login-failover-budget.js
          node --check pu-plan/pwa.js
          node --check pu-plan/sw.js
          grep -q "import './auth-trace.js'" pu-plan/main.js
          grep -q "import './media-input-guard.js'" pu-plan/main.js
          grep -q "'./auth-trace.js'" pu-plan/sw.js
          grep -q "'./media-input-guard.js'" pu-plan/sw.js
          node <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const sw=fs.readFileSync('pu-plan/sw.js','utf8');
          const pwa=fs.readFileSync('pu-plan/pwa.js','utf8');
          const index=fs.readFileSync('pu-plan/index.html','utf8');
          const generation=sw.match(/const CACHE='nolu-shell-([^']+)'/)?.[1];
          assert(generation,'service-worker shell generation missing');
          const reload=pwa.match(/const key='nolu_shell_reload_([^']+)'/)?.[1];
          assert.equal(reload,generation.replace(/-/g,'_'),'PWA reload generation drifted');
          const versions=[...index.matchAll(/\?v=([A-Za-z0-9_-]+)/g)].map(m=>m[1]);
          assert(versions.length>0,'HTML versioned assets missing');
          assert.deepEqual([...new Set(versions)],[generation],'HTML shell generation drifted');
          NODE
          grep -q "auth-boundary-reload" pu-plan/account-boundary.js
          grep -q "session-recovery" pu-plan/session-recovery.js
          grep -q "auth-invalidated" pu-plan/cloud.js
          grep -q "auth401Quorum:true" pu-plan/login-failover-budget.js
          grep -q "pwa-controllerchange" pu-plan/pwa.js
          grep -q "20260913-media-input2" pu-plan/media-input-guard.js
          grep -q "page-lifecycle" pu-plan/auth-trace.js

      - name: Trace never persists auth secrets or identity data
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert');
          const code=fs.readFileSync('pu-plan/auth-trace.js','utf8');
          function storage(){
            const m=new Map();
            return {
              getItem:k=>m.has(k)?m.get(k):null,
              setItem:(k,v)=>m.set(k,String(v)),
              removeItem:k=>m.delete(k),
              dump:()=>Object.fromEntries(m)
            };
          }
          const localStorage=storage(),sessionStorage=storage(),window={};
          const listeners={};
          const addEventListener=(type,fn)=>{listeners[type]=fn};
          const performance={getEntriesByType:type=>type==='navigation'?[{type:'reload'}]:[]};
          vm.runInNewContext(code,{window,localStorage,sessionStorage,Date,Math,JSON,Object,String,Number,Set,performance,addEventListener});
          const trace=window.NOLU_AUTH_TRACE;
          assert.equal(trace.version,'20260913-auth-trace2');
          assert(trace.snapshot().some(x=>x.type==='trace-ready'&&x.source==='reload'),'navigation source was not recorded');
          trace.record('security-test',{
            status:'unauthorized',reason:'http-401',httpStatus:401,
            token:'super-secret-token',password:'hunter2',email:'private@example.com',
            uid:'11111111-1111-4111-8111-111111111111',profile:'private profile'
          });
          for(let i=0;i<100;i++)trace.record('ring-test',{status:`event-${i}`});
          const raw=localStorage.getItem('nolu_auth_trace_v1')||'';
          for(const secret of ['super-secret-token','hunter2','private@example.com','11111111-1111-4111-8111-111111111111','private profile']){
            assert(!raw.includes(secret),`trace leaked sensitive value: ${secret}`);
          }
          const events=trace.snapshot();
          assert(events.length<=80,'trace ring exceeded max size');
          assert(events.some(x=>x.type==='ring-test'),'trace failed to retain events');
          const allowed=new Set(['at','tab','type','reason','status','source','transition','action','outcome','mode','stage','httpStatus','reload','controller','recovered','expired','connectivity','guest']);
          for(const event of events)for(const key of Object.keys(event))assert(allowed.has(key),`unexpected persisted trace field: ${key}`);
          console.log('NOLU_AUTH_TRACE_PRIVACY_OK');
          NODE

      - name: Media guard avoids full-resolution iPhone decode before publish
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('pu-plan/media-input-guard.js').read_text()
          assert 'MAX_EDGE=1600' in s
          convertible=s.split('CONVERTIBLE=new Set(',1)[1].split(']);',1)[0]
          assert 'image/gif' not in convertible
          assert 'resizeWidth:MAX_EDGE' in s
          assert 'if(IOS)return null' in s
          assert "stage:'ios-safe-store'" in s
          assert 'selectIosFiles(input,files)' in s
          assert 'publishIosSafe()' in s
          assert "stage:'ios-safe-upload-start'" in s
          assert "stage:'ios-safe-upload-complete'" in s
          ios_branch=s.split("if(IOS){",1)[1].split("return;",1)[0]
          assert 'stopImmediatePropagation' in ios_branch
          assert 'selectIosFiles' in ios_branch
          assert 'handler.call' not in ios_branch
          assert "20260913-media-input2" in s
          PY

      - name: Trace remains diagnostic only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          s=Path('pu-plan/auth-trace.js').read_text()
          assert 'fetch(' not in s
          assert 'Authorization' not in s
          assert 'puplan_session' not in s
          assert 'email' not in s.lower()
          assert 'password' not in s.lower()
          assert 'uid' not in s.lower()
          assert 'MAX_EVENTS=80' in s
          PY
