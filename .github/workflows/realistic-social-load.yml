name: Realistic social workload benchmark

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/realistic-social-load.yml'

permissions:
  contents: read

jobs:
  benchmark:
    if: contains(github.event.head_commit.message, '[load-realistic]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      API: https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api
      SOCIAL: https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-social-v12
      BENCH_EMAIL: loadbench-20260909-viewer@puplan.test
      BENCH_PASSWORD: Bench-t7U5CW5HdXDg-G9cZcj9CFFiAa9!
    steps:
      - name: Run realistic staged benchmark
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {performance}=require('perf_hooks');
          const API=process.env.API,SOCIAL=process.env.SOCIAL;
          const report={started_at:new Date().toISOString(),fixture:{users:501,friends:500,posts:5000,replies:320,conversations:50,messages:10000},results:[]};
          async function req(url,action,payload={},token=''){
            const st=performance.now();
            try{
              const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{})},body:JSON.stringify({action,...payload}),signal:AbortSignal.timeout(20000)});
              const text=await r.text();
              return {ok:r.ok,status:r.status,ms:performance.now()-st,bytes:Buffer.byteLength(text),text};
            }catch(e){return {ok:false,status:0,ms:performance.now()-st,bytes:0,text:'',error:String(e)}}
          }
          const pct=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.max(0,Math.ceil(s.length*p/100)-1))]||0};
          function summary(name,c,rows,secs){
            const lat=rows.map(x=>x.ms),ok=rows.filter(x=>x.ok).length;
            const x={name,concurrency:c,requests:rows.length,success_rate:+(ok*100/rows.length).toFixed(2),p50_ms:+pct(lat,50).toFixed(1),p95_ms:+pct(lat,95).toFixed(1),p99_ms:+pct(lat,99).toFixed(1),max_ms:+Math.max(...lat).toFixed(1),rps:+(rows.length/secs).toFixed(1),avg_kb:+(rows.reduce((n,x)=>n+x.bytes,0)/rows.length/1024).toFixed(1),http_429:rows.filter(x=>x.status===429).length,http_5xx:rows.filter(x=>x.status>=500).length,http_0:rows.filter(x=>x.status===0).length};
            report.results.push(x);console.log('BENCH '+JSON.stringify(x));return x;
          }
          const bad=x=>x.success_rate<99.5||x.p95_ms>8000||x.http_5xx/Math.max(1,x.requests)>.005;
          async function stage(name,c,fn){const st=performance.now();const rows=await Promise.all(Array.from({length:c},(_,i)=>fn(i)));return summary(name,c,rows,(performance.now()-st)/1000)}
          async function ladder(name,levels,fn){for(const c of levels){const x=await stage(name,c,fn);if(bad(x)){console.log(`STOP ${name} at ${c}`);break}else await new Promise(r=>setTimeout(r,1500))}}
          (async()=>{
            const login=await req(API,'login',{email:process.env.BENCH_EMAIL,password:process.env.BENCH_PASSWORD});
            report.login={status:login.status,ms:+login.ms.toFixed(1),bytes:login.bytes};
            if(!login.ok)throw new Error('benchmark login failed: '+login.status+' '+login.text.slice(0,300));
            const data=JSON.parse(login.text),token=data.token;if(!token)throw new Error('no token');
            const inbox=await req(SOCIAL,'inbox',{},token);if(!inbox.ok)throw new Error('inbox warmup failed');
            const ib=JSON.parse(inbox.text),conversationId=ib.conversations?.[0]?.id;if(!conversationId)throw new Error('no benchmark conversation');
            report.warmup={inbox_ms:+inbox.ms.toFixed(1),inbox_kb:+(inbox.bytes/1024).toFixed(1),conversation_id:conversationId};

            await ladder('feed_read',[100,250,500,1000,2000],()=>req(SOCIAL,'feed',{},token));
            await ladder('conversation_read',[100,250,500,1000,2000],()=>req(SOCIAL,'conversation',{conversation_id:conversationId},token));
            await ladder('inbox_read',[25,50,100,200,400,800],()=>req(SOCIAL,'inbox',{},token));
            await ladder('bootstrap_read',[10,25,50,100,200,400],()=>req(API,'bootstrap',{},token));
            report.finished_at=new Date().toISOString();
          })().catch(e=>{report.fatal=String(e?.stack||e);process.exitCode=1}).finally(()=>fs.writeFileSync('realistic-load.json',JSON.stringify(report,null,2)));
          NODE
      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realistic-social-load
          path: realistic-load.json
          retention-days: 3
