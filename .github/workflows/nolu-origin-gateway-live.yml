name: nolu origin gateway live

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/origin-gateway.js'
      - 'pu-plan/main.js'
      - 'supabase/functions/nolu-browser-gateway-v1/index.ts'
      - '.github/workflows/nolu-origin-gateway-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6

      - name: Verify browser router contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "import './origin-gateway.js'" pu-plan/main.js
          grep -q "nolu-browser-gateway-v1" pu-plan/origin-gateway.js
          grep -q "pu-plan-social" pu-plan/origin-gateway.js
          grep -q "pu-plan-portable-v2" pu-plan/origin-gateway.js
          grep -q "pu-plan-replica-v3" pu-plan/origin-gateway.js
          grep -q "https://nolu.tw" supabase/functions/nolu-browser-gateway-v1/index.ts
          grep -q "https://nolu-8r2.pages.dev" supabase/functions/nolu-browser-gateway-v1/index.ts
          grep -q "MAX_BODY_BYTES = 256_000" supabase/functions/nolu-browser-gateway-v1/index.ts
          grep -q "readBoundedBody" supabase/functions/nolu-browser-gateway-v1/index.ts
          grep -q "TARGET_NOT_ALLOWED" supabase/functions/nolu-browser-gateway-v1/index.ts
          grep -q "METHOD_NOT_ALLOWED" supabase/functions/nolu-browser-gateway-v1/index.ts
          grep -q "X-Forwarded-For" supabase/functions/nolu-browser-gateway-v1/index.ts
          grep -q "X-Nolu-Browser-Gateway', 'v3" supabase/functions/nolu-browser-gateway-v1/index.ts

      - name: Verify deployed frontends contain cloud router
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          check_frontend() {
            local base="$1"
            local ready=0
            for attempt in $(seq 1 24); do
              if curl -fsS --max-time 15 "${base}/main.js?cloudfix=20260911" -o "$tmp" && grep -q "origin-gateway.js" "$tmp"; then
                ready=1
                break
              fi
              sleep 5
            done
            echo "[$base] router_ready=$ready"
            test "$ready" = 1
          }
          check_optional_frontend() {
            local host="$1"
            local base="$2"
            if getent hosts "$host" >/dev/null 2>&1; then
              check_frontend "$base"
            else
              echo "[$base] DNS is not publicly resolvable from this runner; skipping inactive frontend while backend origin support remains tested below."
            fi
          }
          check_frontend 'https://miiduoa.github.io/web'
          check_optional_frontend 'nolu-8r2.pages.dev' 'https://nolu-8r2.pages.dev'
          check_optional_frontend 'nolu.tw' 'https://nolu.tw'

      - name: Verify primary and standby gateways from production origins
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$tmp" "$headers"' EXIT

          check_gateway() {
            local base="$1"
            local origin="$2"
            local code
            : > "$headers"
            code=$(curl -sS --retry 3 --retry-delay 2 --max-time 20 -D "$headers" -o "$tmp" -w '%{http_code}' \
              -X POST "${base}?target=pu-plan-api-v8" \
              -H "Origin: ${origin}" \
              -H 'Content-Type: application/json' \
              --data '{"action":"health"}')
            echo "[$base][$origin] HTTP $code :: $(cat "$tmp")"
            test "$code" = 200
            grep -q '"ok":true' "$tmp"
            tr -d '\r' < "$headers" | grep -Fqi "access-control-allow-origin: ${origin}"
            tr -d '\r' < "$headers" | grep -Fqi 'cache-control: no-store'
          }

          PRIMARY='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/nolu-browser-gateway-v1'
          STANDBY='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/nolu-browser-gateway-v1'
          for origin in 'https://nolu.tw' 'https://nolu-8r2.pages.dev' 'https://miiduoa.github.io'; do
            check_gateway "$PRIMARY" "$origin"
            check_gateway "$STANDBY" "$origin"
          done

      - name: Verify gateway attack and authentication boundaries
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/nolu-browser-gateway-v1'
          ORIGIN='https://miiduoa.github.io'
          tmp=$(mktemp)
          headers=$(mktemp)
          payload=$(mktemp)
          trap 'rm -f "$tmp" "$headers" "$payload"' EXIT

          for target in 'does-not-exist' '../pu-plan-api-v8' '%2e%2e%2fpu-plan-api-v8'; do
            : > "$headers"
            code=$(curl -sS --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' -X POST "${BASE}?target=${target}" \
              -H "Origin: ${ORIGIN}" -H 'Content-Type: application/json' --data '{"action":"health"}')
            echo "[target=$target] HTTP $code :: $(cat "$tmp")"
            test "$code" = 404
            grep -q 'TARGET_NOT_ALLOWED' "$tmp"
          done

          code=$(curl -sS --max-time 15 -o "$tmp" -w '%{http_code}' -X PUT "${BASE}?target=pu-plan-api-v8" \
            -H "Origin: ${ORIGIN}" -H 'Content-Type: application/json' --data '{}')
          echo "[method PUT] HTTP $code :: $(cat "$tmp")"
          test "$code" = 405
          grep -q 'METHOD_NOT_ALLOWED' "$tmp"

          # Keep this well below vendor ingress limits but above Nolu's 256 KB app boundary.
          python3 - <<'PY' > "$payload"
          import json
          print(json.dumps({'action':'health','padding':'x'*280000}))
          PY
          code=$(curl -sS --max-time 12 -o "$tmp" -w '%{http_code}' -X POST "${BASE}?target=pu-plan-api-v8" \
            -H "Origin: ${ORIGIN}" -H 'Content-Type: application/json' --data-binary @"$payload")
          echo "[oversize] HTTP $code :: $(cat "$tmp")"
          test "$code" = 413
          grep -q 'PAYLOAD_TOO_LARGE' "$tmp"

          # The proxy must not turn a public browser request into an authenticated one.
          : > "$headers"
          code=$(curl -sS --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' -X POST "${BASE}?target=pu-plan-api-v8" \
            -H "Origin: ${ORIGIN}" -H 'Content-Type: application/json' --data '{"action":"bootstrap"}')
          echo "[unauth bootstrap] HTTP $code :: $(cat "$tmp")"
          test "$code" = 401
          tr -d '\r' < "$headers" | grep -Fqi "access-control-allow-origin: ${ORIGIN}"

          : > "$headers"
          code=$(curl -sS --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' -X OPTIONS "${BASE}?target=pu-plan-api-v8" \
            -H "Origin: ${ORIGIN}" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: authorization,content-type')
          echo "[preflight] HTTP $code"
          test "$code" = 204
          tr -d '\r' < "$headers" | grep -Fqi "access-control-allow-origin: ${ORIGIN}"
          ! tr -d '\r' < "$headers" | grep -Eqi '^access-control-allow-origin:[[:space:]]*\*'

      - name: Reject untrusted origins
        shell: bash
        run: |
          set -euo pipefail
          URL='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/nolu-browser-gateway-v1?target=pu-plan-api-v8'
          tmp=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$tmp" "$headers"' EXIT
          code=$(curl -sS --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' -X OPTIONS "$URL" \
            -H 'Origin: https://evil.example' \
            -H 'Access-Control-Request-Method: POST')
          echo "[evil] HTTP $code :: $(cat "$tmp")"
          test "$code" = 403
          ! tr -d '\r' < "$headers" | grep -Fqi 'access-control-allow-origin: https://evil.example'
