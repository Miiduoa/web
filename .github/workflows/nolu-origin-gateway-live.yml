name: nolu origin gateway live

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/origin-gateway.js'
      - 'pu-plan/main.js'
      - 'netlify/functions/nolu-mirror.mts'
      - 'supabase/functions/nolu-browser-gateway-v1/index.ts'
      - '.github/workflows/nolu-origin-gateway-live.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6

      - name: Verify browser router contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "import './origin-gateway.js'" pu-plan/main.js
          grep -q "nolu-browser-gateway-v1" pu-plan/origin-gateway.js
          grep -q "pu-plan-social" pu-plan/origin-gateway.js
          grep -q "pu-plan-portable-v2" pu-plan/origin-gateway.js
          grep -q "pu-plan-replica-v3" pu-plan/origin-gateway.js
          grep -q "https://nolu.tw" supabase/functions/nolu-browser-gateway-v1/index.ts
          grep -q "https://nolu-8r2.pages.dev" supabase/functions/nolu-browser-gateway-v1/index.ts

      - name: Verify deployed frontends contain cloud router
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          trap 'rm -f "$tmp"' EXIT
          check_frontend() {
            local base="$1"
            local ready=0
            for attempt in $(seq 1 30); do
              if curl -fsS --max-time 15 "${base}/main.js?cloudfix=20260911" -o "$tmp" && grep -q "origin-gateway.js" "$tmp"; then
                ready=1
                break
              fi
              sleep 5
            done
            echo "[$base] router_ready=$ready"
            test "$ready" = 1
          }
          check_frontend 'https://nolu.tw'
          check_frontend 'https://nolu-8r2.pages.dev'
          check_frontend 'https://miiduoa.github.io/web'

      - name: Verify primary and standby gateways from production origins
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$tmp" "$headers"' EXIT

          check_gateway() {
            local base="$1"
            local origin="$2"
            local code
            : > "$headers"
            code=$(curl -sS --retry 3 --retry-delay 2 --max-time 20 -D "$headers" -o "$tmp" -w '%{http_code}' \
              -X POST "${base}?target=pu-plan-api-v8" \
              -H "Origin: ${origin}" \
              -H 'Content-Type: application/json' \
              --data '{"action":"health"}')
            echo "[$base][$origin] HTTP $code :: $(cat "$tmp")"
            test "$code" = 200
            grep -q '"ok":true' "$tmp"
            tr -d '\r' < "$headers" | grep -Fqi "access-control-allow-origin: ${origin}"
            tr -d '\r' < "$headers" | grep -Fqi 'cache-control: no-store'
          }

          PRIMARY='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/nolu-browser-gateway-v1'
          STANDBY='https://ltfurqaspqsvswmebyzw.supabase.co/functions/v1/nolu-browser-gateway-v1'
          for origin in 'https://nolu.tw' 'https://nolu-8r2.pages.dev' 'https://miiduoa.github.io'; do
            check_gateway "$PRIMARY" "$origin"
            check_gateway "$STANDBY" "$origin"
          done

      - name: Verify Netlify mirror accepts production origins
        shell: bash
        run: |
          set -euo pipefail
          URL='https://nolu-mirror.netlify.app/mirror'
          tmp=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$tmp" "$headers"' EXIT
          for origin in 'https://nolu.tw' 'https://nolu-8r2.pages.dev' 'https://miiduoa.github.io'; do
            ready=0
            for attempt in $(seq 1 30); do
              : > "$headers"
              code=$(curl -sS --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' -X OPTIONS "$URL" \
                -H "Origin: ${origin}" \
                -H 'Access-Control-Request-Method: POST')
              if [ "$code" = 204 ] && tr -d '\r' < "$headers" | grep -Fqi "access-control-allow-origin: ${origin}"; then
                ready=1
                break
              fi
              sleep 5
            done
            echo "[mirror][$origin] cors_ready=$ready"
            test "$ready" = 1
          done

      - name: Reject untrusted origins
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$tmp" "$headers"' EXIT

          URL='https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/nolu-browser-gateway-v1?target=pu-plan-api-v8'
          code=$(curl -sS --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' -X OPTIONS "$URL" \
            -H 'Origin: https://evil.example' \
            -H 'Access-Control-Request-Method: POST')
          echo "[gateway evil] HTTP $code :: $(cat "$tmp")"
          test "$code" = 403
          ! tr -d '\r' < "$headers" | grep -Fqi 'access-control-allow-origin: https://evil.example'

          : > "$headers"
          URL='https://nolu-mirror.netlify.app/mirror'
          code=$(curl -sS --max-time 15 -D "$headers" -o "$tmp" -w '%{http_code}' -X OPTIONS "$URL" \
            -H 'Origin: https://evil.example' \
            -H 'Access-Control-Request-Method: POST')
          echo "[mirror evil] HTTP $code :: $(cat "$tmp")"
          test "$code" = 403
          ! tr -d '\r' < "$headers" | grep -Fqi 'access-control-allow-origin: https://evil.example'
