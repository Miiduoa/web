name: nolu login failover budget smoke

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/main.js'
      - 'pu-plan/login-transport-patience.js'
      - 'pu-plan/login-failover-budget.js'
      - 'pu-plan/resilience.js'
      - 'pu-plan/sw.js'
      - '.github/workflows/nolu-login-failover-budget-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pu-plan/main.js'
      - 'pu-plan/login-transport-patience.js'
      - 'pu-plan/login-failover-budget.js'
      - 'pu-plan/resilience.js'
      - 'pu-plan/sw.js'
      - '.github/workflows/nolu-login-failover-budget-smoke.yml'

permissions:
  contents: read

jobs:
  timing-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - name: Validate login failover timing contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const assert=require('assert');

          (async()=>{
            const main=fs.readFileSync('pu-plan/main.js','utf8');
            const patience=fs.readFileSync('pu-plan/login-transport-patience.js','utf8');
            const budget=fs.readFileSync('pu-plan/login-failover-budget.js','utf8');
            const resilience=fs.readFileSync('pu-plan/resilience.js','utf8');
            const sw=fs.readFileSync('pu-plan/sw.js','utf8');

            assert(main.includes("await import('./resilience.js')"));
            assert(main.includes("await import('./login-failover-budget.js')"));
            assert(main.indexOf("await import('./resilience.js')") < main.indexOf("await import('./login-failover-budget.js')"));
            assert(main.indexOf("await import('./login-failover-budget.js')") < main.indexOf("await import('./offline-session-rescue.js')"));
            assert(sw.includes("'./login-failover-budget.js'"));
            assert(sw.includes('nolu-shell-20260911-login-failover3'));

            assert(patience.includes('hrrmkrayvrgnwcroyttp.supabase.co'));
            assert(patience.includes('ltfurqaspqsvswmebyzw.supabase.co'));
            assert(patience.includes('primaryLoginTimeoutMs:5000'));
            assert(patience.includes('standbyLoginTimeoutMs:6500'));
            assert(patience.includes("DEADLINE_FIELD='__noluLoginDeadline'"));
            assert(budget.includes('OVERALL_LOGIN_TIMEOUT_MS=14000'));
            assert(resilience.includes("const base=preferredCloud()==='standby'?[STANDBY,PRIMARY]:[PRIMARY,STANDBY]"));
            assert(!/NO_STANDBY_ACTIONS[^;]*login/.test(resilience));

            function context(baseFetch){
              const window={fetch:baseFetch};
              window.window=window;
              return vm.createContext({window,location:{href:'https://miiduoa.github.io/web/'},URL,AbortController,DOMException,setTimeout,clearTimeout,Headers,Date,Number,Infinity,console});
            }

            for(const host of ['hrrmkrayvrgnwcroyttp.supabase.co','ltfurqaspqsvswmebyzw.supabase.co']){
              const caller=new AbortController();
              let observedSignal=null;
              const ctx=context(async(_input,opts)=>{observedSignal=opts.signal;return {ok:true};});
              vm.runInContext(patience,ctx);
              await ctx.window.fetch(`https://${host}/functions/v1/pu-plan-api-v8`,{
                method:'POST',body:JSON.stringify({action:'login'}),signal:caller.signal
              });
              assert(observedSignal && observedSignal!==caller.signal, `${host} must replace the short HA hop signal`);
            }

            {
              const caller=new AbortController();
              let observed=null;
              const ctx=context(async(_input,opts)=>{observed=opts;return {ok:true};});
              vm.runInContext(budget,ctx);
              await ctx.window.fetch('https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v6',{
                method:'POST',body:JSON.stringify({action:'login'}),signal:caller.signal
              });
              assert(observed.signal && observed.signal!==caller.signal,'overall budget must replace cloud.js legacy signal');
              assert(Number(observed.__noluLoginDeadline)>Date.now(),'overall budget must propagate a future deadline');
            }

            {
              const caller=new AbortController();
              let observedSignal=null;
              const ctx=context(async(_input,opts)=>{observedSignal=opts.signal;return {ok:true};});
              vm.runInContext(budget,ctx);
              await ctx.window.fetch('https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v6',{
                method:'POST',body:JSON.stringify({action:'bootstrap'}),signal:caller.signal
              });
              assert(observedSignal===caller.signal,'non-login traffic must keep its caller signal');
            }

            {
              let networkOptions=null;
              const ctx=context((_input,opts)=>new Promise((resolve,reject)=>{
                networkOptions=opts;
                opts.signal.addEventListener('abort',()=>reject(new DOMException('Aborted','AbortError')),{once:true});
                setTimeout(()=>resolve({ok:true}),150);
              }));
              vm.runInContext(patience,ctx);
              const started=Date.now();
              await assert.rejects(ctx.window.fetch('https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-api-v8',{
                method:'POST',
                body:JSON.stringify({action:'login'}),
                __noluLoginDeadline:Date.now()+35
              }),e=>e?.name==='AbortError');
              assert(Date.now()-started<250,'per-hop wrapper must honor overall deadline');
              assert(networkOptions && !('__noluLoginDeadline' in networkOptions),'private deadline field must be stripped before native fetch');
            }

            const publicText=`${patience}\n${budget}`;
            assert(!/(password_hash|recovery_hash|service_role|PRIVATE KEY)/i.test(publicText));
            console.log('NOLU_LOGIN_FAILOVER_BUDGET_OK');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
