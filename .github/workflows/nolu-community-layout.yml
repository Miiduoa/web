name: nolu community layout
on:
  pull_request:
    branches: [main]
    paths: ['pu-plan/**', 'tests/product/**', '.github/workflows/nolu-community-layout.yml']
  push:
    branches: [main]
    paths: ['pu-plan/**', 'tests/product/**', '.github/workflows/nolu-community-layout.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: community-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  social-components:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: node --check pu-plan/discover.js
      - name: Install isolated browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise populated social components
        env:
          NOLU_BROWSER: ${{ matrix.browser }}
        run: python tests/product/community_layout.py
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-layout-${{ matrix.browser }}
          path: product-test-results/
          retention-days: 7
