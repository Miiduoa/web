name: nolu mobile weekly timetable
on:
  pull_request:
    branches: [main]
    paths: ['pu-plan/**', 'tests/product/**', '.github/workflows/nolu-mobile-week.yml']
  push:
    branches: [main]
    paths: ['pu-plan/**', 'tests/product/**', '.github/workflows/nolu-mobile-week.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mobile-week-${{ github.ref }}
  cancel-in-progress: true
jobs:
  weekly-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax and placement rules
        run: |
          node --check pu-plan/features/mobile-week.js
          node --check pu-plan/features/direct-edit.js
          TZ=Asia/Taipei node --test tests/product/*.test.mjs
      - name: Install browser
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps ${{ matrix.browser }}
          sudo apt-get install -y fonts-noto-cjk
      - name: Exercise the mobile weekly timetable
        env:
          NOLU_BROWSER: ${{ matrix.browser }}
        run: python tests/product/mobile_week.py
      - name: Preserve source and results
        if: always()
        run: |
          mkdir -p product-test-results
          tar -czf product-test-results/mobile-week-source.tar.gz pu-plan tests/product .github/tests .github/workflows package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-week-${{ matrix.browser }}
          path: product-test-results/
          retention-days: 7
