name: nolu Data API exposure smoke

on:
  push:
    branches: [main, security/nolu-data-api-exposure-20260911]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/nolu-data-api-exposure-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/nolu-data-api-exposure-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nolu-data-api-exposure
  cancel-in-progress: true

jobs:
  data-api-exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PROJECT_URL: https://hrrmkrayvrgnwcroyttp.supabase.co
      PUBLISHABLE_KEY: sb_publishable_jXaj3aY5lPDvLEUBOzAuCQ_eKoAHTKN
    steps:
      - name: Probe anonymous REST and Storage exposure
        shell: bash
        run: |
          set -euo pipefail
          tables=(
            puplan_app_users
            puplan_app_semesters
            puplan_app_schedules
            puplan_app_rate_limits
            puplan_app_friendships
            puplan_app_meetups
            puplan_app_posts
            puplan_app_post_likes
            puplan_app_post_media
            puplan_app_author_affinity
            puplan_app_feed_preferences
            puplan_app_conversation_members
            puplan_app_messages
            puplan_app_conversations
          )

          # Availability is monitored separately. If PostgREST cannot answer at all,
          # exposure is inconclusive rather than evidence that data is public.
          rc=0
          first_code=$(curl -sS --connect-timeout 2 --max-time 4 \
            -o /tmp/gateway-probe.json -w '%{http_code}' \
            "$PROJECT_URL/rest/v1/puplan_app_users?select=id&limit=1" \
            -H "apikey: $PUBLISHABLE_KEY" \
            -H 'Accept: application/json') || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Primary Data API is unreachable; anonymous exposure check is inconclusive (curl=$rc HTTP=${first_code:-000})."
            exit 0
          fi

          failed=0
          reachable=0
          for table in "${tables[@]}"; do
            body="/tmp/rest-${table}.json"
            rc=0
            code=$(curl -sS --connect-timeout 2 --max-time 4 \
              -o "$body" -w '%{http_code}' \
              "$PROJECT_URL/rest/v1/$table?select=*&limit=1" \
              -H "apikey: $PUBLISHABLE_KEY" \
              -H 'Accept: application/json') || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::REST probe became unavailable for $table (curl=$rc HTTP=${code:-000}); result inconclusive."
              continue
            fi

            echo "$table -> HTTP $code"
            if [[ "$code" =~ ^2 ]]; then
              reachable=$((reachable+1))
              compact=$(tr -d '[:space:]' < "$body")
              if [ "$compact" != '[]' ]; then
                echo "::error::Anonymous Data API returned row data from $table"
                cat "$body"
                failed=1
              else
                echo "::warning::Anonymous role can reach $table but RLS currently filters all rows; revoke anon table grants for Edge-only defense in depth."
              fi
            elif [ "$code" -ge 300 ] && [ "$code" -lt 400 ]; then
              echo "::error::Unexpected redirect HTTP $code from $table"
              failed=1
            elif [ "$code" -ge 500 ]; then
              echo "::warning::$table returned HTTP $code; exposure result inconclusive."
            fi
          done

          storage_body=/tmp/storage-list.json
          rc=0
          storage_code=$(curl -sS --connect-timeout 2 --max-time 4 \
            -o "$storage_body" -w '%{http_code}' -X POST \
            "$PROJECT_URL/storage/v1/object/list/puplan-media" \
            -H "apikey: $PUBLISHABLE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{"prefix":"","limit":1,"offset":0}') || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::Storage listing gateway is unreachable; exposure result inconclusive (curl=$rc HTTP=${storage_code:-000})."
          else
            echo "puplan-media listing -> HTTP $storage_code"
            if [[ "$storage_code" =~ ^2 ]]; then
              compact=$(tr -d '[:space:]' < "$storage_body")
              if [ "$compact" != '[]' ]; then
                echo '::error::Anonymous Storage listing returned media metadata'
                cat "$storage_body"
                failed=1
              else
                echo '::warning::Anonymous role can call the media listing endpoint but currently receives no objects.'
              fi
            elif [ "$storage_code" -ge 300 ] && [ "$storage_code" -lt 400 ]; then
              echo "::error::Unexpected Storage redirect HTTP $storage_code"
              failed=1
            elif [ "$storage_code" -ge 500 ]; then
              echo "::warning::Storage returned HTTP $storage_code; exposure result inconclusive."
            fi
          fi

          echo "Anonymous-reachable REST tables with zero visible rows: $reachable"
          [ "$failed" -eq 0 ]

      - name: Probe read-style RPC exposure without mutation
        shell: bash
        run: |
          set -euo pipefail
          failed=0
          probe_rpc() {
            local fn="$1" payload="$2"
            local body="/tmp/rpc-${fn}.json" code rc=0
            code=$(curl -sS --connect-timeout 2 --max-time 4 \
              -o "$body" -w '%{http_code}' -X POST \
              "$PROJECT_URL/rest/v1/rpc/$fn" \
              -H "apikey: $PUBLISHABLE_KEY" \
              -H 'Content-Type: application/json' \
              --data "$payload") || rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::warning::RPC gateway unavailable for $fn; exposure result inconclusive (curl=$rc HTTP=${code:-000})."
              return 0
            fi
            echo "$fn -> HTTP $code"
            if [[ "$code" =~ ^2 ]]; then
              compact=$(tr -d '[:space:]' < "$body")
              if [ "$compact" != '[]' ] && [ "$compact" != 'null' ] && [ "$compact" != '{}' ]; then
                echo "::error::Anonymous RPC $fn returned data"
                cat "$body"
                failed=1
              else
                echo "::warning::Anonymous role can execute RPC $fn; revoke anon EXECUTE unless intentionally public."
              fi
            elif [ "$code" -ge 300 ] && [ "$code" -lt 400 ]; then
              echo "::error::Unexpected RPC redirect HTTP $code for $fn"
              failed=1
            elif [ "$code" -ge 500 ]; then
              echo "::warning::RPC $fn returned HTTP $code; exposure result inconclusive."
            fi
          }

          probe_rpc puplan_latest_replies '{"p_post_ids":[],"p_per_post":1}'
          probe_rpc puplan_inbox_page '{"p_user_id":"00000000-0000-4000-8000-000000000000","p_limit":1,"p_before":null}'
          [ "$failed" -eq 0 ]
