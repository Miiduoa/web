name: nolu Netlify mirror contract

on:
  push:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'netlify.toml'
      - 'netlify/functions/**'
      - 'pu-plan/provider-config.js'
      - '.github/workflows/nolu-netlify-mirror-contract.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'netlify.toml'
      - 'netlify/functions/**'
      - 'pu-plan/provider-config.js'
      - '.github/workflows/nolu-netlify-mirror-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Install locked runtime and type-check dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund typescript @types/node

      - name: Type-check Netlify mirror
        run: >-
          ./node_modules/.bin/tsc netlify/functions/nolu-mirror.mts --noEmit
          --target ES2022 --module NodeNext --moduleResolution NodeNext
          --lib ES2022,DOM --types node --skipLibCheck

      - name: Verify mirror safety contract
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const fn=fs.readFileSync('netlify/functions/nolu-mirror.mts','utf8');
          const cfg=fs.readFileSync('pu-plan/provider-config.js','utf8');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));

          assert.equal(pkg.dependencies['@netlify/blobs'],'11.0.3');
          assert.match(fn,/getStore\(\{ name: "nolu-snapshots", consistency: "strong" \}\)/);
          assert.match(fn,/verifyPortable/);
          assert.match(fn,/subtle\.verify/);
          assert.match(fn,/snapshot owner mismatch/);
          assert.match(fn,/revision conflict/);
          assert.match(fn,/digestSnapshot/);
          assert.match(fn,/timingSafeEqual/);
          assert.match(fn,/snapshot\/\$\{uid\}\/\$\{String\(revision\)\.padStart/);
          assert.match(fn,/ALLOWED_ORIGINS/);
          assert.match(fn,/allowedOrigin\(origin\)/);
          for (const origin of ['https://miiduoa.github.io','https://nolu.tw','https://www.nolu.tw','https://nolu-8r2.pages.dev']) assert.ok(fn.includes(`"${origin}"`),`missing trusted origin ${origin}`);
          assert.match(fn,/\.nolu-8r2\.pages\.dev/);
          assert.match(fn,/path: \["\/mirror", "\/health"\]/);
          assert.match(fn,/https:\/\/miiduoa\.github\.io\/web\/nolu-mesh-jwks\.json/);
          assert.match(cfg,/provider:'netlify'[\s\S]*?https:\/\/nolu-mirror\.netlify\.app\/mirror[\s\S]*?enabled:true/);
          assert.doesNotMatch(fn,/(?:postgres(?:ql)?:\/\/|service_role|PRIVATE KEY|password\s*=)/i);
          console.log('NETLIFY_MIRROR_CONTRACT_OK');
          NODE
