name: Realistic social benchmark through load proxy
on:
  push:
    branches: [main]
    paths: ['.github/workflows/realistic-social-load-proxy.yml']
permissions:
  contents: read
jobs:
  benchmark:
    if: contains(github.event.head_commit.message, '[load-proxy]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOAD: https://hrrmkrayvrgnwcroyttp.supabase.co/functions/v1/pu-plan-load-proxy
    steps:
      - name: Run staged benchmark
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');const {performance}=require('perf_hooks');const LOAD=process.env.LOAD;
          const report={started_at:new Date().toISOString(),fixture:{users:501,friends:500,posts:5000,replies:320,conversations:50,messages:10000},results:[]};
          async function req(action){const s=performance.now();try{const r=await fetch(LOAD,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action}),signal:AbortSignal.timeout(20000)});const text=await r.text();return{ok:r.ok,status:r.status,ms:performance.now()-s,bytes:Buffer.byteLength(text)}}catch(e){return{ok:false,status:0,ms:performance.now()-s,bytes:0,error:String(e)}}}
          const pct=(a,p)=>{const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.max(0,Math.ceil(s.length*p/100)-1))]||0};
          function sum(name,c,rows,sec){const lat=rows.map(x=>x.ms),ok=rows.filter(x=>x.ok).length,x={name,concurrency:c,requests:rows.length,success_rate:+(ok*100/rows.length).toFixed(2),p50_ms:+pct(lat,50).toFixed(1),p95_ms:+pct(lat,95).toFixed(1),p99_ms:+pct(lat,99).toFixed(1),max_ms:+Math.max(...lat).toFixed(1),rps:+(rows.length/sec).toFixed(1),avg_kb:+(rows.reduce((n,x)=>n+x.bytes,0)/rows.length/1024).toFixed(1),http_429:rows.filter(x=>x.status===429).length,http_5xx:rows.filter(x=>x.status>=500).length,http_0:rows.filter(x=>x.status===0).length};report.results.push(x);console.log('BENCH '+JSON.stringify(x));return x}
          const bad=x=>x.success_rate<99.5||x.p95_ms>8000||x.http_5xx/Math.max(1,x.requests)>.005;
          async function stage(name,c,action){const s=performance.now(),rows=await Promise.all(Array.from({length:c},()=>req(action)));return sum(name,c,rows,(performance.now()-s)/1000)}
          async function ladder(name,levels,action){for(const c of levels){const x=await stage(name,c,action);if(bad(x)){report[`${name}_stop`]=c;break}await new Promise(r=>setTimeout(r,1200))}}
          (async()=>{
            for(const a of ['bootstrap','social','feed','inbox','conversation']){const w=await req(a);report[`warm_${a}`]={status:w.status,ms:+w.ms.toFixed(1),kb:+(w.bytes/1024).toFixed(1)}}
            await ladder('feed_read',[100,250,500,1000,2000],'feed');
            await ladder('conversation_read',[100,250,500,1000,2000],'conversation');
            await ladder('inbox_read',[25,50,100,200,400,800],'inbox');
            await ladder('bootstrap_read',[25,50,100,200,400,800],'bootstrap');
            await ladder('social_graph_read',[10,25,50,100,200],'social');
            report.finished_at=new Date().toISOString();
          })().catch(e=>{report.fatal=String(e?.stack||e);process.exitCode=1}).finally(()=>fs.writeFileSync('proxy-load.json',JSON.stringify(report,null,2)));
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realistic-social-proxy-load
          path: proxy-load.json
          retention-days: 3
