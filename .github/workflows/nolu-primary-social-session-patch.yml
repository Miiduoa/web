name: nolu primary social session patch

on:
  push:
    branches: [fix/nolu-replica-v2-client]
    paths:
      - '.github/workflows/nolu-primary-social-session-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/nolu-replica-v2-client
      - name: Route primary-only services through Mumbai-local session
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements={
            'pu-plan/community.js':("const token=()=>localStorage.getItem('puplan_session')||'';","const token=()=>localStorage.getItem('puplan_session_primary_v1')||localStorage.getItem('puplan_session')||'';"),
            'pu-plan/discover.js':("const token=()=>localStorage.getItem('puplan_session')||'';","const token=()=>localStorage.getItem('puplan_session_primary_v1')||localStorage.getItem('puplan_session')||'';"),
            'pu-plan/privacy.js':("const privacyToken=()=>localStorage.getItem('puplan_session')||'';","const privacyToken=()=>localStorage.getItem('puplan_session_primary_v1')||localStorage.getItem('puplan_session')||'';"),
            'pu-plan/admin.js':("const token=()=>localStorage.getItem('puplan_session')||'';","const token=()=>localStorage.getItem('puplan_session_primary_v1')||localStorage.getItem('puplan_session')||'';"),
          }
          for name,(old,new) in replacements.items():
            p=Path(name);s=p.read_text()
            if old not in s: raise SystemExit(f'anchor missing: {name}')
            p.write_text(s.replace(old,new,1))
          PY
          for f in pu-plan/community.js pu-plan/discover.js pu-plan/privacy.js pu-plan/admin.js; do
            node --check "$f"
            grep -q "puplan_session_primary_v1" "$f"
          done
          echo 'Remaining direct canonical-session reads:'
          grep -RFn "localStorage.getItem('puplan_session')" pu-plan --include='*.js' || true
      - name: Commit primary-only auth routing
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pu-plan/community.js pu-plan/discover.js pu-plan/privacy.js pu-plan/admin.js
          git commit -m 'fix(nolu): use primary session for primary-only services'
          git push origin HEAD:fix/nolu-replica-v2-client
