name: Deploy Nolu to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/**'
      - '.github/workflows/pu-plan-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production files
        shell: bash
        run: |
          set -euo pipefail
          node --check pu-plan/app.js
          node --check pu-plan/cloud.js
          node --check pu-plan/social-ui.js
          node --check pu-plan/import.js
          node --check pu-plan/boot.js
          node --check pu-plan/security.js
          node --check pu-plan/auth.js
          node --check pu-plan/pwa.js
          node --check pu-plan/community.js
          node --check pu-plan/discover.js
          node --check pu-plan/planner.js
          node --check pu-plan/admin.js
          node --check pu-plan/privacy.js
          node --check pu-plan/semesters.js
          node --check pu-plan/sw.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          index=Path('pu-plan/index.html').read_text(encoding='utf-8')
          manifest=json.loads(Path('pu-plan/manifest.webmanifest').read_text(encoding='utf-8'))
          required=['style.css','friends.css','community.css','discover.css','admin.css','pwa.css','import.js','boot.js','nolu-icon.svg']
          for item in required:
              assert item in index or item in Path('pu-plan/sw.js').read_text(encoding='utf-8'), f'missing {item}'
          forbidden=['boot-v9.js','import-v10.js','social-v6.css','community-v12.css','admin-v14.css','discovery-v16.css','pwa-v8.css','ai.js']
          for item in forbidden:
              assert item not in index, f'obsolete asset referenced: {item}'
          assert manifest.get('name')=='Nolu'
          assert manifest.get('start_url')=='./' and manifest.get('scope')=='./'
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './pu-plan'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
