name: Deploy nolu to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/**'
      - '.github/workflows/pu-plan-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --experimental-default-type=module --check "$file"; done <<'FILES'
          pu-plan/main.js
          pu-plan/app.js
          pu-plan/core/state.js
          pu-plan/features/schedule.js
          pu-plan/features/friends.js
          pu-plan/features/share.js
          pu-plan/features/analysis.js
          pu-plan/features/navigation.js
          pu-plan/features/settings.js
          pu-plan/features/planner.js
          pu-plan/views/auth.js
          pu-plan/views/shell.js
          pu-plan/views/schedule.js
          pu-plan/views/friends.js
          pu-plan/views/assistant.js
          pu-plan/views/settings.js
          pu-plan/views/dialogs.js
          pu-plan/cloud.js
          pu-plan/cloud-replication.js
          pu-plan/social-ui.js
          pu-plan/import.js
          pu-plan/auth.js
          pu-plan/pwa.js
          pu-plan/community.js
          pu-plan/discover.js
          pu-plan/admin.js
          pu-plan/privacy.js
          pu-plan/semesters.js
          pu-plan/avatar-guard.js
          pu-plan/durable-store.js
          pu-plan/durable-bridge.js
          pu-plan/transport-bridge.js
          pu-plan/resilience.js
          pu-plan/offline-session-rescue.js
          pu-plan/provider-config.js
          pu-plan/provider-mesh.js
          pu-plan/provider-status.js
          pu-plan/sw.js
          FILES
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          root=Path('pu-plan')
          index=(root/'index.html').read_text(encoding='utf-8')
          main=(root/'main.js').read_text(encoding='utf-8')
          sw=(root/'sw.js').read_text(encoding='utf-8')
          manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))
          jwks=json.loads((root/'nolu-mesh-jwks.json').read_text(encoding='utf-8'))

          required_files=[
              'main.js','app.js','nolu-icon.svg','manifest.webmanifest','sw.js','nolu-mesh-jwks.json',
              'avatar-guard.js','durable-store.js','durable-bridge.js','transport-bridge.js','resilience.js','offline-session-rescue.js',
              'cloud-replication.js','provider-config.js','provider-mesh.js','provider-status.js',
              'core/state.js',
              'features/schedule.js','features/friends.js','features/share.js','features/analysis.js','features/navigation.js','features/settings.js','features/planner.js',
              'views/auth.js','views/shell.js','views/schedule.js','views/friends.js','views/assistant.js','views/settings.js','views/dialogs.js',
              'styles/base.css','styles/auth.css','styles/layout.css','styles/schedule.css','styles/assistant.css','styles/dialogs.css',
              'friends.css','community.css','discover.css','admin.css','pwa.css',
              'cloud.js','social-ui.js','import.js','auth.js','semesters.js','community.js','discover.js','admin.js','privacy.js','pwa.js'
          ]
          missing=[p for p in required_files if not (root/p).is_file()]
          assert not missing, f'missing production files: {missing}'

          assert '<div id="app"></div>' in index, 'index must only mount the app shell'
          assert re.search(r'''src=["'](?:\./)?main\.js(?:\?[^"']*)?["']''',index), 'main.js entrypoint missing'
          assert index.count('<script')==1, 'production must have exactly one script entrypoint'
          for css in ['styles/base.css','styles/auth.css','styles/layout.css','styles/schedule.css','styles/assistant.css','styles/dialogs.css']:
              assert css in index, f'index missing {css}'

          for js in root.rglob('*.js'):
              text=js.read_text(encoding='utf-8')
              for spec in re.findall(r'''(?:from\s*|import\s*\()\s*['"](\.{1,2}/[^'"]+)['"]''',text):
                  candidate=(js.parent/spec).resolve()
                  assert candidate.is_file(), f'{js.relative_to(root)} imports missing {spec}'

          obsolete_files=[
              'style.css','boot.js','security.js','planner.js','styles/mobile.css',
              'boot-v9.js','import-v10.js','social-v6.css','community-v12.css','admin-v14.css','discovery-v16.css','pwa-v8.css','ai.js'
          ]
          returned=[p for p in obsolete_files if (root/p).exists()]
          assert not returned, f'obsolete production files returned: {returned}'
          versioned=[str(p.relative_to(root)) for p in root.rglob('*') if p.is_file() and re.search(r'(?:^|[-_])v\d+(?:\.|[-_])',p.name,re.I)]
          assert not versioned, f'versioned override files are not allowed: {versioned}'

          def exact_asset_reference(text,item):
              for ref in re.findall(r'''['"]([^'"]+)['"]''',text):
                  path=ref.split('?',1)[0].split('#',1)[0]
                  if path in {item,f'./{item}',f'/{item}'}:
                      return True
              return False
          for item in obsolete_files:
              assert not exact_asset_reference(index,item) and not exact_asset_reference(sw,item), f'obsolete asset referenced: {item}'

          for module in [
              './features/planner.js','./auth.js','./community.js','./discover.js','./pwa.js',
              './avatar-guard.js','./durable-bridge.js','./transport-bridge.js','./resilience.js',
              './offline-session-rescue.js','./cloud-replication.js','./provider-mesh.js','./provider-status.js'
          ]:
              assert module in main, f'main.js missing runtime module {module}'
          assert 'boot.js' not in main, 'legacy bootstrap reference returned'

          assert manifest.get('name')=='nolu'
          assert manifest.get('short_name')=='nolu'
          assert manifest.get('start_url')=='./' and manifest.get('scope')=='./'
          assert len(jwks.get('keys',[]))>=1, 'provider mesh JWKS missing public verification key'
          key=jwks['keys'][0]
          assert key.get('kty')=='EC' and key.get('crv')=='P-256' and key.get('alg')=='ES256', 'provider mesh JWKS must use ES256'
          assert 'd' not in key, 'private signing key must never be published in JWKS'
          for asset in ['nolu-icon.svg','durable-store.js','durable-bridge.js','transport-bridge.js','resilience.js','offline-session-rescue.js','provider-config.js','provider-mesh.js','provider-status.js','nolu-mesh-jwks.json']:
              assert asset in sw, f'service worker missing offline asset {asset}'
          assert 'style.css' not in sw and 'boot.js' not in sw
          assert 'PU/PLAN' not in index and 'PU PLAN' not in index
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './pu-plan'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
