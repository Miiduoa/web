name: Deploy nolu to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/**'
      - '.github/workflows/pu-plan-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify production files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do node --experimental-default-type=module --check "$file"; done <<'FILES'
          pu-plan/main.js
          pu-plan/app.js
          pu-plan/core/state.js
          pu-plan/features/schedule.js
          pu-plan/features/friends.js
          pu-plan/features/share.js
          pu-plan/features/analysis.js
          pu-plan/features/navigation.js
          pu-plan/features/settings.js
          pu-plan/views/auth.js
          pu-plan/views/shell.js
          pu-plan/views/schedule.js
          pu-plan/views/friends.js
          pu-plan/views/assistant.js
          pu-plan/views/settings.js
          pu-plan/views/dialogs.js
          pu-plan/cloud.js
          pu-plan/social-ui.js
          pu-plan/import.js
          pu-plan/boot.js
          pu-plan/security.js
          pu-plan/auth.js
          pu-plan/pwa.js
          pu-plan/community.js
          pu-plan/discover.js
          pu-plan/planner.js
          pu-plan/admin.js
          pu-plan/privacy.js
          pu-plan/semesters.js
          pu-plan/sw.js
          FILES
          python3 - <<'PY'
          from pathlib import Path
          import json,re

          root=Path('pu-plan')
          index=(root/'index.html').read_text(encoding='utf-8')
          sw=(root/'sw.js').read_text(encoding='utf-8')
          manifest=json.loads((root/'manifest.webmanifest').read_text(encoding='utf-8'))

          required_files=[
              'main.js','app.js','nolu-icon.svg','manifest.webmanifest','sw.js',
              'core/state.js',
              'features/schedule.js','features/friends.js','features/share.js','features/analysis.js','features/navigation.js','features/settings.js',
              'views/auth.js','views/shell.js','views/schedule.js','views/friends.js','views/assistant.js','views/settings.js','views/dialogs.js',
              'styles/base.css','styles/auth.css','styles/layout.css','styles/schedule.css','styles/assistant.css','styles/dialogs.css','styles/mobile.css',
              'friends.css','community.css','discover.css','admin.css','pwa.css',
              'cloud.js','social-ui.js','import.js','boot.js','security.js','auth.js','semesters.js','community.js','discover.js','planner.js','admin.js','privacy.js','pwa.js'
          ]
          missing=[p for p in required_files if not (root/p).is_file()]
          assert not missing, f'missing production files: {missing}'

          assert '<div id="app"></div>' in index, 'index must only mount the app shell'
          assert 'src="main.js"' in index, 'main.js entrypoint missing'
          for css in ['styles/base.css','styles/auth.css','styles/layout.css','styles/schedule.css','styles/assistant.css','styles/dialogs.css','styles/mobile.css']:
              assert css in index, f'index missing {css}'

          # Make broken local ESM imports fail the deployment before users see them.
          for js in root.rglob('*.js'):
              text=js.read_text(encoding='utf-8')
              for spec in re.findall(r'''(?:from\s*|import\s*\()\s*['"](\.{1,2}/[^'"]+)['"]''',text):
                  candidate=(js.parent/spec).resolve()
                  assert candidate.is_file(), f'{js.relative_to(root)} imports missing {spec}'

          # Old monolithic/override generations must not return.
          assert not (root/'style.css').exists(), 'obsolete monolithic style.css returned'
          forbidden_refs=['boot-v9.js','import-v10.js','social-v6.css','community-v12.css','admin-v14.css','discovery-v16.css','pwa-v8.css','ai.js','style.css']
          for item in forbidden_refs:
              assert item not in index and item not in sw, f'obsolete asset referenced: {item}'

          assert manifest.get('name')=='nolu'
          assert manifest.get('short_name')=='nolu'
          assert manifest.get('start_url')=='./' and manifest.get('scope')=='./'
          for module in ['core/state.js','features/schedule.js','features/friends.js','features/share.js','features/analysis.js','features/navigation.js','features/settings.js']:
              assert module in sw, f'PWA cache missing required module: {module}'
          assert 'styles/auth.css' in sw and 'views/auth.js' in sw and 'style.css' not in sw
          assert 'PU/PLAN' not in index and 'PU PLAN' not in index
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './pu-plan'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
