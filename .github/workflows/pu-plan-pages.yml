name: Deploy hang. to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pu-plan/**'
      - '.github/workflows/pu-plan-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Verify and prepare site
        run: |
          node --check pu-plan/app.js
          node --check pu-plan/cloud.js
          node --check pu-plan/import-v10.js
          node --check pu-plan/boot-v9.js
          node --check pu-plan/security-v17.js
          node --check pu-plan/auth-v13.js
          node --check pu-plan/pwa-v9.js
          node --check pu-plan/community-v12.js
          node --check pu-plan/social-router-v12.js
          node --check pu-plan/social-experience-v18.js
          node --check pu-plan/discovery-v16.js
          node --check pu-plan/planner-v14.js
          node --check pu-plan/admin-v14.js
          node --check pu-plan/language-v14.js
          node --check pu-plan/brand-v18.js
          node --check pu-plan/privacy-v19.js
          node --check pu-plan/ui-v19.js
          node --check pu-plan/polish-v9.js
          node --check pu-plan/sw-v9.js
          node --check pu-plan/next-round.js
          node --check pu-plan/hang.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pu-plan/index.html')
          s = p.read_text(encoding='utf-8')
          security = '<meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src \'self\'; script-src \'self\' https://cdn.jsdelivr.net \'wasm-unsafe-eval\'; style-src \'self\' \'unsafe-inline\'; img-src \'self\' data: blob: https://hrrmkrayvrgnwcroyttp.supabase.co; media-src \'self\' blob: https://hrrmkrayvrgnwcroyttp.supabase.co; connect-src \'self\' https://hrrmkrayvrgnwcroyttp.supabase.co https://cdn.jsdelivr.net https://raw.githubusercontent.com https://tessdata.projectnaptha.com; worker-src \'self\' blob: https://cdn.jsdelivr.net; font-src \'self\' data:; object-src \'none\'; base-uri \'self\'; form-action \'self\'; frame-src \'none\'; upgrade-insecure-requests">'
          if 'Content-Security-Policy' not in s:
              s = s.replace('</head>', security + '\n</head>')
          additions = '''
          <link rel="stylesheet" href="social-v6.css">
          <link rel="stylesheet" href="ui-v9.css">
          <link rel="stylesheet" href="product-v9.css">
          <link rel="stylesheet" href="brand-v18.css">
          <link rel="stylesheet" href="ui-v19.css">
          <link rel="manifest" href="manifest-v9.webmanifest">
          <link rel="apple-touch-icon" href="hang-icon.svg">'''
          if 'ui-v19.css' not in s:
              s = s.replace('<link rel="stylesheet" href="style.css">', '<link rel="stylesheet" href="style.css">' + additions)
          s = s.replace('<link rel="apple-touch-icon" href="icon.svg">', '<link rel="apple-touch-icon" href="hang-icon.svg">')
          s = s.replace('<script type="module" src="import.js"></script>', '<script type="module" src="import-v10.js"></script>')
          s = s.replace('<script type="module" src="ai.js"></script>', '')
          s = s.replace('<script type="module" src="hang.js"></script>', '')
          if '<script type="module" src="boot-v9.js"></script>' not in s:
              s = s.replace('</body>', '<script type="module" src="boot-v9.js"></script>\n</body>')
          p.write_text(s, encoding='utf-8')
          PY
          grep -q 'Content-Security-Policy' pu-plan/index.html
          grep -q 'hang-icon.svg' pu-plan/index.html
          grep -q 'ui-v19.css' pu-plan/index.html
          ! grep -q 'src="ai.js"' pu-plan/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: './pu-plan'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
