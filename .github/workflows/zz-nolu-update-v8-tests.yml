name: nolu update v8 tests

on:
  push:
    branches: [fix/nolu-replica-v2-client]
    paths:
      - '.github/workflows/zz-nolu-update-v8-tests.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/nolu-replica-v2-client
      - name: Update stale v7 test fixtures to active v8
        shell: bash
        run: |
          set -euo pipefail
          files=(.github/workflows/nolu-durable-sync-smoke.yml .github/workflows/nolu-resilience-race-smoke.yml .github/workflows/nolu-resilience-v3-smoke.yml .github/workflows/nolu-avatar-security-smoke.yml)
          for file in "${files[@]}"; do
            grep -q 'pu-plan-api-v7' "$file"
            sed -i 's/pu-plan-api-v7/pu-plan-api-v8/g; s/Mumbai v7 should be attempted/Mumbai v8 should be attempted/g' "$file"
          done
          python3 -c "from pathlib import Path; p=Path('.github/workflows/nolu-avatar-security-smoke.yml'); s=p.read_text(); old=\"if(parsed.pathname.endsWith('/functions/v1/pu-plan-api-v8'))return respond({error:'DISABLED'},410);\"; new=\"if(parsed.pathname.endsWith('/functions/v1/pu-plan-api-v8')){ if(parsed.hostname==='hrrmkrayvrgnwcroyttp.supabase.co'){ if(action==='login'||action==='bootstrap')return respond(bundle()); if(action==='social')return respond({social:bundle().social}); } return respond({message:'standby not seeded in avatar test'},503); }\"; assert old in s; p.write_text(s.replace(old,new,1))"
          for file in "${files[@]}"; do
            grep -q 'pu-plan-api-v8' "$file"
            if grep -q 'pu-plan-api-v7' "$file"; then exit 1; fi
          done
      - name: Commit updated tests and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/zz-nolu-update-v8-tests.yml
          git add .github/workflows/nolu-durable-sync-smoke.yml .github/workflows/nolu-resilience-race-smoke.yml .github/workflows/nolu-resilience-v3-smoke.yml .github/workflows/nolu-avatar-security-smoke.yml
          git commit -m 'test(nolu): align HA fixtures with v8 routing'
          git push origin HEAD:fix/nolu-replica-v2-client
