name: nolu replication client smoke

on:
  pull_request:
    paths:
      - 'pu-plan/cloud-replication.js'
      - 'pu-plan/provider-status.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - '.github/workflows/nolu-replication-client-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'pu-plan/cloud-replication.js'
      - 'pu-plan/provider-status.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - '.github/workflows/nolu-replication-client-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replica-client-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse JavaScript
        run: |
          node --check pu-plan/cloud-replication.js
          node --check pu-plan/provider-status.js
          node --check pu-plan/sw.js
          node --check pu-plan/pwa.js
      - name: Require replica v3 and reject retired v2
        run: |
          grep -q "pu-plan-replica-v3" pu-plan/cloud-replication.js
          ! grep -q "pu-plan-replica-v2" pu-plan/cloud-replication.js
      - name: Fail closed on standby reverse sync
        run: |
          grep -q "tier!=='primary'" pu-plan/cloud-replication.js
          grep -q "reverse replication is intentionally disabled" pu-plan/cloud-replication.js
          grep -q "manualReconcileRequired" pu-plan/cloud-replication.js
          grep -q "hasStandbyDirty" pu-plan/cloud-replication.js
          ! grep -q "STANDBY_SYNC" pu-plan/cloud-replication.js
      - name: Surface unresolved failback state to the user
        run: |
          grep -q "nolu:replica-manual-reconcile-required" pu-plan/provider-status.js
          grep -q "manualReconcileRequired" pu-plan/provider-status.js
          grep -q "已停止自動回切覆寫" pu-plan/provider-status.js
      - name: Keep installed PWA on current replica v3 shell
        run: |
          grep -q "nolu-shell-20260911-device-rescue2-mesh4" pu-plan/sw.js
          grep -q "nolu_shell_reload_20260911_device_rescue2_mesh4" pu-plan/pwa.js
          grep -q "'./cloud-replication.js'" pu-plan/sw.js
          grep -q "'./session-recovery.js'" pu-plan/sw.js
