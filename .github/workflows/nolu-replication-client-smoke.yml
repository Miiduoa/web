name: nolu replication client smoke

on:
  pull_request:
    paths:
      - 'pu-plan/cloud-replication.js'
      - 'pu-plan/provider-status.js'
      - 'pu-plan/outage-mirror-bridge.js'
      - 'pu-plan/origin-gateway.js'
      - 'pu-plan/media-failback-guard.js'
      - 'pu-plan/login-failover-budget.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - 'pu-plan/index.html'
      - '.github/workflows/nolu-replication-client-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'pu-plan/cloud-replication.js'
      - 'pu-plan/provider-status.js'
      - 'pu-plan/outage-mirror-bridge.js'
      - 'pu-plan/origin-gateway.js'
      - 'pu-plan/media-failback-guard.js'
      - 'pu-plan/login-failover-budget.js'
      - 'pu-plan/sw.js'
      - 'pu-plan/pwa.js'
      - 'pu-plan/index.html'
      - '.github/workflows/nolu-replication-client-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replica-client-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Parse JavaScript
        run: |
          node --check pu-plan/cloud-replication.js
          node --check pu-plan/provider-status.js
          node --check pu-plan/outage-mirror-bridge.js
          node --check pu-plan/origin-gateway.js
          node --check pu-plan/media-failback-guard.js
          node --check pu-plan/login-failover-budget.js
          node --check pu-plan/sw.js
          node --check pu-plan/pwa.js
      - name: Require replica v3 and reject retired v2
        run: |
          grep -q "pu-plan-replica-v3" pu-plan/cloud-replication.js
          ! grep -q "pu-plan-replica-v2" pu-plan/cloud-replication.js
      - name: Require trusted automatic failback before primary reseed
        run: |
          grep -q "pu-plan-failback-v1" pu-plan/cloud-replication.js
          grep -q "reconcileStandby" pu-plan/cloud-replication.js
          grep -q "hasStandbyDirty" pu-plan/cloud-replication.js
          grep -q "primary-returned" pu-plan/cloud-replication.js
          grep -q "nolu:replica-failback-complete" pu-plan/cloud-replication.js
          grep -q "nolu:standby-write" pu-plan/cloud-replication.js
          ! grep -q "markStandbyDirty('standby-active',true)" pu-plan/cloud-replication.js
          ! grep -q "STANDBY_SYNC" pu-plan/cloud-replication.js
      - name: Keep failback failure visible instead of silently overwriting
        run: |
          grep -q "manualReconcileRequired" pu-plan/cloud-replication.js
          grep -q "automatic-failback-failed" pu-plan/cloud-replication.js
          grep -q "nolu:replica-manual-reconcile-required" pu-plan/provider-status.js
          grep -q "pu-plan-media-failback-v1" pu-plan/media-failback-guard.js
          grep -q "return baseFetch(input,init)" pu-plan/media-failback-guard.js
      - name: Keep installed PWA on current shell
        run: |
          grep -q "nolu-shell-20260912-media-failback1" pu-plan/sw.js
          grep -q "nolu_shell_reload_20260912_media_failback1" pu-plan/pwa.js
          grep -q "20260912-media-failback1" pu-plan/index.html
          grep -q "nolu-browser-gateway-v1" pu-plan/origin-gateway.js
          grep -q "media-failback-guard.js" pu-plan/origin-gateway.js
          grep -q "OVERALL_LOGIN_TIMEOUT_MS=14000" pu-plan/login-failover-budget.js
          grep -q "'./login-failover-budget.js'" pu-plan/sw.js
          grep -q "'./media-failback-guard.js'" pu-plan/sw.js
          grep -q "'./cloud-replication.js'" pu-plan/sw.js
          grep -q "'./session-recovery.js'" pu-plan/sw.js
          grep -q "'./outage-mirror-bridge.js'" pu-plan/sw.js
