name: Final Nolu source polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nolu-final-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Remove remaining legacy copy
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('pu-plan/app.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<small>TIME</small>','<small>時間</small>')
          s=s.replace('<small>WEEK</small>','<small>本週</small>')
          s=s.replace('${cs.length} COURSES','${cs.length} 門課')
          s=s.replace('FREE DAY / 無課','今天無課')
          s=s.replace("title||'MY SEMESTER'","title||'我的學期'")
          s=s.replace("return 'PU1-'+btoa(raw)","return 'NL1-'+btoa(raw)")
          old="if(!s.startsWith('PU1-'))throw Error('好友碼格式不正確');let b=s.slice(4).replace(/-/g,'+').replace(/_/g,'/');"
          new="const prefix=s.startsWith('NL1-')?'NL1-':s.startsWith('PU1-')?'PU1-':'';if(!prefix)throw Error('好友碼格式不正確');let b=s.slice(prefix.length).replace(/-/g,'+').replace(/_/g,'/');"
          if old not in s: raise SystemExit('share decoder pattern not found')
          s=s.replace(old,new)
          s=s.replace('PU/PLAN','Nolu')
          s=s.replace("let map={schedule:['MY WEEK / PU PLAN','我的課表'],friends:['FRIENDS / CHECK THEIR WEEK','好友課表'],ai:['LOCAL AI / ZERO API FEE','AI 助理'],settings:['SHARE / YOUR WEEK','分享設定']};","let map={schedule:['','我的課表'],friends:['','找人'],ai:['','安排'],settings:['','我的']};")
          p.write_text(s,encoding='utf-8')

          # Clean old visible branding wherever it remains, without renaming storage/API compatibility identifiers.
          for path in Path('pu-plan').glob('*'):
            if path.suffix.lower() not in {'.js','.html','.css','.webmanifest','.svg'}: continue
            text=path.read_text(encoding='utf-8')
            text=text.replace('PU/PLAN','Nolu')
            path.write_text(text,encoding='utf-8')

          # Chinese display faces need real leading on mobile; 1.0 looked visibly collided on iPhone.
          css=Path('pu-plan/style.css')
          x=css.read_text(encoding='utf-8')
          x=x.replace('font-size:42px!important;line-height:1!important;max-width:360px','font-size:40px!important;line-height:1.12!important;max-width:360px')
          x=x.replace('.auth-poster h2{font-size:38px!important}', '.auth-poster h2{font-size:36px!important;line-height:1.12!important}')
          css.write_text(x,encoding='utf-8')
          PY

          # This is intentionally a one-off source migration.
          git rm -f .github/workflows/nolu-final-polish.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          node --check pu-plan/app.js
          ! grep -R --exclude-dir=.git -n 'PU/PLAN' pu-plan
          git config user.name "Miiduoa"
          git config user.email "107848266+Miiduoa@users.noreply.github.com"
          git add -A
          git commit -m "Polish Nolu mobile login and remove legacy visible copy"
          git push origin HEAD:main
