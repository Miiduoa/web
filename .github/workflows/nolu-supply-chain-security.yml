name: nolu supply chain security

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/dependabot.yml'
      - '.github/workflows/nolu-supply-chain-security.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/dependabot.yml'
      - '.github/workflows/nolu-supply-chain-security.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    name: dependency audit and secret hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          package-manager-cache: false

      - name: Validate dependency contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.engines?.node !== '>=22.12.0') throw new Error('Node runtime contract drifted');
          if (pkg.dependencies?.['@netlify/blobs'] !== '11.0.3') throw new Error('@netlify/blobs must remain exactly pinned');
          if (lock.lockfileVersion < 3) throw new Error('package-lock must use lockfileVersion 3+');
          const root = lock.packages?.[''];
          if (root?.dependencies?.['@netlify/blobs'] !== '11.0.3') throw new Error('lockfile root dependency drifted');
          const installed = lock.packages?.['node_modules/@netlify/blobs']?.version;
          if (installed !== '11.0.3') throw new Error(`unexpected @netlify/blobs resolution: ${installed}`);
          console.log('dependency contract validated');
          NODE

      - name: Install exactly resolved dependencies
        run: npm ci --ignore-scripts --no-fund

      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high

      - name: Scan tracked source for high-confidence committed secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, sys

          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          tracked = [p for p in tracked if p]
          patterns = {
              'private key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'GitHub classic token': re.compile(r'gh' + r'[pousr]_[A-Za-z0-9]{36,}'),
              'GitHub fine-grained token': re.compile(r'github_' + r'pat_[A-Za-z0-9_]{30,}'),
              'OpenAI secret key': re.compile(r'sk-' + r'(?:proj-)?[A-Za-z0-9_-]{32,}'),
              'literal Supabase service-role secret': re.compile(r'SUPABASE_SERVICE_ROLE_KEY\s*[:=]\s*["\']eyJ[A-Za-z0-9._-]{40,}["\']'),
          }
          findings = []
          for name in tracked:
              path = Path(name)
              try:
                  raw = path.read_bytes()
                  if b'\x00' in raw:
                      continue
                  text = raw.decode('utf-8')
              except (OSError, UnicodeDecodeError):
                  continue
              for label, rx in patterns.items():
                  for match in rx.finditer(text):
                      line = text.count('\n', 0, match.start()) + 1
                      findings.append(f'{name}:{line}: {label}')
          if findings:
              print('High-confidence secret material found in tracked files:', file=sys.stderr)
              print('\n'.join(findings), file=sys.stderr)
              raise SystemExit(1)
          print(f'secret hygiene scan passed across {len(tracked)} tracked files')
          PY

  codeql:
    name: CodeQL JavaScript security-extended
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
